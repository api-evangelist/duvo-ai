aid: duvo-ai
name: Duvo Ai
description: >-
  Duvo (taskcrew Inc.) is a process intelligence and automation platform that
  captures how work really happens, reveals improvement and transformation
  opportunities, and delivers reliable governed automation across existing
  enterprise systems. It builds evidence-backed process catalogues, role-specific
  training, improvement plans, transformation roadmaps, and SAP migration fact
  bases, then runs cross-system operational workflows — purchase orders, invoice
  matching, inventory exceptions, supplier onboarding, master data — through
  agents, queues, human approvals, files, webhooks, and browser automation. Duvo
  exposes a 213-operation workspace-scoped public API (api.duvo.ai), a hosted MCP
  server, an official CLI, agent skills, and a full agent-native discovery
  surface (.well-known agent + MCP cards, llms.txt). Backed by Northzone.
url: https://raw.githubusercontent.com/api-evangelist/duvo-ai/refs/heads/main/apis.yml
