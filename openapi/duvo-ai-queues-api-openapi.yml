                        minLength: 3
                        maxLength: 80
                        description: Short, human-readable Pass/Fail rubric title.
                      description:
                        type: string
                        minLength: 20
                        maxLength: 400
                        description: A 1-2 sentence Pass condition phrased as a question.
                    required:
                    - title
                    - description
                    additionalProperties: false
                  description: The complete case-level rubric set for the queue's current version (at least 1 rubric). Replaces every existing rubric.
