    delete:
      operationId: deleteQueue
      tags:
      - Queues
      description: Delete a queue. Interrupts all associated active runs first and returns the number of deleted cases plus the IDs of runs that were stopped.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: queue_id
        required: true
        description: The queue's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted_case_count:
                    type: number
                  interrupted_run_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                required:
                - success
                - deleted_case_count
                - interrupted_run_ids
                additionalProperties: false
        '400':
          description: Default Response
