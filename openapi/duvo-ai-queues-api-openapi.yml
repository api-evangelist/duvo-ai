                                - operator
                                additionalProperties: false
                            order:
                              maxItems: 8
                              type: array
                              items:
                                type: object
                                properties:
                                  field:
                                    type: string
                                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
                                  direction:
                                    type: string
                                    enum:
                                    - asc
                                    - desc
                                required:
                                - field
                                - direction
                                additionalProperties: false
                            caseFilters:
                              type: object
                              properties:
                                createdAtFrom:
                                  type: string
                                  format: date-time
                                createdAtTo:
                                  type: string
                                  format: date-time
                                statuses:
                                  minItems: 1
                                  maxItems: 10
                                  type: array
                                  items:
                                    type: string
