                                    - in_progress
                                    - needs_input
                                    - postponed
                                    - evaluating
                                    - success
                                    - issues
                                    - completed
                                    - failed
                                    - canceled
                                priorities:
                                  minItems: 1
                                  maxItems: 3
                                  type: array
                                  items:
                                    type: string
                                    enum:
                                    - none
                                    - medium
                                    - high
                                labelIds:
                                  minItems: 1
                                  maxItems: 100
                                  type: array
                                  items:
                                    type: string
                                    format: uuid
                              additionalProperties: false
                            limit:
                              type: integer
                              minimum: 1
                              maximum: 500
                          required:
                          - name
                          - measures
                          additionalProperties: false
                        definition_hash:
                          type: string
                        maximum_stale_age_seconds:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        created_at:
                          type: string
                        updated_at:
                          type: string
                      required:
                      - id
                      - queue_id
                      - schema_family_id
                      - schema_id
                      - schema_version
                      - definition
                      - definition_hash
                      - maximum_stale_age_seconds
                      - created_at
                      - updated_at
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  limit:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  offset:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
