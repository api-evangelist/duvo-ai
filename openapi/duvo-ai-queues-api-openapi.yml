    patch:
      operationId: updateQueue
      tags:
      - Queues
      description: Update a queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: New queue name. A standalone queue's name must be unique within the team, and a queue inside an automation's name must be unique within that automation. Queue names are not versioned, so this is the canonical name on any Automations workspace team, with or without revisions. A revision carrying a per-revision name override applies it over this one when that revision is activated.
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  description: New description, or null to clear.
                  type:
                  - string
                  - 'null'
                  maxLength: 500
                folder_id:
                  description: New folder id, or null to move to the root.
                  type:
                  - string
                  - 'null'
                  format: uuid
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: queue_id
        required: true
        description: The queue's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  queue:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      description:
                        type:
                        - string
                        - 'null'
                      folder_id:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      automation_id:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      team_id:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type: string
                      created_by:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                          name:
                            type:
                            - string
                            - 'null'
                          email:
                            type: string
                        required:
                        - id
                        - name
                        - email
                        additionalProperties: false
                      has_approvals:
                        type: boolean
                    required:
                    - id
                    - name
                    - description
                    - folder_id
                    - created_at
                    - has_approvals
                    additionalProperties: false
                required:
                - queue
                additionalProperties: false
        '400':
          description: Default Response
          content:
