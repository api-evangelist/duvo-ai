openapi: 3.2.0
info:
  title: Duvo Public Queues API
  description: 'Public API for programmatic access to Duvo. Authenticate with API keys created in the Duvo dashboard.


    ## Rate limits


    Requests are counted per API key. Every response advertises the quota with the IETF RateLimit fields, so a client can self-throttle without waiting for a rejection:


    - `RateLimit-Policy: "default";q=;w=` — the policy in force: `q` requests per `w` seconds.

    - `RateLimit: "default";r=;t=` — the live state: `r` requests left, quota resetting in `t` seconds.

    - Read the quota from the headers rather than hard-coding it; it differs per environment.

    - The same numbers are also sent as `ratelimit-limit`, `ratelimit-remaining` and `ratelimit-reset`.


    Once the quota is exhausted the API answers `429 Too Many Requests` with `Retry-After` set to the seconds to wait; honor it instead of retrying immediately.'
  version: 1.0.0
servers:
- url: https://api.duvo.ai
  description: Production server
tags:
- name: Queues
  description: Manage queues and their agent bindings
paths:
  /v2/queues/{queue_id}:
    get:
      operationId: getQueue
      tags:
      - Queues
      description: Get a queue by ID.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: queue_id
        required: true
        description: The queue's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  queue:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      description:
                        type:
                        - string
                        - 'null'
                      folder_id:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      automation_id:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      team_id:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type: string
                      created_by:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                          name:
                            type:
                            - string
                            - 'null'
                          email:
                            type: string
                        required:
                        - id
                        - name
                        - email
                        additionalProperties: false
                      has_approvals:
                        type: boolean
                    required:
                    - id
                    - name
                    - description
                    - folder_id
                    - created_at
                    - has_approvals
                    additionalProperties: false
                required:
                - queue
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
