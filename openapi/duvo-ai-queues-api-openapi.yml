                                    - sum
                                    - avg
                                    - min
                                    - max
                                    - count_distinct
                                    - p50
                                    - p90
                                    - p95
                                    - p99
                                  path:
                                    type: string
                                    pattern: ^\$(\.[A-Za-z_][A-Za-z0-9_]{0,63})+$
                                required:
                                - name
                                - operation
                                additionalProperties: false
                            dimensions:
                              maxItems: 4
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
                                  path:
                                    type: string
                                    pattern: ^\$(\.[A-Za-z_][A-Za-z0-9_]{0,63})+$
                                required:
                                - name
                                - path
                                additionalProperties: false
                            timeDimension:
                              type: object
                              properties:
                                name:
                                  type: string
                                  pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
                                path:
                                  type: string
                                  pattern: ^\$(\.[A-Za-z_][A-Za-z0-9_]{0,63})+$
                                granularity:
                                  type: string
                                  enum:
                                  - hour
                                  - day
                                  - week
                                  - month
                                  - quarter
                                  - year
                              required:
                              - name
                              - path
                              - granularity
                              additionalProperties: false
                            filters:
                              maxItems: 12
                              type: array
                              items:
                                type: object
                                properties:
                                  path:
                                    type: string
                                    pattern: ^\$(\.[A-Za-z_][A-Za-z0-9_]{0,63})+$
                                  operator:
                                    type: string
                                    enum:
                                    - equals
                                    - notEquals
                                    - in
                                    - notIn
                                    - gt
                                    - gte
                                    - lt
                                    - lte
                                    - contains
                                    - isSet
                                    - isNotSet
                                  value:
                                    anyOf:
                                    - anyOf:
                                      - type: string
                                      - type: number
                                      - type: boolean
                                    - minItems: 1
                                      maxItems: 100
                                      type: array
                                      items:
                                        anyOf:
                                        - type: string
                                        - type: number
                                        - type: boolean
                                required:
