  /v2/agents/{agent_id}/duplicate:
    post:
      operationId: duplicateAgent
      tags:
      - Agents
      description: Duplicate an existing agent into a new agent named "Copy of ", carrying over its configuration. Use the include_* flags in the (optional) body to control what is copied; all default on except memory. Requires the Lead Builder team role or above.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                include_connections:
                  description: Copy connected accounts (Connections) and their selected tools. Defaults to true.
                  type: boolean
                include_queue:
                  description: Copy the assigned Queue. Defaults to true.
                  type: boolean
                include_skills_files:
                  description: Copy attached Skills and Files. Defaults to true.
                  type: boolean
                include_logins_secrets:
                  description: Copy saved Logins and Secrets. Defaults to true.
                  type: boolean
                include_plugins:
                  description: Copy installed plugins. Defaults to true.
                  type: boolean
                include_aop:
                  description: Copy the agent's operating procedure (AOP) and its handover targets. Defaults to true.
                  type: boolean
                include_memory:
                  description: Copy what the agent has learned so far (its Memory). Defaults to false. Memory can only be copied from the Duvo app — requesting it here returns an error.
                  type: boolean
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: agent_id
        required: true
        description: The ID of the agent to duplicate
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                    format: uuid
                    description: The ID of the newly created duplicate agent
                required:
                - agent_id
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
