  /v2/agents/{agentId}/eval-rubrics/{rubricId}:
    patch:
      operationId: updateEvalRubric
      tags:
      - Agents
      description: Edit a single Agent-specific evaluation rubric's title and/or description. The edit produces a NEW rubric (with a new id and slug) so previously scored Runs stay attributed to the original criterion; the response contains the new rubric.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 80
                  description: Short, human-readable Pass/Fail rubric title.
                description:
                  type: string
                  minLength: 20
                  maxLength: 400
                  description: A 1-2 sentence Pass condition phrased as a question.
                selected_automation_revision_id:
                  description: The automation revision this edit is being made at. Pass a draft and the edit is folded into that draft itself; pass the active revision and the edit lands on a draft branched from it. A historic revision is rejected — it cannot be activated from without an explicit rebase. A revision belonging to a different automation is ignored, and the edit targets the automation the addressed agent belongs to. Omit to target the automation's active revision.
                  type:
                  - string
                  - 'null'
                  format: uuid
              additionalProperties: false
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: agentId
        required: true
        description: The agent's unique identifier (Assignment ID)
      - schema:
          type: string
          format: uuid
        in: path
        name: rubricId
        required: true
        description: The custom rubric's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  rubric:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      slug:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      sort_order:
                        type: number
                      deleted_at:
