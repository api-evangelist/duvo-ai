      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  teamId:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                    - draft
                    - collecting
                    - generating
                    - generating-current-process
                    - generating-transformation-proposal
                    - review
                    - complete
                    - generation_failed
                  visibility:
                    type: string
                    enum:
                    - team
                    - restricted
                  version:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  analysis: {}
                  generationError:
                    type:
                    - string
                    - 'null'
                  customPrompt:
                    type:
                    - string
                    - 'null'
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  captures:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        processId:
                          type: string
                          format: uuid
                        userId:
                          type: string
                          format: uuid
                        userName:
                          type: string
                        type:
                          type: string
                          x-extensible-enum:
                          - video
                          - interview
                          - document
                          - screenshare
                          - meeting
                        videoUrl:
                          type:
                          - string
                          - 'null'
                        videoTranscript:
                          type:
                          - string
                          - 'null'
                        documentFileName:
                          type:
                          - string
                          - 'null'
                        documentTextMetadata:
                          type:
                          - object
                          - 'null'
                          properties:
                            pages:
                              type: array
                              items:
                                type: object
                                properties:
                                  pageNumber:
                                    type: integer
                                    maximum: 9007199254740991
                                  startOffset:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                  endOffset:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                  lines:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        pageNumber:
                                          type: integer
                                          maximum: 9007199254740991
                                        lineNumber:
                                          type: integer
                                          maximum: 9007199254740991
                                        startOffset:
                                          type: integer
                                          minimum: 0
                                          maximum: 9007199254740991
                                        endOffset:
                                          type: integer
                                          minimum: 0
                                          maximum: 9007199254740991
                                      required:
                                      - pageNumber
                                      - lineNumber
                                      - startOffset
                                      - endOffset
                                      additionalProperties: false
                                required:
                                - pageNumber
                                - startOffset
                                - endOffset
                                - lines
                                additionalProperties: false
                          required:
                          - pages
                          additionalProperties: false
                        transcript:
                          type:
                          - array
                          - 'null'
                          items:
                            type: object
                            properties:
                              source:
                                type: string
                                enum:
                                - ai
                                - user
                                - interviewer
                              speakerName:
                                type: string
                              message:
                                type: string
                                minLength: 1
                              timestamp:
                                type: number
                            required:
                            - source
                            - message
                            additionalProperties: false
                        hasTranscript:
                          type: boolean
                        hasVideoTranscript:
                          type: boolean
                        transcriptQuestionCount:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        status:
                          type: string
                          enum:
                          - pending
                          - recording
                          - processing
                          - complete
                          - failed
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - processId
                      - userId
                      - type
                      - videoUrl
                      - videoTranscript
                      - transcript
                      - status
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                  createdByName:
                    type: string
                  creatorUserId:
                    type: string
                    format: uuid
                  generationProgress:
                    type:
                    - object
                    - 'null'
                    properties:
                      steps:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            status:
                              type: string
                              enum:
                              - pending
                              - in_progress
                              - complete
                            order:
                              type: number
                            count:
                              type: number
                          required:
                          - key
                          - label
                          - status
                          - order
                          additionalProperties: false
                    required:
                    - steps
                    additionalProperties: false
                  transformationGuidance:
                    type:
                    - string
                    - 'null'
                  transformationGuidanceAuthor:
                    type:
                    - string
                    - 'null'
                  transformationGuidanceDate:
                    type:
                    - string
                    - 'null'
                  usedGuidanceMessages:
                    type: array
                    items:
                      type: object
                      properties:
                        content:
                          type: string
                        author:
                          type:
                          - string
                          - 'null'
                        date:
                          type:
                          - string
                          - 'null'
                      required:
