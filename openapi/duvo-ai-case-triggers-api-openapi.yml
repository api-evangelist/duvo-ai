    post:
      operationId: createAgentCaseTrigger
      tags:
      - Case Triggers
      description: Create a case trigger for an agent. An agent may have at most one case trigger; this returns 409 if one already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                case_queue_id:
                  type: string
                  format: uuid
                  description: Queue whose new cases should trigger this agent
                enabled:
                  type: boolean
                  description: Whether the trigger is active. Disabled triggers do not dispatch runs.
                concurrency:
                  description: Concurrency cap for the target queue. The cap is queue-wide, so this affects every Agent working the queue, not just this trigger. Only 1 (run cases one at a time) or null (reset the whole queue's cap to the platform default) can be set here; higher caps are configured per-queue via PATCH /v2/admin/case-queues/{queueId}/concurrency. Omit to leave the queue's current cap unchanged.
