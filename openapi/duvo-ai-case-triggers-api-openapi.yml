      - schema:
          type: string
          format: uuid
        in: path
        name: agent_id
        required: true
        description: The agent's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_triggers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        agent_id:
                          type: string
                        case_queue_id:
                          type: string
                        case_queue_name:
                          type: string
                        user_id:
                          type: string
                        enabled:
                          type: boolean
                        concurrency:
                          type:
                          - integer
                          - 'null'
                          maximum: 9007199254740991
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        creator_display_name:
                          type:
                          - string
                          - 'null'
                        can_disable:
                          type: boolean
                        has_conflict:
                          type: boolean
                        conflicting_agents:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                            required:
                            - id
                            - name
                            additionalProperties: false
                        pending_change:
                          description: On a team with versions, a change to this trigger saved to the automation's draft. The trigger keeps its current values until the draft is made active. Null when nothing is waiting.
                          type:
                          - object
                          - 'null'
                          properties:
                            automation_revision_id:
                              type: string
                              description: The automation's draft revision that holds the change
                            case_queue_id:
                              description: The queue the draft routes to this agent, or null when the draft takes the trigger away
                              type:
                              - string
                              - 'null'
                            enabled:
                              type: boolean
                              description: Whether the trigger will be on once the draft is made active
                          required:
                          - automation_revision_id
                          - case_queue_id
                          - enabled
                          additionalProperties: false
                      required:
                      - id
                      - agent_id
                      - case_queue_id
                      - case_queue_name
                      - user_id
                      - enabled
                      - concurrency
                      - created_at
                      - updated_at
                      - creator_display_name
                      - can_disable
                      - has_conflict
                      - conflicting_agents
                      additionalProperties: false
                required:
                - case_triggers
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
