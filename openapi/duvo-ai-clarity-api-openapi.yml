  /v2/teams/{teamId}/clarity/portfolio-intelligence:
    get:
      operationId: getClarityPortfolioIntelligence
      tags:
      - Clarity
      description: Get portfolio intelligence for the current team
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
        in: path
        name: teamId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - idle
                    - generating
                    - complete
                    - generation_failed
                  generationError:
                    type:
                    - string
                    - 'null'
                  analysis:
                    type:
                    - object
                    - 'null'
                    properties:
                      executiveSummary:
                        type: string
                        minLength: 1
                      valueStreams:
                        minItems: 1
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              minLength: 1
                            description:
                              type: string
                              minLength: 1
                            currentPainPoints:
                              type: array
                              items:
                                type: string
                            targetOutcome:
                              type: string
                              minLength: 1
                            kpis:
                              type: array
                              items:
                                type: string
                            gap:
                              default: null
                              type:
                              - string
                              - 'null'
                            benefits:
                              default: null
                              minItems: 1
                              type:
                              - array
                              - 'null'
                              items:
                                type: object
                                properties:
                                  statement:
                                    type: string
                                    minLength: 1
                                  basis:
                                    type: string
                                    enum:
                                    - evidenced
                                    - estimate
                                  assumption:
                                    type:
                                    - string
                                    - 'null'
                                  dataToFirmUp:
                                    type:
                                    - string
                                    - 'null'
                                required:
                                - statement
                                - basis
                                - assumption
                                - dataToFirmUp
                                additionalProperties: false
                          required:
                          - name
                          - description
                          - currentPainPoints
                          - targetOutcome
                          - kpis
                          - gap
                          - benefits
                          additionalProperties: false
                      organizationAndGovernance:
                        minItems: 1
                        type: array
                        items:
                          type: object
                          properties:
                            element:
                              type: string
                              minLength: 1
                            description:
                              type: string
                              minLength: 1
                          required:
                          - element
                          - description
                          additionalProperties: false
                      peopleAndSkills:
                        minItems: 1
                        type: array
                        items:
                          type: object
                          properties:
                            area:
                              type: string
                              minLength: 1
                            fromState:
                              type: string
                              minLength: 1
                            toState:
                              type: string
                              minLength: 1
                            action:
                              type: string
                              minLength: 1
                          required:
                          - area
                          - fromState
                          - toState
                          - action
                          additionalProperties: false
                      technologyDataAndAI:
                        minItems: 1
                        type: array
                        items:
                          type: object
                          properties:
                            layer:
                              type: string
                              minLength: 1
                            description:
                              type: string
                              minLength: 1
                          required:
                          - layer
                          - description
                          additionalProperties: false
                      humanAiExecutionModel:
                        minItems: 1
                        type: array
                        items:
                          type: object
                          properties:
                            valueStream:
                              type: string
                              minLength: 1
                            executionMode:
                              type: string
                              enum:
                              - human-led
                              - hybrid
                              - agent-led
                            agentResponsibilities:
                              type: array
                              items:
                                type: string
                            humanResponsibilities:
                              type: array
                              items:
                                type: string
                            oversightAndEscalation:
                              type: string
                              minLength: 1
                          required:
                          - valueStream
                          - executionMode
                          - agentResponsibilities
                          - humanResponsibilities
                          - oversightAndEscalation
                          additionalProperties: false
                      transformationRoadmap:
                        minItems: 3
                        maxItems: 3
                        type: array
                        items:
                          type: object
                          properties:
                            wave:
                              type: integer
                              minimum: 1
                              maximum: 3
                            name:
                              type: string
                              minLength: 1
                            horizon:
                              type: string
                              minLength: 1
                            objectives:
                              type: array
                              items:
                                type: string
                            milestones:
                              type: array
                              items:
                                type: string
                            dependencies:
                              type: array
                              items:
                                type: string
                          required:
                          - wave
                          - name
                          - horizon
                          - objectives
                          - milestones
                          - dependencies
                          additionalProperties: false
