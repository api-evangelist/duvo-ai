                    - 'null'
                    format: uuid
                  processId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  name:
                    type: string
                  ownerLabel:
                    type:
                    - string
                    - 'null'
                  sortOrder:
                    type: number
                  existence:
                    type: string
                    enum:
                    - proposed
                    - active
                  contentConfirmedAt:
                    type:
                    - string
                    - 'null'
                  existenceConfirmedAt:
                    type:
                    - string
                    - 'null'
                  source:
                    type: string
                    enum:
                    - ai
                    - human
                  priority:
                    type:
                    - string
                    - 'null'
                    enum:
                    - high
                    - medium
                    - low
                  priorityReasoning:
                    type:
                    - string
                    - 'null'
                  priorityAssessedAt:
                    type:
                    - string
                    - 'null'
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  team:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                    required:
                    - id
                    - name
                    additionalProperties: false
                  outcome:
                    type: string
                    enum:
                    - created
                    - reused
                    description: Whether this call inserted a new node or returned an equivalent one that already existed. Only "proposal" mode can report "reused".
                required:
