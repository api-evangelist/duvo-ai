openapi: 3.2.0
info:
  title: Duvo Public Clarity API
  description: 'Public API for programmatic access to Duvo. Authenticate with API keys created in the Duvo dashboard.


    ## Rate limits


    Requests are counted per API key. Every response advertises the quota with the IETF RateLimit fields, so a client can self-throttle without waiting for a rejection:


    - `RateLimit-Policy: "default";q=;w=` — the policy in force: `q` requests per `w` seconds.

    - `RateLimit: "default";r=;t=` — the live state: `r` requests left, quota resetting in `t` seconds.

    - Read the quota from the headers rather than hard-coding it; it differs per environment.

    - The same numbers are also sent as `ratelimit-limit`, `ratelimit-remaining` and `ratelimit-reset`.


    Once the quota is exhausted the API answers `429 Too Many Requests` with `Retry-After` set to the seconds to wait; honor it instead of retrying immediately.'
  version: 1.0.0
servers:
- url: https://api.duvo.ai
  description: Production server
tags:
- name: Clarity
paths:
  /v2/clarity/processes/{id}:
    get:
      operationId: getLegacyClarityProcess
      tags:
      - Clarity
      description: Get a legacy v1 Clarity process with process metadata, generated analysis, automation guidance, generation progress, and captures. Use this for rows from listClarityProcesses where version=1; v2 rows should use getClarityProcess and snapshot detail tools.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  teamId:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                    - draft
                    - collecting
                    - generating
                    - generating-current-process
                    - generating-transformation-proposal
                    - review
                    - complete
                    - generation_failed
                  visibility:
                    type: string
                    enum:
                    - team
                    - restricted
                  version:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  analysis: {}
                  generationError:
                    type:
                    - string
                    - 'null'
                  customPrompt:
                    type:
                    - string
                    - 'null'
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  captures:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        processId:
                          type: string
                          format: uuid
                        userId:
                          type: string
                          format: uuid
                        userName:
                          type: string
                        type:
                          type: string
                          x-extensible-enum:
                          - video
                          - interview
                          - document
                          - screenshare
                          - meeting
                          - image
                        videoUrl:
                          type:
                          - string
                          - 'null'
                        videoTranscript:
                          type:
                          - string
                          - 'null'
                        documentFileName:
                          type:
                          - string
                          - 'null'
                        documentTextMetadata:
                          type:
                          - object
                          - 'null'
                          properties:
                            pages:
                              type: array
                              items:
                                type: object
                                properties:
                                  pageNumber:
                                    type: integer
                                    maximum: 9007199254740991
                                  startOffset:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                  endOffset:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                  lines:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        pageNumber:
                                          type: integer
                                          maximum: 9007199254740991
                                        lineNumber:
                                          type: integer
                                          maximum: 9007199254740991
                                        startOffset:
                                          type: integer
                                          minimum: 0
                                          maximum: 9007199254740991
                                        endOffset:
                                          type: integer
                                          minimum: 0
                                          maximum: 9007199254740991
                                      required:
                                      - pageNumber
                                      - lineNumber
                                      - startOffset
                                      - endOffset
                                      additionalProperties: false
                                required:
                                - pageNumber
                                - startOffset
                                - endOffset
                                - lines
                                additionalProperties: false
                            sourceArtifactGeneration:
                              type: string
                          required:
                          - pages
                          additionalProperties: false
                        processingFailureReason:
                          type:
                          - string
                          - 'null'
                          maxLength: 500
                        transcript:
                          type:
                          - array
                          - 'null'
                          items:
                            type: object
                            properties:
                              source:
                                type: string
                                enum:
                                - ai
                                - user
                                - interviewer
                              speakerName:
                                type: string
                              message:
                                type: string
                                minLength: 1
                              timestamp:
                                type: number
                            required:
                            - source
                            - message
                            additionalProperties: false
                        hasTranscript:
                          type: boolean
                        hasVideoTranscript:
                          type: boolean
                        transcriptQuestionCount:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        status:
                          type: string
                          enum:
                          - pending
                          - recording
                          - processing
                          - complete
                          - failed
                        isDistillingPolicy:
                          type: boolean
                        usabilityStatus:
                          default: usable
                          type: string
                          enum:
                          - usable
                          - excluded
                        usabilityReason:
                          default: null
                          type:
                          - string
                          - 'null'
                        usabilitySource:
                          default: null
                          type:
                          - string
                          - 'null'
                          enum:
                          - agent
                          - interviewee
                          - manager
                        usabilityConfidence:
                          default: null
                          type:
                          - string
                          - 'null'
                          enum:
                          - high
                          - medium
                          - low
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - processId
                      - userId
                      - type
                      - videoUrl
                      - videoTranscript
                      - transcript
                      - status
                      - usabilityStatus
                      - usabilityReason
                      - usabilitySource
                      - usabilityConfidence
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                  createdByName:
                    type: string
                  creatorUserId:
                    type: string
                    format: uuid
                  generationProgress:
                    type:
                    - object
                    - 'null'
                    properties:
                      steps:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            status:
                              type: string
                              enum:
                              - pending
                              - in_progress
                              - complete
                            order:
                              type: number
                            count:
                              type: number
                          required:
                          - key
                          - label
                          - status
                          - order
                          additionalProperties: false
                    required:
                    - steps
                    additionalProperties: false
                  transformationGuidance:
                    type:
                    - string
                    - 'null'
                  transformationGuidanceAuthor:
                    type:
                    - string
                    - 'null'
                  transformationGuidanceDate:
                    type:
                    - string
                    - 'null'
                  usedGuidanceMessages:
                    type: array
                    items:
                      type: object
                      properties:
                        content:
                          type: string
                        author:
                          type:
                          - string
                          - 'null'
                        date:
                          type:
                          - string
                          - 'null'
                      required:
                      - content
                      - author
                      - date
                      additionalProperties: false
                required:
                - id
                - teamId
                - userId
                - name
                - status
                - visibility
                - version
                - analysis
                - generationError
                - customPrompt
                - createdAt
                - updatedAt
                - captures
                - creatorUserId
                - generationProgress
                - transformationGuidance
                - transformationGuidanceAuthor
                - transformationGuidanceDate
                - usedGuidanceMessages
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Get Legacy Clarity Process
    patch:
      operationId: updateClarityProcess
      tags:
      - Clarity
      description: Update a Clarity process name, guidance, interview independence, visibility, or completion status. Team Builders can edit names, guidance, and interview independence, only the creator or a team manager can change visibility, and completing or reopening a process for review requires a Lead Builder role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: New process name
                  type: string
                  minLength: 1
                  maxLength: 255
                status:
                  description: Mark a review-stage process complete, or reopen a completed process for review
                  type: string
                  enum:
                  - complete
                  - review
                customPrompt:
                  description: Process-specific guidance, or null to clear it
                  type:
                  - string
                  - 'null'
                  maxLength: 5000
                visibility:
                  description: Process visibility within the team
                  type: string
                  enum:
                  - team
                  - restricted
                independentInterviews:
                  description: 'Run each interview independently: no briefing from earlier interviews and a neutral opener'
                  type: boolean
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
        description: Clarity process id
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                    - draft
                    - collecting
                    - generating
                    - generating-current-process
                    - generating-transformation-proposal
                    - review
                    - complete
                    - generation_failed
                  visibility:
                    type: string
                    enum:
                    - team
                    - restricted
                  customPrompt:
                    type:
                    - string
                    - 'null'
                  independentInterviews:
                    type: boolean
                  updatedAt:
                    type: string
                required:
                - id
                - name
                - status
                - visibility
                - customPrompt
                - independentInterviews
                - updatedAt
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Update Clarity Process
    delete:
      operationId: deleteClarityProcess
      tags:
      - Clarity
      description: Delete a Clarity process. The creator or a team admin can delete it unless capture analysis is still in progress, or a Module runs it — a Module's process is part of the Module, so the Module has to be removed first. An automation built from the process keeps running, with its setup answers and people, but is no longer linked to it.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
        description: Clarity process id
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                - success
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Delete Clarity Process
  /v2/clarity/processes/{id}/members:
    get:
      operationId: listClarityProcessMembers
      tags:
      - Clarity
      description: List users with accepted access to a clarity process, the people invited who have not accepted yet, and anyone else who has recorded a capture on it
      parameters:
      - schema:
          type: string
          format: uuid
        in: query
        name: contributorsAfter
        required: false
        description: Cursor from contributorsNextCursor; returns the next page of contributors.
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
        description: Clarity process ID.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  visibility:
                    type: string
                    enum:
                    - team
                    - restricted
                  owner:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type:
                        - string
                        - 'null'
                      email:
                        type:
                        - string
                        - 'null'
                        format: email
                      role:
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - name
                    - email
                    - role
                    additionalProperties: false
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        user:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type:
                              - string
                              - 'null'
                            email:
                              type:
                              - string
                              - 'null'
                              format: email
                          required:
                          - id
                          - name
                          - email
                          additionalProperties: false
                        role:
                          type:
                          - string
                          - 'null'
                        createdAt:
                          type: string
                      required:
                      - id
                      - user
                      - role
                      - createdAt
                      additionalProperties: false
                  pending:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        createdAt:
                          type: string
                      required:
                      - id
                      - email
                      - createdAt
                      additionalProperties: false
                  contributors:
                    type: array
                    items:
                      type: object
                      properties:
                        user:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type:
                              - string
                              - 'null'
                            email:
                              type:
                              - string
                              - 'null'
                              format: email
                          required:
                          - id
                          - name
                          - email
                          additionalProperties: false
                        role:
                          type:
                          - string
                          - 'null'
                      required:
                      - user
                      - role
                      additionalProperties: false
                    description: One page of contributors, ordered by user ID.
                  contributorsNextCursor:
                    description: Pass as contributorsAfter to fetch the next page; null on the last page.
                    type:
                    - string
                    - 'null'
                    format: uuid
                  withoutInterview:
                    type: array
                    items:
                      type: object
                      properties:
                        personId:
                          type: string
                          format: uuid
                        userId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        email:
                          type:
                          - string
                          - 'null'
                          format: email
                      required:
                      - personId
                      - userId
                      - email
                      additionalProperties: false
                    description: People given access to the process without being asked to record an interview.
                required:
                - visibility
                - owner
                - members
                - pending
                - contributors
                - contributorsNextCursor
                - withoutInterview
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: List Clarity Process Members
