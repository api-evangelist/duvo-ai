  /v2/clarity/processes/{id}/duplicate:
    post:
      operationId: duplicateClarityProcess
      tags:
      - Clarity
      description: Duplicate a Clarity process with its analysis, captures, message history, and, for v2 processes, its live current map and automation proposal. Requires a team manager role.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
        description: Source Clarity process id
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Duplicated Clarity process id
                  sourceTeamId:
                    type: string
                    format: uuid
                  organizationId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  process:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      status:
                        type: string
                        enum:
                        - draft
                        - collecting
                        - generating
                        - generating-current-process
                        - generating-transformation-proposal
                        - review
                        - complete
                        - generation_failed
                      version:
                        anyOf:
                        - type: number
                          enum:
                          - 1
                        - type: number
                          enum:
                          - 2
                      summary:
                        type:
                        - string
                        - 'null'
                      captureCount:
                        type: number
                      captureCounts:
                        type: object
                        properties:
                          video:
                            type: number
                          interview:
                            type: number
                          document:
                            type: number
                          meeting:
                            type: number
                          other:
                            type: number
                        required:
                        - video
                        - interview
                        - document
                        additionalProperties: false
                      updatedAt:
                        type: string
                        format: date-time
                      contributors:
                        type: array
                        items:
                          type: object
                          properties:
                            userId:
                              type: string
                            userName:
                              type: string
                            email:
                              type:
                              - string
                              - 'null'
                          required:
                          - userId
                          - userName
                          additionalProperties: false
                      people:
                        default: []
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            userId:
                              type:
                              - string
                              - 'null'
                            email:
                              type:
                              - string
                              - 'null'
                            name:
                              type: string
                          required:
                          - id
                          - userId
                          - email
                          - name
                          additionalProperties: false
                      hasAutomationProposal:
                        type: boolean
                      failedArtifactKind:
                        type:
                        - string
                        - 'null'
                        enum:
                        - current_process
                        - transformation_proposal
                      createdAt:
                        type: string
                        format: date-time
                      createdByUserId:
                        type: string
                        format: uuid
                      createdByDisplay:
                        type:
                        - object
                        - 'null'
                        properties:
                          userId:
                            type: string
                            format: uuid
                          name:
                            type: string
                          email:
                            type:
                            - string
                            - 'null'
                        required:
                        - userId
                        - name
                        additionalProperties: false
                      insightsCount:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      vulnerabilityCount:
