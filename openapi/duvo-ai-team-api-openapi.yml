openapi: 3.2.0
info:
  title: Duvo Public Team API
  description: 'Public API for programmatic access to Duvo. Authenticate with API keys created in the Duvo dashboard.


    ## Rate limits


    Requests are counted per API key. Every response advertises the quota with the IETF RateLimit fields, so a client can self-throttle without waiting for a rejection:


    - `RateLimit-Policy: "default";q=;w=` — the policy in force: `q` requests per `w` seconds.

    - `RateLimit: "default";r=;t=` — the live state: `r` requests left, quota resetting in `t` seconds.

    - Read the quota from the headers rather than hard-coding it; it differs per environment.

    - The same numbers are also sent as `ratelimit-limit`, `ratelimit-remaining` and `ratelimit-reset`.


    Once the quota is exhausted the API answers `429 Too Many Requests` with `Retry-After` set to the seconds to wait; honor it instead of retrying immediately.'
  version: 1.0.0
servers:
- url: https://api.duvo.ai
  description: Production server
tags:
- name: Team
  description: Inspect the team and members associated with the API key
paths:
  /v2/teams/{teamId}:
    get:
      operationId: getTeam
      tags:
      - Team
      description: Get a team by ID. The caller must be scoped to the requested team.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: teamId
        required: true
        description: Team ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique team identifier
                      name:
                        type: string
                        description: Human-readable team name
                      created_at:
                        type: string
                        description: ISO 8601 creation timestamp
                      organization_id:
                        description: Parent organization ID, or null if the team is standalone
                        type:
                        - string
                        - 'null'
                        format: uuid
                      slack_team_id:
                        description: Linked Slack workspace ID, or null if Slack is not connected
                        type:
                        - string
                        - 'null'
                      discovery_mode:
                        type: string
                        description: How the team handles agent discovery
                        x-extensible-enum:
                        - request
                        - auto
                      automations_migrated_at:
                        description: ISO 8601 timestamp of the team's move to the Automations workspace, or null if it has not moved
                        type:
                        - string
                        - 'null'
                      automation_revisions_migrated_at:
                        description: 'ISO 8601 timestamp of the team''s move to automation revisions, or null. Narrower than automations_migrated_at: a team can be on the workspace without revisions'
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - name
                    - created_at
                    - organization_id
                    - slack_team_id
                    - discovery_mode
                    - automations_migrated_at
                    - automation_revisions_migrated_at
                    additionalProperties: false
                required:
                - team
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Get Team
  /v2/profile:
    get:
      operationId: getProfile
      tags:
      - Team
      description: Get the profile of the authenticated user (the owner of the API key).
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type:
                        - string
                        - 'null'
                      email:
                        type: string
                        format: email
                      teamId:
                        type:
                        - string
                        - 'null'
                        format: uuid
                    required:
                    - id
                    - name
                    - email
                    - teamId
                    additionalProperties: false
                required:
                - profile
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Get Profile
  /v2/teams:
    get:
      operationId: listMyTeams
      tags:
      - Team
      description: List teams the authenticated caller can act on. Team-scoped API keys see only the key's team; managed Ask Duvo keys stay within their origin boundary; human user-scoped API keys and OAuth callers see every team they're a member of.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        organization_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                      required:
                      - id
                      - name
                      - organization_id
                      additionalProperties: false
                required:
                - teams
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: List My Teams
  /v2/teams/{teamId}/members:
    get:
      operationId: listTeamMembers
      tags:
      - Team
      description: List members of a team. The authenticated session or API key must be scoped to the requested team.
      parameters:
      - schema:
          default: 50
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Number of members per page (1-100, default 50)
      - schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
        description: Number of members to skip
      - schema:
          type: string
          minLength: 1
          maxLength: 200
        in: query
        name: search
        required: false
        description: Optional case-insensitive name or email search
      - schema:
          type: string
          format: uuid
        in: path
        name: teamId
        required: true
        description: Team ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type:
                          - string
                          - 'null'
                        email:
                          type: string
                          format: email
                        role:
                          type: string
                        inheritedFromOrg:
                          default: false
                          type: boolean
                        orgRole:
                          default: null
                          description: The member's role in the team's organization, or null when the team has no organization or the member holds no organization role
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - name
                      - email
                      - role
                      - inheritedFromOrg
                      - orgRole
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  limit:
                    type: integer
                    maximum: 9007199254740991
                  offset:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - members
                - total
                - limit
                - offset
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: List Team Members
  /v2/teams/{teamId}/members/{memberId}:
    patch:
      operationId: updateTeamMemberRole
      tags:
      - Team
      description: Update an existing team member's role. Requires the Manager role or above; only an Owner may grant or remove the Owner role, and the last remaining Owner cannot be demoted. A member whose Owner role is inherited from the organization cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
              required:
              - role
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: teamId
        required: true
        description: Team ID
      - schema:
          type: string
          format: uuid
        in: path
        name: memberId
        required: true
        description: Member (user) ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type:
                    - string
                    - 'null'
                  email:
                    type: string
                    format: email
                  role:
                    type: string
                  inheritedFromOrg:
                    default: false
                    type: boolean
                  orgRole:
                    default: null
                    description: The member's role in the team's organization, or null when the team has no organization or the member holds no organization role
                    type:
                    - string
                    - 'null'
                required:
                - id
                - name
                - email
                - role
                - inheritedFromOrg
                - orgRole
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Update Team Member Role
    delete:
      operationId: removeTeamMember
      tags:
      - Team
      description: Remove a member from a team. Removing another member requires the Superadmin role or above; any member may remove themselves (leaving the team). The last remaining Owner cannot be removed, and a member whose Owner role is inherited from the organization can only leave voluntarily.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: teamId
        required: true
        description: Team ID
      - schema:
          type: string
          format: uuid
        in: path
        name: memberId
        required: true
        description: Member (user) ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  nextTeamId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  planType:
                    type:
                    - string
                    - 'null'
                    x-extensible-enum:
                    - pro
                    - business
                    - enterprise
                required:
                - success
                - nextTeamId
                - planType
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Remove Team Member
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key authentication. Get your API key from the Duvo dashboard.
