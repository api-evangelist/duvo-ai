  /v2/artifacts/{artifactId}/attachments/upload-urls:
    post:
      operationId: createPulseDashboardAttachmentUploadUrl
      tags:
      - Duvo Pulse
      description: Issue a presigned upload URL for a file to attach to a Duvo Pulse dashboard message (e.g. an HTML dashboard to copy, or a screenshot to match). POST the file bytes to the returned upload_url as multipart form data under the field name 'file', then pass the returned attachment_id in the attachments array of POST /artifacts/{artifactId}/messages. The agent reads the file directly from its sandbox. Files live as long as the dashboard's sandbox (about 12 hours), so upload shortly before sending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Name of the file being attached, without any path segments
                mime_type:
                  type: string
                  minLength: 1
                  maxLength: 127
                  description: MIME type of the file, e.g. text/html or image/png
                size_bytes:
                  type: integer
                  minimum: 0
                  maximum: 26214400
                  description: Size of the file in bytes (max 25MB)
              required:
              - filename
              - mime_type
              - size_bytes
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: artifactId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment_id:
                    type: string
                    format: uuid
                    description: Echo this back in the message body's attachments array
                  sandbox_id:
                    type: string
                    description: Sandbox the file will be uploaded into
                  sandbox_path:
                    type: string
                    description: Absolute path the file will occupy inside the sandbox
                  upload_url:
                    type: string
                    maxLength: 2048
                    format: uri
                    description: Presigned URL to POST the file bytes to as multipart form data
                  expires_in_seconds:
                    type: integer
                    maximum: 9007199254740991
                    description: Seconds until upload_url stops being accepted
                required:
