  /v2/teams/{teamId}/artifacts/{artifactId}/move:
    post:
      operationId: movePulseDashboard
      tags:
      - Duvo Pulse
      description: Move a Pulse dashboard from the team in the URL to another team, keeping only its latest revision (chat history and older revisions are deleted). The caller must be a Manager or above on both teams. Pass dryRun=true to preview which Connections reconnect vs drop without applying changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetTeamId:
                  type: string
                  format: uuid
                  description: ID of the destination team the dashboard moves to.
              required:
              - targetTeamId
              additionalProperties: false
      parameters:
      - schema:
          anyOf:
          - type: boolean
          - type: string
            enum:
            - 'true'
          - type: string
            enum:
            - 'false'
        in: query
        name: dryRun
        required: false
        description: 'When true, only previews the move: reports which Connections would reconnect vs drop without changing anything.'
      - schema:
          type: string
          format: uuid
        in: path
        name: teamId
        required: true
      - schema:
          type: string
          format: uuid
        in: path
        name: artifactId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifactId:
                    type: string
                    format: uuid
                  artifactTitle:
                    type:
                    - string
                    - 'null'
                  sourceTeamId:
                    type: string
                    format: uuid
                  targetTeamId:
                    type: string
                    format: uuid
                  ownershipReassigned:
                    type: boolean
                  visibilityReset:
                    type: boolean
                  connections:
                    type: object
                    properties:
                      reused:
                        type: array
                        items:
                          type: object
                          properties:
                            integrationType:
                              type: string
                            integrationName:
                              type: string
                            instanceName:
                              type: string
                            decision:
                              type: string
                              enum:
                              - reuse
                              - needs_reconnect
                              - custom_to_rebuild
                          required:
                          - integrationType
                          - integrationName
                          - instanceName
                          - decision
                          additionalProperties: false
                      disconnected:
                        type: array
                        items:
                          type: object
                          properties:
                            integrationType:
                              type: string
                            integrationName:
                              type: string
                            instanceName:
                              type: string
                            decision:
                              type: string
                              enum:
                              - reuse
                              - needs_reconnect
                              - custom_to_rebuild
                          required:
                          - integrationType
                          - integrationName
                          - instanceName
                          - decision
                          additionalProperties: false
                      customToRebuild:
                        type: array
                        items:
                          type: object
                          properties:
                            integrationType:
                              type: string
                            integrationName:
                              type: string
                            instanceName:
                              type: string
                            decision:
                              type: string
                              enum:
                              - reuse
                              - needs_reconnect
                              - custom_to_rebuild
                          required:
                          - integrationType
                          - integrationName
                          - instanceName
                          - decision
                          additionalProperties: false
                    required:
                    - reused
                    - disconnected
                    - customToRebuild
                    additionalProperties: false
                  applied:
                    type: boolean
                required:
                - artifactId
                - artifactTitle
                - sourceTeamId
                - targetTeamId
                - ownershipReassigned
                - visibilityReset
                - connections
                - applied
                additionalProperties: false
        '400':
          description: Default Response
          content:
