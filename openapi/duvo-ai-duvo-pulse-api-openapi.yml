  /v2/teams/{teamId}/artifacts:
    get:
      operationId: listTeamPulseDashboards
      tags:
      - Duvo Pulse
      description: List your Duvo Pulse dashboards for the team in the URL. Ordered most recently updated first, except scope=automation, which is ordered by creation time (then id) so the whole scope can be read with the after_id cursor without a concurrent change shifting a page boundary.
      parameters:
      - schema:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Number of results per page (1-100, default 20)
      - schema:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
        description: Number of results to skip
      - schema:
          default: created
          type: string
          enum:
          - created
          - shared
          - team
          - automation
        in: query
        name: scope
        required: false
        description: 'Which dashboards to return: ''created'' (yours, the default), ''team'' (published to your whole team by a teammate), ''shared'' (shared with you individually by a teammate), or ''automation'' (owned by one of your team''s automations, each carrying its automation''s name).'
      - schema:
          type: string
          format: uuid
        in: query
        name: after_id
        required: false
        description: 'Keyset cursor for reading the whole ''automation'' scope: the id of the last dashboard you received; returns the page after it in (created_at, id) order. Use this instead of ''offset'' when reading every page, so a dashboard created, updated or deleted between requests cannot shift a page boundary you have already passed. 400 when the id no longer names a dashboard (restart from the first page). Only valid with scope=automation.'
      - schema:
          type: string
        in: path
        name: teamId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        team_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        organization_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        automation_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        automation_name:
                          description: Name of the owning automation, resolved only on the `automation` list scope — the one surface that renders the composite `<Automation> / <Title>` label. Absent elsewhere; a client reads absence and null the same way.
                          type:
                          - string
                          - 'null'
                        created_by_user_id:
                          type: string
                          format: uuid
                        title:
                          type:
                          - string
                          - 'null'
                        icon:
                          type:
                          - string
                          - 'null'
                          minLength: 1
                          maxLength: 64
                          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                        html_code_present:
                          type: boolean
                        content_format:
                          type: string
                          description: The substrate the dashboard is written in. New substrates are added over time.
                          x-extensible-enum:
                          - html
                          - openui
                          - react
                        status:
                          type: string
                          enum:
                          - not_started
                          - pending
                          - running
                          - completed
                          - failed
                          - interrupted
                        visibility:
                          type: string
                          enum:
                          - private
                          - team
                          - organization
                          - teams
                        publish_permission:
                          type: string
                          enum:
                          - view
                          - edit
                        has_live_connector_data:
                          type: boolean
                        thumbnail_url:
                          type:
                          - string
                          - 'null'
                        last_refresh_at:
                          type:
                          - string
                          - 'null'
                        created_at:
                          type: string
                        updated_at:
                          type: string
                      required:
                      - id
                      - team_id
                      - organization_id
                      - created_by_user_id
                      - title
                      - html_code_present
                      - status
                      - visibility
                      - publish_permission
                      - created_at
                      - updated_at
                      additionalProperties: false
                  total:
                    type: number
                  limit:
                    type: number
                  offset:
                    type: number
                required:
                - artifacts
                - total
                - limit
                - offset
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
