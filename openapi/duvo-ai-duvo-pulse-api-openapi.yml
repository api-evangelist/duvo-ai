openapi: 3.2.0
info:
  title: Duvo Public Duvo Pulse API
  description: 'Public API for programmatic access to Duvo. Authenticate with API keys created in the Duvo dashboard.


    ## Rate limits


    Requests are counted per API key. Every response advertises the quota with the IETF RateLimit fields, so a client can self-throttle without waiting for a rejection:


    - `RateLimit-Policy: "default";q=;w=` — the policy in force: `q` requests per `w` seconds.

    - `RateLimit: "default";r=;t=` — the live state: `r` requests left, quota resetting in `t` seconds.

    - Read the quota from the headers rather than hard-coding it; it differs per environment.

    - The same numbers are also sent as `ratelimit-limit`, `ratelimit-remaining` and `ratelimit-reset`.


    Once the quota is exhausted the API answers `429 Too Many Requests` with `Retry-After` set to the seconds to wait; honor it instead of retrying immediately.'
  version: 1.0.0
servers:
- url: https://api.duvo.ai
  description: Production server
tags:
- name: Duvo Pulse
  description: Create, list, iterate on, and delete Duvo Pulse dashboards — live, agent-generated visualizations of your Duvo data
paths:
  /v2/artifacts:
    get:
      operationId: listPulseDashboards
      tags:
      - Duvo Pulse
      description: List your Duvo Pulse dashboards (live, agent-generated visualizations of your Duvo data). Ordered most recently updated first, except scope=automation, which is ordered by creation time (then id) so the whole scope can be read with the after_id cursor without a concurrent change shifting a page boundary.
      parameters:
      - schema:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Number of results per page (1-100, default 20)
      - schema:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
        description: Number of results to skip
      - schema:
          default: created
          type: string
          enum:
          - created
          - shared
          - team
          - automation
        in: query
        name: scope
        required: false
        description: 'Which dashboards to return: ''created'' (yours, the default), ''team'' (published to your whole team by a teammate), ''shared'' (shared with you individually by a teammate), or ''automation'' (owned by one of your team''s automations, each carrying its automation''s name).'
      - schema:
          type: string
          format: uuid
        in: query
        name: after_id
        required: false
        description: 'Keyset cursor for reading the whole ''automation'' scope: the id of the last dashboard you received; returns the page after it in (created_at, id) order. Use this instead of ''offset'' when reading every page, so a dashboard created, updated or deleted between requests cannot shift a page boundary you have already passed. 400 when the id no longer names a dashboard (restart from the first page). Only valid with scope=automation.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        team_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        organization_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        automation_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        automation_name:
                          description: Name of the owning automation, resolved only on the `automation` list scope — the one surface that renders the composite `<Automation> / <Title>` label. Absent elsewhere; a client reads absence and null the same way.
                          type:
                          - string
                          - 'null'
                        created_by_user_id:
                          type: string
                          format: uuid
                        title:
                          type:
                          - string
                          - 'null'
                        icon:
                          type:
                          - string
                          - 'null'
                          minLength: 1
                          maxLength: 64
                          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                        html_code_present:
                          type: boolean
                        content_format:
                          type: string
                          description: The substrate the dashboard is written in. New substrates are added over time.
                          x-extensible-enum:
                          - html
                          - openui
                          - react
                        status:
                          type: string
                          enum:
                          - not_started
                          - pending
                          - running
                          - completed
                          - failed
                          - interrupted
                        visibility:
                          type: string
                          enum:
                          - private
                          - team
                          - organization
                          - teams
                        publish_permission:
                          type: string
                          enum:
                          - view
                          - edit
                        has_live_connector_data:
                          type: boolean
                        thumbnail_url:
                          type:
                          - string
                          - 'null'
                        last_refresh_at:
                          type:
                          - string
                          - 'null'
                        created_at:
                          type: string
                        updated_at:
                          type: string
                      required:
                      - id
                      - team_id
                      - organization_id
                      - created_by_user_id
                      - title
                      - html_code_present
                      - status
                      - visibility
                      - publish_permission
                      - created_at
                      - updated_at
                      additionalProperties: false
                  total:
                    type: number
                  limit:
                    type: number
                  offset:
                    type: number
                required:
                - artifacts
                - total
                - limit
                - offset
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: List Pulse Dashboards
    post:
      operationId: createPulseDashboard
      tags:
      - Duvo Pulse
      description: Create a new Duvo Pulse dashboard from a natural-language prompt (e.g. 'open cases by queue this week') and dispatch the first generation turn. Generation is asynchronous — poll GET /artifacts/{artifactId} until status is completed. The dashboard is private to you unless you set visibility to 'team', which shares it with your whole team straight away — with permission 'view' (teammates see the dashboard) or 'edit' (teammates can also iterate on it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 15000
                connection_ids:
                  maxItems: 10
                  type: array
                  items:
                    type: string
                    format: uuid
                visibility:
                  type: string
                  enum:
                  - private
                  - team
                permission:
                  type: string
                  enum:
                  - view
                  - edit
              required:
              - message
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact_id:
                    type: string
                    format: uuid
                  user_message:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      artifact_id:
                        type: string
                        format: uuid
                      author_user_id:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      role:
                        type: string
                        enum:
                        - user
                        - assistant
                      content:
                        type: string
                      created_at:
                        type: string
                      revision_id:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      message: {}
                      selected_element:
                        type:
                        - object
                        - 'null'
                        properties:
                          selector:
                            type: string
                            minLength: 1
                            maxLength: 2000
                          label:
                            type: string
                            minLength: 1
                            maxLength: 200
                          tag_name:
                            type: string
                            minLength: 1
                            maxLength: 50
                          text:
                            type: string
                            maxLength: 500
                          outer_html:
                            type: string
                            minLength: 1
                            maxLength: 4000
                          point:
                            type: object
                            properties:
                              x_ratio:
                                type: number
                                minimum: 0
                                maximum: 1
                              y_ratio:
                                type: number
                                minimum: 0
                                maximum: 1
                            required:
                            - x_ratio
                            - y_ratio
                            additionalProperties: false
                          openui_node:
                            type: object
                            properties:
                              statement:
                                type: string
                                minLength: 1
                                maxLength: 200
                              component:
                                type: string
                                minLength: 1
                                maxLength: 100
                              source:
                                type: string
                                maxLength: 2000
                            required:
                            - statement
                            - component
                            additionalProperties: false
                        required:
                        - selector
                        - label
                        - tag_name
                        - outer_html
                        additionalProperties: false
                      attachments:
                        type: array
                        items:
                          type: object
                          properties:
                            attachment_id:
                              type: string
                              format: uuid
                            filename:
                              type: string
                              minLength: 1
                              maxLength: 255
                            size_bytes:
                              type: integer
                              minimum: 0
                              maximum: 26214400
                            mime_type:
                              type: string
                              minLength: 1
                              maxLength: 127
                            sandbox_path:
                              type: string
                              minLength: 1
                              maxLength: 512
                          required:
                          - attachment_id
                          - filename
                          - size_bytes
                          - mime_type
                          - sandbox_path
                          additionalProperties: false
                    required:
                    - id
                    - artifact_id
                    - role
                    - content
                    - created_at
                    additionalProperties: false
                required:
                - artifact_id
                - user_message
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Create Pulse Dashboard
  /v2/artifacts/{artifactId}:
    get:
      operationId: getPulseDashboard
      tags:
      - Duvo Pulse
      description: Get a Duvo Pulse dashboard's metadata and generation status. When status is completed and html_code_present is true, fetch the rendered HTML from GET /artifacts/{artifactId}/render; the conversation is served by GET /artifacts/{artifactId}/messages.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: artifactId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      team_id:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      organization_id:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      automation_id:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      automation_name:
                        description: Name of the owning automation, resolved only on the `automation` list scope — the one surface that renders the composite `<Automation> / <Title>` label. Absent elsewhere; a client reads absence and null the same way.
                        type:
                        - string
                        - 'null'
                      created_by_user_id:
                        type: string
                        format: uuid
                      title:
                        type:
                        - string
                        - 'null'
                      icon:
                        type:
                        - string
                        - 'null'
                        minLength: 1
                        maxLength: 64
                        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                      html_code_present:
                        type: boolean
                      content_format:
                        type: string
                        description: The substrate the dashboard is written in. New substrates are added over time.
                        x-extensible-enum:
                        - html
                        - openui
                        - react
                      status:
                        type: string
                        enum:
                        - not_started
                        - pending
                        - running
                        - completed
                        - failed
                        - interrupted
                      visibility:
                        type: string
                        enum:
                        - private
                        - team
                        - organization
                        - teams
                      publish_permission:
                        type: string
                        enum:
                        - view
                        - edit
                      has_live_connector_data:
                        type: boolean
                      thumbnail_url:
                        type:
                        - string
                        - 'null'
                      last_refresh_at:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - team_id
                    - organization_id
                    - created_by_user_id
                    - title
                    - html_code_present
                    - status
                    - visibility
                    - publish_permission
                    - created_at
                    - updated_at
                    additionalProperties: false
                  is_creator:
                    type: boolean
                  can_edit:
                    type: boolean
                  render_enabled:
                    type: boolean
                  pending_question:
                    description: The question an update of this dashboard is paused on, waiting for the user's answer, or null when no update is waiting or the caller cannot edit the dashboard. The status stays running while it waits.
                    type:
                    - object
                    - 'null'
                    properties:
                      tool_call_id:
                        type: string
                        description: The question's toolCallId, which POST /artifacts/{artifactId}/answer takes.
                      questions:
                        minItems: 1
                        type: array
                        items:
                          type: string
                        description: The text of each question the update is waiting on.
                    required:
                    - tool_call_id
                    - questions
                    additionalProperties: false
                required:
                - artifact
                - is_creator
                - can_edit
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Get Pulse Dashboard
    patch:
      operationId: updatePulseDashboard
      tags:
      - Duvo Pulse
      description: Update a Duvo Pulse dashboard's settings — rename it. Only the creator can update it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
              required:
              - title
              additionalProperties: false
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: artifactId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  team_id:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  organization_id:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  automation_id:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  automation_name:
                    description: Name of the owning automation, resolved only on the `automation` list scope — the one surface that renders the composite `<Automation> / <Title>` label. Absent elsewhere; a client reads absence and null the same way.
                    type:
                    - string
                    - 'null'
                  created_by_user_id:
                    type: string
                    format: uuid
                  title:
                    type:
                    - string
                    - 'null'
                  icon:
                    type:
                    - string
                    - 'null'
                    minLength: 1
                    maxLength: 64
                    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                  html_code_present:
                    type: boolean
                  content_format:
                    type: string
                    description: The substrate the dashboard is written in. New substrates are added over time.
                    x-extensible-enum:
                    - html
                    - openui
                    - react
                  status:
                    type: string
                    enum:
                    - not_started
                    - pending
                    - running
                    - completed
                    - failed
                    - interrupted
                  visibility:
                    type: string
                    enum:
                    - private
                    - team
                    - organization
                    - teams
                  publish_permission:
                    type: string
                    enum:
                    - view
                    - edit
                  has_live_connector_data:
                    type: boolean
                  thumbnail_url:
                    type:
                    - string
                    - 'null'
                  last_refresh_at:
                    type:
                    - string
                    - 'null'
                  created_at:
                    type: string
                  updated_at:
                    type: string
                required:
                - id
                - team_id
                - organization_id
                - created_by_user_id
                - title
                - html_code_present
                - status
                - visibility
                - publish_permission
                - created_at
                - updated_at
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Update Pulse Dashboard
    delete:
      operationId: deletePulseDashboard
      tags:
      - Duvo Pulse
      description: Delete a Duvo Pulse dashboard. Only the creator can delete it.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: artifactId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                required:
                - success
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Delete Pulse Dashboard
  /v2/artifacts/{artifact_id}/data-sources:
    get:
      operationId: listPulseDataSources
      tags:
      - Duvo Pulse
      description: Discover queues the current editor may connect to this team-created Pulse before sampling data. Requires live dashboard edit permission and ordinary team data access. Module sources are installed with the Module. A queue ID in generated code does not grant access.
      parameters:
      - schema:
          default: 50
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
      - schema:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
      - schema:
          type: string
          format: uuid
        in: path
        name: artifact_id
        required: true
        description: Current Pulse artifact ID, supplied by the builder or viewer context.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type:
                          - string
                          - 'null'
                        connected:
                          type: boolean
                      required:
                      - id
                      - name
                      - description
                      - connected
                      additionalProperties: false
                  total:
                    type: number
                  limit:
                    type: number
                  offset:
                    type: number
                required:
                - sources
                - total
                - limit
                - offset
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '429':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: List Pulse Data Sources
  /v2/artifacts/{artifact_id}/data-sources/{queue_id}:
    put:
      operationId: connectPulseDataSource
      tags:
      - Duvo Pulse
      description: Connect an authorized same-team queue to a team-created Pulse before sampling it. Idempotent. This bounds dashboard data access; it never grants Process membership or case-action authority. Requires both edit permission and ordinary team source access.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: artifact_id
        required: true
        description: Current Pulse artifact ID, supplied by the builder or viewer context.
      - schema:
          type: string
          format: uuid
        in: path
        name: queue_id
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                    enum:
                    - true
                required:
                - connected
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '429':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
