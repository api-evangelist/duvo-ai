            schema:
              type: object
              properties:
                file_name:
                  type: string
                  minLength: 1
                  pattern: ^.*\.(?:[sS][vV][gG]|[xX][mM][lL]|[pP][nN][gG]|[jJ][pP][eE]?[gG])$
                  description: 'Name of the Miro export file. Supported extensions: .svg, .xml, .png, .jpg, .jpeg'
                content_type:
                  type: string
                  enum:
                  - image/svg+xml
                  - application/xml
                  - text/xml
                  - image/png
                  - image/jpeg
                  description: MIME type of the Miro export file
                extra_capture_request_id:
                  description: Optional extra-capture-request id to bind this import to
                  type: string
                  format: uuid
              required:
              - file_name
              - content_type
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: process_id
        required: true
        description: The clarity process id
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed_url:
                    type: string
                    format: uri
                    description: Signed URL for uploading the artifact
                  capture_id:
                    type: string
                    format: uuid
                    description: Pending capture id to pass to completion
                  expires_at:
                    type: string
                    format: date-time
                    description: ISO 8601 upload URL expiration timestamp
