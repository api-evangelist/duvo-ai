  /v2/teams/{teamId}/clarity-v2/processes/summaries:
    get:
      operationId: listClarityProcessSummaries
      tags:
      - ClarityV2
      description: 'Cross-process portfolio digest for every completed Clarity process on the team: per-process summary, SWOT, projected impact, and a step skeleton (role, system, and flow edges) — without step prose or source excerpts. Paginated (default 5, max 10). Use this to answer portfolio-wide questions in one pass; fetch a single process''s full detail via getClarityProcessSnapshot only for the few that matter.'
      parameters:
      - schema:
          default: 5
          type: integer
          minimum: 1
          maximum: 10
        in: query
        name: limit
        required: false
        description: Processes per page (1-10, default 5). Keeps the response under the MCP output cap.
      - schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
        description: Processes to skip (default 0).
      - schema:
          default: skeleton
          type: string
          enum:
          - skeleton
          - summary
        in: query
        name: detail
        required: false
        description: skeleton = + per-step role/system/flow edges (default); summary = summary+SWOT+impact only (cheaper, for pure ranking).
      - schema:
          default: 'false'
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: include_current_steps
        required: false
        description: Include the as-is (current) step skeleton too. Default false = proposed (to-be) steps only. Pass the literal string 'true' or 'false' (z.coerce.boolean treats any non-empty value, including 'false', as true).
      - schema:
          type: string
        in: path
        name: teamId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  processes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                          - draft
                          - collecting
                          - generating
                          - generating-current-process
                          - generating-transformation-proposal
                          - review
                          - complete
                          - generation_failed
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        current:
                          type: object
                          properties:
                            summary:
                              nullable: true
                              type: string
                            swot:
                              nullable: true
                              type: object
                              properties:
                                strengths:
                                  type: array
                                  items:
                                    type: string
                                    minLength: 1
                                  description: 'Internal advantages of the current process — capabilities, resources, or design choices that work in its favour today. Phrase each as a short, evidence-backed statement. Example: "Bartenders know regulars by name, which keeps service personal during peak hours."'
                                weaknesses:
                                  type: array
                                  items:
                                    type: string
                                    minLength: 1
                                  description: 'Internal limitations of the current process — gaps, inefficiencies, or fragile assumptions visible in how it runs today. Phrase each as a short, evidence-backed statement. Example: "Manual pour times balloon during rushes because there is only one tap."'
                                opportunities:
                                  type: array
                                  items:
                                    type: string
                                    minLength: 1
                                  description: 'External openings the current process could exploit — adjacent automations, scale effects, or unmet needs surfaced by the captures. Example: "POS data could feed dynamic pricing for slow hours."'
                                threats:
                                  type: array
                                  items:
                                    type: string
                                    minLength: 1
                                  description: 'External risks that could degrade the current process — regulatory, operational, technological, or human factors visible in the captures. Example: "New ID-check legislation will require staff to interrupt every order."'
                              required:
                              - strengths
                              - weaknesses
                              - opportunities
                              - threats
                              additionalProperties: false
                          required:
                          - summary
                          - swot
                          additionalProperties: false
                        proposal:
                          nullable: true
                          type: object
                          properties:
                            summary:
                              nullable: true
                              type: string
                            projectedImpact:
                              nullable: true
                              type: string
                            steps:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  title:
                                    type: string
                                  role:
                                    nullable: true
                                    type: string
                                  system:
                                    nullable: true
                                    type: string
                                  nodeType:
                                    nullable: true
                                    type: string
                                  nodeSubtype:
                                    nullable: true
                                    type: string
                                  condition:
                                    nullable: true
                                    type: string
                                  readiness:
                                    nullable: true
                                    type: string
                                  targetSteps:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        stepId:
                                          type: string
                                        label:
                                          nullable: true
                                          type: string
                                        isDefault:
                                          type: boolean
                                      required:
                                      - stepId
                                      - label
                                      - isDefault
                                      additionalProperties: false
                                required:
                                - id
                                - title
                                - role
                                - system
                                - nodeType
                                - nodeSubtype
                                - condition
                                - readiness
                                - targetSteps
                                additionalProperties: false
                          required:
                          - summary
                          - projectedImpact
                          - steps
                          additionalProperties: false
                        roles:
                          type: array
                          items:
                            type: string
                        systems:
                          type: array
                          items:
                            type: string
                      required:
                      - id
                      - name
                      - status
                      - created_at
                      - updated_at
                      - current
                      - proposal
                      - roles
                      - systems
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  limit:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  offset:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                - processes
                - total
                - limit
                - offset
                additionalProperties: false
