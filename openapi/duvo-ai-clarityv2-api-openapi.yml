  /v2/clarity-v2/processes/{process_id}/snapshots/{kind}/generate:
    post:
      operationId: generateClarityProcessSnapshot
      tags:
      - ClarityV2
      description: Trigger a snapshot generation pipeline for a v2 clarity process, selected by kind. `current_process` runs the generateCurrentProcess pipeline (body fields are proposal-only and rejected); `transformation_proposal` runs the generate or regenerate proposal pipeline. Returns 202 immediately and finalises asynchronously via the cc-server webhook stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              default:
                transformation_aggressiveness: aggressive
              type: object
              properties:
                source_snapshot_id:
                  description: 'Transformation proposals only: id of the current-process snapshot to anchor the new proposal to. Defaults to the latest snapshot for the process.'
                  type: string
                  format: uuid
                regenerate_from:
                  description: 'Transformation proposals only: id of a prior proposal snapshot to refine. When supplied, runs the regenerate pipeline using that proposal''s current-process snapshot as the anchor and the extra captures collected since.'
                  type: string
                  format: uuid
                custom_guidance:
                  description: 'Transformation proposals only: optional freeform guidance for this generation. Used as high-priority design guidance, not source-of-truth evidence.'
                  type: string
                  maxLength: 2000
                transformation_aggressiveness:
                  default: aggressive
                  description: 'Transformation proposals only: controls how much the generated proposal should change the current process structure.'
                  type: string
                  enum:
                  - none
                  - conservative
                  - aggressive
              additionalProperties: false
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: process_id
        required: true
        description: The clarity process id
      - schema:
          type: string
          enum:
          - current_process
          - transformation_proposal
        in: path
        name: kind
        required: true
        description: Snapshot kind to list
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                    description: Generation kickoff was accepted
                required:
                - success
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Generate Clarity Process Snapshot
  /v2/clarity-v2/processes/{process_id}/snapshots/{kind}/stop:
    post:
      operationId: stopClarityProcessSnapshot
      tags:
      - ClarityV2
      description: Stop an in-flight snapshot generation for the selected kind. Reads the sandbox id from the process row, kills the sandbox, flips the process back to `review`, and clears the sandbox marker so any late webhook from the killed run is dropped as stale.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: process_id
        required: true
        description: The clarity process id
      - schema:
          type: string
          enum:
          - current_process
          - transformation_proposal
        in: path
        name: kind
        required: true
        description: Snapshot kind to list
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                - success
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Stop Clarity Process Snapshot
  /v2/teams/{teamId}/clarity-v2/processes:
    get:
      operationId: listClarityProcesses
      tags:
      - ClarityV2
      description: List Clarity processes for the current team, most recently updated first. Returns lightweight metadata (capture counts, contributors, status) suitable for building a picker; the per-process read model is available via `GET /v2/teams/:team_id/clarity-v2/processes/:process_id` for v2 rows and `GET /v2/teams/:team_id/clarity/processes/:id` for legacy v1 rows. Both v1 (legacy) and v2 processes are returned by default; use `search`, `status`, and `version` to narrow discovery. Capped at 100 per page.
      parameters:
      - schema:
          default: 50
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Number of processes per page (1-100, default 50)
      - schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
        description: Number of processes to skip (default 0)
      - schema:
          type: string
          minLength: 1
          maxLength: 200
        in: query
        name: search
        required: false
        description: Case-insensitive search across process names
      - schema:
          type: string
          enum:
          - draft
          - collecting
          - generating
          - generating-current-process
          - generating-transformation-proposal
          - review
          - complete
          - generation_failed
        in: query
        name: status
        required: false
        description: Filter by process lifecycle status
      - schema:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        in: query
        name: version
        required: false
        description: 'Filter by Clarity process schema version: 1 legacy, 2 v2'
      - schema:
          type: string
        in: path
        name: teamId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  processes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                          - draft
                          - collecting
                          - generating
                          - generating-current-process
                          - generating-transformation-proposal
                          - review
                          - complete
                          - generation_failed
                        visibility:
                          type: string
                          enum:
                          - team
                          - restricted
                        version:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                          description: 1 = legacy clarity, 2 = clarity v2
                        capture_count:
