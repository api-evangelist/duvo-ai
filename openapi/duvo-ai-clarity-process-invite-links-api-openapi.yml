openapi: 3.2.0
info:
  title: Duvo Public Clarity Process Invite Links API
  description: 'Public API for programmatic access to Duvo. Authenticate with API keys created in the Duvo dashboard.


    ## Rate limits


    Requests are counted per API key. Every response advertises the quota with the IETF RateLimit fields, so a client can self-throttle without waiting for a rejection:


    - `RateLimit-Policy: "default";q=;w=` — the policy in force: `q` requests per `w` seconds.

    - `RateLimit: "default";r=;t=` — the live state: `r` requests left, quota resetting in `t` seconds.

    - Read the quota from the headers rather than hard-coding it; it differs per environment.

    - The same numbers are also sent as `ratelimit-limit`, `ratelimit-remaining` and `ratelimit-reset`.


    Once the quota is exhausted the API answers `429 Too Many Requests` with `Retry-After` set to the seconds to wait; honor it instead of retrying immediately.'
  version: 1.0.0
servers:
- url: https://api.duvo.ai
  description: Production server
tags:
- name: Clarity Process Invite Links
paths:
  /v2/clarity/processes/{id}/invite-link:
    get:
      operationId: getClarityProcessInviteLink
      tags:
      - Clarity Process Invite Links
      description: Get the active interview invite link for a process.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasLink:
                    type: boolean
                  link:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      url:
                        type: string
                        format: uri
                      createdAt:
                        type: string
                      createdBy:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type:
                            - string
                            - 'null'
                          email:
                            type: string
                            format: email
                        required:
                        - id
                        - name
                        - email
                        additionalProperties: false
                    required:
                    - id
                    - createdAt
                    - createdBy
                    additionalProperties: false
                required:
                - hasLink
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
