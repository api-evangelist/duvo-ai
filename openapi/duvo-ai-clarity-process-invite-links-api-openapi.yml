  /v2/clarity-join/{token}:
    get:
      operationId: getClarityProcessJoinInfo
      tags:
      - Clarity Process Invite Links
      description: Get information about a clarity interview invite link (public).
      parameters:
      - schema:
          type: string
        in: path
        name: token
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  processName:
                    type: string
                  processId:
                    type: string
                    format: uuid
                  teamId:
                    type: string
                    format: uuid
                  reason:
                    type: string
                    enum:
                    - invalid
                    - expired
                  setupInterview:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      automationName:
                        type: string
                      invitedByName:
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - automationName
                    - invitedByName
                    additionalProperties: false
                required:
