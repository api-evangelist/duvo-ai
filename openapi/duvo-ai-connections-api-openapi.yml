      tags:
      - Connections
      description: Update an existing connection. For sensitive header values, sending an empty string keeps the existing value; send a new value to overwrite. Toggling `shared` moves the connection between personal and team-shared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                server_url:
                  type: string
                  format: uri
                auth_method:
                  type: string
                  enum:
                  - url
                  - oauth
                  - apikey
                  - headers
                headers:
                  type:
                  - object
                  - 'null'
                  properties:
                    plaintext:
                      type: object
                      additionalProperties:
                        type: string
                    secret:
                      type: object
                      additionalProperties:
                        type: string
                shared:
                  type: boolean
      parameters:
