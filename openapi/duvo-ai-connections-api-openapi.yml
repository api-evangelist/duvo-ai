  /v2/teams/{teamId}/connections:
    get:
      operationId: listConnections
      tags:
      - Connections
      description: List the authenticated user's connections (connected integration instances) for the current team. Includes team-shared instances visible to the caller, and instances another team has granted to this one, when the org-level Connections sharing setting is on. The `type` query parameter filters by integration type, not native OAuth provider key.
      parameters:
      - schema:
          type: string
        in: query
        name: type
        required: false
      - schema:
          default: 100
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
      - schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
      - schema:
          type: string
        in: path
        name: teamId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        type:
                          type: string
                        provider:
                          type: string
                        user_id:
                          type:
                          - string
                          - 'null'
                        team_id:
                          type: string
                        server_url:
                          type: string
                        transport_type:
                          type: string
                          enum:
                          - stdio
                          - sse
                          - http
                        auth_method:
                          type:
                          - string
                          - 'null'
                        custom_integration_id:
                          type:
                          - string
                          - 'null'
                        icon_url:
                          type:
                          - string
                          - 'null'
                        oauth_provider:
                          type:
                          - string
                          - 'null'
                        oauth_provider_key:
                          description: Native OAuth provider key used in the native OAuth start endpoint's provider path parameter. Read this value from listIntegrations; null when the integration type has no native OAuth provider.
                          type:
                          - string
                          - 'null'
                        oauth_scopes:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                        has_headers:
                          type: boolean
                        has_oauth_tokens:
                          type: boolean
                        integration_id:
                          type:
                          - string
                          - 'null'
                        shared:
                          type: boolean
                        created_by:
                          type:
                          - string
                          - 'null'
                        broken_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        broken_reason:
                          type:
                          - string
                          - 'null'
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                      required:
                      - id
                      - name
                      - type
                      - provider
                      - user_id
                      - team_id
                      - created_at
                      - updated_at
                      additionalProperties: false
                  total:
