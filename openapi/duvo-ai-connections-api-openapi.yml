openapi: 3.2.0
info:
  title: Duvo Public Connections API
  description: 'Public API for programmatic access to Duvo. Authenticate with API keys created in the Duvo dashboard.


    ## Rate limits


    Requests are counted per API key. Every response advertises the quota with the IETF RateLimit fields, so a client can self-throttle without waiting for a rejection:


    - `RateLimit-Policy: "default";q=;w=` — the policy in force: `q` requests per `w` seconds.

    - `RateLimit: "default";r=;t=` — the live state: `r` requests left, quota resetting in `t` seconds.

    - Read the quota from the headers rather than hard-coding it; it differs per environment.

    - The same numbers are also sent as `ratelimit-limit`, `ratelimit-remaining` and `ratelimit-reset`.


    Once the quota is exhausted the API answers `429 Too Many Requests` with `Retry-After` set to the seconds to wait; honor it instead of retrying immediately.'
  version: 1.0.0
servers:
- url: https://api.duvo.ai
  description: Production server
tags:
- name: Connections
  description: Manage your connected integrations
paths:
  /v2/teams/{teamId}/connections/oauth/native/{provider}/start:
    post:
      operationId: startNativeOAuth
      tags:
      - Connections
      description: Start an OAuth-based connection with a native provider (Gmail, Google Sheets, Outlook, etc.). The provider path parameter is the native OAuth provider key from listIntegrations, not the integration type. Returns an authorization URL that must be opened in a browser by a human end-user; once they grant consent, Duvo creates the matching connection and redirects the browser to the optional `return_url` (or the Duvo dashboard if none is provided). Poll `/v2/teams/:team_id/connections` to detect the new connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              default: {}
              type: object
              properties:
                return_url:
                  description: Where to send the user's browser after OAuth completes.
                  type: string
                reconnect_instance_id:
                  description: When set, the OAuth flow will update the existing connection in place rather than creating a new one.
                  type: string
                  format: uuid
              additionalProperties:
                type: string
      parameters:
      - schema:
          type: string
        in: path
        name: provider
        required: true
        description: Native OAuth provider key, not the integration type. Use oauth_provider_key from listIntegrations (for example, google_gmail for integration type gmail, google_sheets for googlesheets, or microsoft_outlook for outlook); passing an integration type returns 404 "Unknown OAuth provider".
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url:
                    type: string
                    description: OAuth provider authorization URL to open in a browser
                required:
                - authorization_url
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Start Native OAuth
  /v2/teams/{teamId}/connections/oauth/mcp/start:
    post:
      operationId: authorizeMcpOAuth
      tags:
      - Connections
      description: Start an OAuth-based connection with a remote MCP server using Dynamic Client Registration. Returns an authorization URL the user must open in a browser; once they grant consent, Duvo creates the matching connection and redirects the browser to the optional `returnUrl`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mcp_server_url:
                  type: string
                  format: uri
                  description: URL of the MCP server requiring OAuth.
                name:
                  type: string
                  minLength: 1
                  description: Human-readable name to display for the connection.
                custom_integration_id:
                  description: Optional ID of a custom integration this connection should be associated with.
                  type: string
                  format: uuid
                return_url:
                  description: Where to send the user's browser after consent completes. Accepts an absolute URL on a domain Duvo allows, or a path relative to the Duvo frontend (e.g. `/integrations/slack`).
                  type: string
                integration_type:
                  description: Optional catalog integration type (e.g. `netsuite`, `asana`). When it names a known MCP OAuth catalog integration and `mcp_server_url` matches that integration's registered server, the connection is treated as a catalog connection; otherwise it requires the custom MCP servers capability.
                  type: string
                reconnect_instance_id:
                  description: When set, the OAuth flow will update the existing connection in place rather than creating a new one.
                  type: string
                  format: uuid
                oauth_client_id:
                  description: OAuth client ID of a client the user registered on the authorization server themselves (e.g. a NetSuite Integration record). Takes precedence over preregistered credentials and Dynamic Client Registration. Cannot be combined with custom_integration_id. On reconnect, omit to reuse the connection's stored credentials, or provide to replace (rotate) them.
                  type: string
                  minLength: 1
                oauth_client_secret:
                  description: Client secret for `oauth_client_id`. Omit for public clients (PKCE-only).
                  type: string
                  minLength: 1
              required:
              - mcp_server_url
              - name
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
        in: path
        name: teamId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url:
                    type: string
                    description: OAuth provider authorization URL to open in a browser
                required:
                - authorization_url
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Authorize MCP OAuth
  /v2/connections/oauth/mcp/check:
    post:
      operationId: checkMcpOAuth
      tags:
      - Connections
      description: Probe an MCP server URL to discover whether it supports OAuth Dynamic Client Registration. Returns the authorization endpoint and required scopes when supported. Useful as a precursor to `/v2/teams/:team_id/connections/oauth/mcp/start` or `/v2/teams/:team_id/connections`. Performs no writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mcp_server_url:
                  type: string
                  format: uri
                  description: URL of the MCP server to probe for OAuth support.
              required:
              - mcp_server_url
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  supports_dcr:
                    type: boolean
                    description: True if the MCP server advertises OAuth Dynamic Client Registration
                  authorization_endpoint:
                    description: OAuth authorization endpoint advertised by the MCP server, when discoverable
                    type: string
                  scopes:
                    description: Scopes the MCP server requests during authorization
                    type: array
                    items:
                      type: string
                required:
                - supports_dcr
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Check MCP OAuth
