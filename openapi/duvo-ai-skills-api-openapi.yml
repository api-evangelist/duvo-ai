      summary: List Skill Assignments
  /v2/skills/{skill_id}/revisions:
    get:
      operationId: listSkillRevisions
      tags:
      - Skills
      description: List a skill's version history. Each revision is a snapshot of the skill's files; at most one is active (live) at a time, plus at most one open draft.
      parameters:
      - schema:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Number of revisions per page (1-100, default 20)
      - schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
        description: Number of revisions to skip
      - schema:
          type: string
          format: uuid
        in: path
        name: skill_id
        required: true
        description: Skill ID.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique revision identifier
                        skill_id:
                          type: string
                          description: The skill this revision belongs to
                        revision_number:
                          description: Sequential version number, null while the revision is a draft
                          type:
                          - number
                          - 'null'
                        status:
                          type: string
                          enum:
                          - draft
                          - live
                          - historic
                          description: Lifecycle state of the revision
                        revision_name:
                          description: Optional user-defined name for this revision
                          type:
                          - string
                          - 'null'
                        revision_description:
                          description: Optional user-defined description for this revision
                          type:
                          - string
                          - 'null'
                        created_by:
                          description: Profile id of the user who created the revision
                          type:
                          - string
                          - 'null'
                        created_by_name:
                          description: Display name of the user who created the revision
                          type:
                          - string
                          - 'null'
                        created_at:
                          type: string
                          description: ISO 8601 creation timestamp
                        updated_at:
                          type: string
                          description: ISO 8601 last-update timestamp
                      required:
                      - id
                      - skill_id
                      - revision_number
                      - status
                      - revision_name
                      - revision_description
                      - created_by
                      - created_by_name
                      - created_at
                      - updated_at
                      additionalProperties: false
                    description: Revisions of the skill, newest first
                  total:
                    type: number
                    description: Total number of revisions for the skill
                  limit:
                    type: number
                    description: The page size that was applied
                  offset:
                    type: number
                    description: The offset that was applied
                required:
                - revisions
                - total
                - limit
                - offset
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
