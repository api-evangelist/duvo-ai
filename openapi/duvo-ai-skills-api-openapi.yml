  /v2/skills/{skill_id}/ask-duvo:
    patch:
      operationId: updateSkillAskDuvo
      tags:
      - Skills
      description: Mark a team skill as available in Ask Duvo, or take it back off. Every NEW Ask Duvo chat in the team starts with the marked skills on disk. A chat that is already open keeps the set it started with until its sandbox is replaced, and picks up the current set from then on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                use_in_ask_duvo:
                  type: boolean
              required:
              - use_in_ask_duvo
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: skill_id
        required: true
        description: Skill ID.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      use_in_ask_duvo:
                        type: boolean
                    required:
                    - id
                    - name
                    - use_in_ask_duvo
                    additionalProperties: false
                required:
                - skill
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
