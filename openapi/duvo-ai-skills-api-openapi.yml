      summary: Update Skill Ask Duvo
  /v2/skills/{skill_id}/assignments:
    get:
      operationId: listSkillAssignments
      tags:
      - Skills
      description: List the agents in the current team whose live build references the given skill. Used to warn users that editing a skill will affect every agent that uses it.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: skill_id
        required: true
        description: Skill ID.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique assignment (agent) identifier
                        name:
                          type: string
                          description: Human-readable assignment name
                      required:
                      - id
                      - name
                      additionalProperties: false
                    description: Agents in the current team whose live build uses the skill
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                    description: Total number of assignments referencing the skill
                required:
                - assignments
                - total
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
