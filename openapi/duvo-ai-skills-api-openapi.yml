                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Get Skill File Content
    put:
      operationId: updateSkillFile
      tags:
      - Skills
      description: 'Update the content of a file in a skill, overwriting the active revision in place — the previous content is not recoverable. Prefer the non-destructive flow when you can: createSkillRevision to open a draft, updateSkillRevisionFile to edit it, promoteSkillRevision to activate it. Only team skills can be edited.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: New UTF-8 text content for the file.
              required:
              - content
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: skill_id
        required: true
        description: Skill ID.
      - schema:
          type: string
          minLength: 1
        in: path
        name: '*'
        required: true
        description: Relative path to the file inside the skill, e.g. SKILL.md.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the file was updated
                  message:
                    type: string
                    description: Human-readable result message
                  skill:
                    description: Updated skill metadata, present only when SKILL.md was edited
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique skill identifier
                      name:
                        type: string
                        description: Updated skill name parsed from SKILL.md
                      description:
                        type: string
                        description: Updated skill description parsed from SKILL.md
                    required:
                    - id
                    - name
                    - description
                    additionalProperties: false
                required:
                - success
                - message
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Short error code
                  message:
                    description: Human-readable error message
                    type: string
                  validationErrors:
                    description: Per-field validation errors, present on frontmatter validation failure
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          description: Name of the invalid field
                        message:
                          type: string
                          description: Validation error message for the field
                      required:
                      - field
                      - message
                      additionalProperties: false
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Short error code
                  message:
                    description: Human-readable error message
                    type: string
                  validationErrors:
                    description: Per-field validation errors, present on frontmatter validation failure
                    type: array
                    items:
                      type: object
