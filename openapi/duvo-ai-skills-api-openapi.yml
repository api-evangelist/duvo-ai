      description: Create or update a skill from a JSON body. The server constructs SKILL.md from the provided fields and stores it. If a skill with the same name already exists in the team, it is updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Skill name. 1-64 lowercase alphanumeric chars and hyphens; no leading/trailing or consecutive hyphens.
                description:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: 1-1024 chars describing what the skill does and when to invoke it.
                content:
                  type: string
                  description: Markdown body of SKILL.md without YAML frontmatter. The server prepends the frontmatter from the other fields.
                license:
                  description: 'Optional: license name or reference to a bundled license file.'
                  type: string
                compatibility:
                  description: 'Optional: 1-500 chars describing environment requirements.'
                  type: string
                  maxLength: 500
                metadata:
                  description: 'Optional: arbitrary key-value metadata.'
                  type: object
                  additionalProperties: {}
                allowed-tools:
                  description: 'Optional (experimental): space-delimited list of pre-approved tools.'
                  type: string
              required:
              - name
              - description
              - content
