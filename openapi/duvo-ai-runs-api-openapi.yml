    post:
      operationId: startRun
      tags:
      - Runs
      description: Start a new agent run. Returns immediately with run info - does not wait for completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id:
                  type: string
                  format: uuid
                  description: The agent ID to run
                message:
                  description: Optional initial message to start the run with (e.g. a trigger payload or user instruction)
                  type: string
                sandbox_id:
                  description: Optional sandbox ID with pre-uploaded files
                  type: string
                webhook_url:
                  description: Webhook URL to POST events to (human_request, run_completed, run_failed, run_interrupted)
                  type: string
                  format: uri
              required:
              - agent_id
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
        in: path
        name: teamId
        required: true
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique run identifier
                      agent_id:
                        type: string
                        format: uuid
                        description: ID of the agent being run
                      build_id:
                        type: string
                        format: uuid
                        description: ID of the build being run
                      status:
                        type: string
                        description: Current run status
                      source:
                        nullable: true
                        description: How the run was initiated
                        type: string
                      sandbox_id:
                        nullable: true
                        description: The sandbox ID for this run
                        type: string
                      started_at:
                        nullable: true
                        description: ISO 8601 timestamp when the run started
                        type: string
                      completed_at:
                        nullable: true
                        description: ISO 8601 timestamp when the run completed
                        type: string
                      created_at:
                        type: string
                        description: ISO 8601 timestamp when the run was created
                      updated_at:
                        type: string
                        description: ISO 8601 timestamp when the run was last updated
                      human_in_the_loop_enabled:
                        type: boolean
                        description: Whether this agent can request human input during execution
                    required:
                    - id
                    - agent_id
                    - build_id
                    - status
                    - source
                    - sandbox_id
                    - started_at
                    - completed_at
                    - created_at
                    - updated_at
                    - human_in_the_loop_enabled
                    additionalProperties: false
                    description: The newly created run
                required:
                - run
