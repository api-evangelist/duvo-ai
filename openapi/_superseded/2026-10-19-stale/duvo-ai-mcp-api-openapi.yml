openapi: 3.2.0
info:
  title: Duvo Public MCP API
  description: Public API for programmatic access to Duvo. Authenticate with API keys created in the Duvo dashboard.
  version: 1.0.0
servers:
- url: https://api.duvo.ai
  description: Production server
tags:
- name: MCP
  description: MCP JSON-RPC endpoint exposing public API routes as LLM-callable tools
paths:
  /v2/mcp:
    post:
      tags:
      - MCP
      description: MCP JSON-RPC endpoint (Streamable HTTP transport). Exposes every public API route as an LLM-callable tool.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
      summary: Create mcp
      x-summary-source: derived
      operationId: postV2Mcp
      x-operation-id-source: derived
    get:
      tags:
      - MCP
      description: 'MCP Streamable HTTP: GET is not supported (no server-initiated streaming). Use POST.'
      responses:
        '200':
          description: Default Response
      summary: Get mcp
      x-summary-source: derived
      operationId: getV2Mcp
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key authentication. Get your API key from the Duvo dashboard.
