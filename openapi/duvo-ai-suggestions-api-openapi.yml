                          type: string
                          format: uuid
                        agent_id:
                          type: string
                          format: uuid
                        status:
                          type: string
                          enum:
                          - pending
                          - consumed
                          - rejected
                          - superseded
                        generated_by:
                          type: string
                          enum:
                          - connection_llm
                          - aop_llm
                          - eval
                          - dreaming
                        title:
                          type: string
                        description:
                          type: string
                        dedup_key:
                          type: string
                        resolved_at:
                          type:
                          - string
                          - 'null'
                        resolved_by_user_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        superseded_reason:
                          type:
                          - string
                          - 'null'
                        superseded_by_suggestion_id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        sources:
                          minItems: 1
                          type: array
                          items:
                            type: object
                            properties:
                              agent_run_id:
                                type: string
                                format: uuid
                              run_number:
                                type: integer
                                maximum: 9007199254740991
                              created_at:
                                type: string
                            required:
                            - agent_run_id
                            - run_number
                            - created_at
                            additionalProperties: false
                        type:
                          type: string
                          enum:
                          - aop
                        payload:
                          type: object
                          properties:
                            base_build_id:
                              type: string
                              format: uuid
                            base_revision_number:
                              type:
