openapi: 3.2.0
info:
  title: Duvo Public Suggestions API
  description: 'Public API for programmatic access to Duvo. Authenticate with API keys created in the Duvo dashboard.


    ## Rate limits


    Requests are counted per API key. Every response advertises the quota with the IETF RateLimit fields, so a client can self-throttle without waiting for a rejection:


    - `RateLimit-Policy: "default";q=;w=` — the policy in force: `q` requests per `w` seconds.

    - `RateLimit: "default";r=;t=` — the live state: `r` requests left, quota resetting in `t` seconds.

    - Read the quota from the headers rather than hard-coding it; it differs per environment.

    - The same numbers are also sent as `ratelimit-limit`, `ratelimit-remaining` and `ratelimit-reset`.


    Once the quota is exhausted the API answers `429 Too Many Requests` with `Retry-After` set to the seconds to wait; honor it instead of retrying immediately.'
  version: 1.0.0
servers:
- url: https://api.duvo.ai
  description: Production server
tags:
- name: Suggestions
  description: List, apply, and dismiss an Agent's improvement suggestions (the suggestions inbox in the Duvo UI)
paths:
  /v2/agents/{agent_id}/suggestions:
    get:
      operationId: listAgentSuggestions
      tags:
      - Suggestions
      description: List an Agent's suggestions. status=pending is the inbox; status=history is consumed/dismissed/auto-cleared. Reads lazily auto-clear stale pending items.
      parameters:
      - schema:
          default: pending
          type: string
          enum:
          - pending
          - history
        in: query
        name: status
        required: false
      - schema:
          default: 100
          type: integer
          minimum: 1
          maximum: 250
        in: query
        name: limit
        required: false
      - schema:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
      - schema:
          type: string
          format: uuid
        in: path
        name: agent_id
        required: true
        description: The Agent's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
