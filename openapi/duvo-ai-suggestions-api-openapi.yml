  /v2/agents/suggestions/{id}:
    get:
      operationId: getAgentSuggestion
      tags:
      - Suggestions
      description: 'Fetch a single suggestion. Poll this after a 202 from consume: an AOP apply in flight reports payload.apply.state (running/failed); once consumed, applied_revision_id carries the draft revision the change was staged onto.'
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
        description: The suggestion's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                    - type: object
                      properties:
