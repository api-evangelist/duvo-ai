                            type: string
                            format: uuid
                          agent_id:
                            type: string
                            format: uuid
                          status:
                            type: string
                            enum:
                            - pending
                            - consumed
                            - rejected
                            - superseded
                          generated_by:
                            type: string
                            enum:
                            - connection_llm
                            - aop_llm
                            - eval
                            - dreaming
                          title:
                            type: string
                          description:
                            type: string
                          dedup_key:
                            type: string
                          resolved_at:
                            type:
                            - string
                            - 'null'
                          resolved_by_user_id:
                            type:
                            - string
                            - 'null'
                            format: uuid
                          superseded_reason:
                            type:
                            - string
                            - 'null'
                          superseded_by_suggestion_id:
