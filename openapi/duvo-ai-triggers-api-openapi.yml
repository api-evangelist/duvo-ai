    patch:
      operationId: updateSlackTrigger
      summary: Update Slack Channel Trigger
      tags:
      - Triggers
      description: Update a Slack channel trigger you own — repoint it at another channel, change which messages match, or pause and resume it with `enabled`. Only the supplied fields change. Resuming a paused trigger requires the Slack connection it runs off to still be available on the agent; changing the channel resets the trigger's seen-message state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_id:
                  description: New Slack channel ID to watch. Omit to leave unchanged.
                  type: string
                  minLength: 1
                channel_name:
                  description: New Slack channel name, without the leading `#`.
                  type: string
                  minLength: 1
                match_rule:
                  oneOf:
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - all
                    required:
                    - kind
                    description: Fire on every message posted in the channel.
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - contains
                      values:
                        description: Case-insensitive keywords; a message fires the trigger when it contains any of them. Duplicates are deduplicated.
                        minItems: 1
                        maxItems: 50
                        type: array
                        items:
                          type: string
                          minLength: 1
                          maxLength: 500
                    required:
                    - kind
                    - values
                    description: Fire only on messages containing one of the keywords.
                  description: 'Which channel messages fire the trigger: `{"kind":"all"}` for every message, or `{"kind":"contains","values":["invoice"]}` to match keywords.'
                is_private:
                  description: Whether the channel is private.
                  type: boolean
                enabled:
                  description: Set to false to pause the trigger without deleting it, or true to resume it. Resuming requires the connection the trigger uses to still be available on the agent.
