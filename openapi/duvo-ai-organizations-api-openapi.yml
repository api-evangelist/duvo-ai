                          - document
                          description: 'Capture source: a voice interview or an uploaded document'
                        title:
                          type: string
                          description: Human-readable capture title
                        organizationId:
                          description: Owning organization id, when org-scoped
                          type:
                          - string
                          - 'null'
                          format: uuid
                        organizationName:
                          description: Owning organization name, when available
                          type:
                          - string
                          - 'null'
                        teamId:
                          description: Owning team id, when team-scoped
                          type:
                          - string
                          - 'null'
                          format: uuid
                        teamName:
                          description: Owning team name, when available
                          type:
                          - string
                          - 'null'
                        processNodeId:
                          description: Hierarchy node the capture is filed under, when any
                          type:
                          - string
                          - 'null'
                          format: uuid
                        createdAt:
                          type: string
                          description: ISO 8601 creation timestamp
                        transcriptMessageCount:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                          description: Number of messages in the capture transcript
                        usability_status:
                          type: string
                          enum:
                          - usable
                          - excluded
                        usability_reason:
                          type:
                          - string
                          - 'null'
                        usability_source:
                          type:
                          - string
                          - 'null'
                          enum:
                          - agent
                          - interviewee
                          - manager
                        usability_confidence:
                          type:
