  /v2/organizations/{orgId}/clarity/hierarchy/captures:
    get:
      operationId: listClarityLandscapeCaptures
      tags:
      - Organizations
      description: List the organization's eligible Process Landscape captures (completed interview/document transcripts not yet tied to a process) so they can seed new process proposals.
      parameters:
      - schema:
          default: 100
          type: integer
          minimum: 1
          maximum: 200
        in: query
        name: limit
        required: false
        description: Number of captures to return (1-200, default 100)
      - schema:
          default: 'false'
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: includeTranscripts
        required: false
        description: Include full capture transcripts (large); off by default. Pass the literal string 'true' or 'false' (z.coerce.boolean treats any non-empty value, including 'false', as true).
      - schema:
          type: string
          format: uuid
        in: path
        name: orgId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  captures:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique capture identifier
                        scope:
                          type: string
                          enum:
                          - team
                          - organization
                          description: Whether the capture is owned by a team or the organization
                        type:
                          type: string
                          enum:
                          - interview
                          - document
                          description: 'Capture source: a voice interview or an uploaded document'
                        title:
                          type: string
                          description: Human-readable capture title
                        organizationId:
                          nullable: true
                          description: Owning organization id, when org-scoped
                          type: string
                          format: uuid
                        organizationName:
                          nullable: true
                          description: Owning organization name, when available
                          type: string
                        teamId:
                          nullable: true
                          description: Owning team id, when team-scoped
                          type: string
                          format: uuid
                        teamName:
                          nullable: true
                          description: Owning team name, when available
                          type: string
                        processNodeId:
                          nullable: true
                          description: Hierarchy node the capture is filed under, when any
                          type: string
                          format: uuid
                        createdAt:
                          type: string
                          description: ISO 8601 creation timestamp
                        transcriptMessageCount:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                          description: Number of messages in the capture transcript
                        transcript:
                          description: Full capture transcript, included only when requested
                          type: array
                          items:
                            type: object
                            properties:
                              source:
                                type: string
                                enum:
                                - ai
                                - user
                                - interviewer
                              speakerName:
                                type: string
                              message:
                                type: string
                              timestamp:
                                type: number
                            required:
                            - source
                            - message
                            additionalProperties: false
                      required:
                      - id
                      - scope
                      - type
                      - title
                      - organizationId
                      - organizationName
                      - teamId
                      - teamName
                      - processNodeId
                      - createdAt
                      - transcriptMessageCount
                      additionalProperties: false
                    description: Eligible Process Landscape captures, newest first
                  total:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: Total eligible captures in the organization
                  truncated:
                    type: boolean
                    description: True when more captures exist than were returned
                required:
                - captures
                - total
                - truncated
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: List Clarity Landscape Captures
