  /v2/organizations/mine:
    get:
      operationId: listMyOrganizations
      tags:
      - Organizations
      description: List the organizations the current user belongs to, with their role (organization:member, organization:admin, organization:owner, or organization:executive) and member count in each. Use this to check whether the user has an admin-or-above role before calling organization-scoped endpoints, which reject lower roles with 403.
      security:
      - bearerAuth: []
