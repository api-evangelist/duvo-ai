      summary: Create Org Team
  /v2/organizations/{orgId}/agents:
    get:
      operationId: listOrgAgents
      tags:
      - Organizations
      description: 'List every agent across all teams in an organization, with the team it belongs to, the state of its most recent run and the state of its schedules. Intended for external monitoring: it answers ''which agents have gone silent'' and ''which agents were switched off'' without a request per team or per agent. Requires an organization Admin, Executive, or Owner role, and an API key scoped to all teams you can access — a key pinned to a single team is rejected, because this endpoint spans every team in the organization.'
      parameters:
      - schema:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Number of agents per page (1-100, default 20)
      - schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
        description: Number of agents to skip
      - schema:
          type: string
          format: uuid
        in: query
        name: team_id
        required: false
        description: Filter to agents on this team
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: schedule_enabled
        required: false
        description: If true, only agents with at least one enabled schedule; if false, only agents with none (including agents that are never scheduled)
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: auto_disabled
        required: false
        description: If true, only agents whose schedule was switched off automatically (e.g. after repeated missing-connection failures); if false, only agents with no auto-disabled schedule
      - schema:
          type: string
          format: uuid
        in: path
        name: orgId
        required: true
        description: The organization's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique agent identifier
                        name:
                          type: string
                          description: Human-readable agent name
                        team_id:
                          type: string
                          format: uuid
                          description: Identifier of the team the agent belongs to
                        team_name:
                          type: string
                          description: Name of the team the agent belongs to
                        created_at:
                          description: ISO 8601 creation timestamp
                          type:
                          - string
                          - 'null'
                        updated_at:
                          description: ISO 8601 last-update timestamp
                          type:
                          - string
                          - 'null'
                        last_run_at:
                          description: ISO 8601 creation timestamp of the agent's most recent run, or null when it has never run
                          type:
                          - string
                          - 'null'
                        last_run_status:
                          description: Status of the agent's most recent run, or null if it never ran
                          type:
                          - string
                          - 'null'
                        schedule_enabled:
                          type: boolean
                          description: Whether at least one of the agent's schedules is enabled
                        auto_disabled_at:
                          description: ISO 8601 timestamp at which a schedule was switched off automatically, or null when none was
                          type:
                          - string
                          - 'null'
                        auto_disabled_reason:
                          description: Why a schedule was switched off automatically, when it was
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - name
                      - team_id
                      - team_name
                      - created_at
                      - updated_at
                      - last_run_at
                      - last_run_status
                      - schedule_enabled
                      - auto_disabled_at
                      - auto_disabled_reason
                      additionalProperties: false
                  total:
                    type: number
                    description: Total agents matching the filters, ignoring pagination
                  limit:
                    type: number
                    description: The limit that was applied
                  offset:
                    type: number
                    description: The offset that was applied
                required:
                - agents
                - total
                - limit
                - offset
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: List Org Agents
  /v2/organizations/{orgId}/runs:
    get:
      operationId: listOrgRuns
      tags:
      - Organizations
      description: 'List runs across every team in an organization, filtered by status, agent, team, source, evaluation issues and time. Intended for external monitoring: one call covers the whole org instead of one per team. Requires an organization Admin, Executive, or Owner role, and an API key scoped to all teams you can access — a key pinned to a single team is rejected, because this endpoint spans every team in the organization.'
      parameters:
      - schema:
          default: 20
          type: integer
          minimum: 1
          maximum: 500
        in: query
        name: limit
        required: false
        description: 'Number of runs per page (1-500, default 20). The cap is higher than the team runs endpoint''s because this route serves bulk export: at 100 requests a minute per key, page size is what bounds how fast a month of runs can be pulled.'
      - schema:
          type: string
          minLength: 1
        in: query
        name: cursor
        required: false
        description: 'Resume after the run a previous page ended on: pass the `next_cursor` that page returned, with the same filters and sort_order. Runs created or resolved in between cannot shift a boundary you have already passed, so a sweep sees every run exactly once, and a sweep that started under the default 7-day window keeps that window on every page. This list has no offset parameter: skipping rows costs the database every skipped row, and a run created between two requests shifts every later offset by one, so an offset sweep can repeat or miss a run. 400 when the value is not a cursor this endpoint issued.'
      - schema:
          default: desc
          type: string
          enum:
          - asc
          - desc
        in: query
        name: sort_order
        required: false
        description: Sort direction on created_at (default desc)
      - schema:
          type: string
          enum:
          - not_started
          - pending
          - starting
          - running
          - waiting
          - completed
          - failed
          - interrupted
          - expired
          - stopped
          - needs_attention
        in: query
        name: status
        required: false
        description: 'Filter to runs with this status. `needs_attention` is the monitoring status: runs that are waiting on a human or failed, plus runs whose latest evaluation flagged a critical issue — a run can finish as `completed` and still have accomplished nothing.'
      - schema:
          type: string
          format: uuid
        in: query
        name: team_id
        required: false
        description: Filter to runs on this team
      - schema:
          type: string
          format: uuid
        in: query
        name: agent_id
        required: false
        description: Filter to runs for this agent
      - schema:
          type: string
        in: query
        name: source
        required: false
        description: Filter to runs created from this source (e.g. api, scheduling)
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: has_issues
        required: false
        description: 'Filter on the run''s latest successful evaluation: true returns only runs it flagged, false only runs it did not. Only the latest evaluation counts — an older flag does not match — and a run whose latest evaluation errored, or that has none, counts as unflagged. Omit to return both.'
      - schema:
          type: string
          enum:
          - critical
          - medium
          - low
        in: query
        name: issue_severity
        required: false
        description: Only runs whose latest successful evaluation has at least one failing rubric at this severity (critical | medium | low). Implies has_issues.
      - schema:
          type: string
          format: date-time
        in: query
        name: created_after
        required: false
        description: 'Return runs created at or after this ISO-8601 timestamp. Every run has a creation time, so this is the window that returns all runs in a period whatever state they reached — unlike the started and completed windows below, which exclude runs that never started and runs still in flight respectively. When the request carries no lower time bound (`created_after`, `started_after`, `completed_after` or `since`), this defaults to 7 days ago and `default_window_applied` is true in the response: an organization''s run history is unbounded, and a monitor wants what is recent. An upper bound alone keeps the default floor. Pass any lower bound to replace it.'
      - schema:
          type: string
          format: date-time
        in: query
        name: created_before
        required: false
        description: 'Return runs created before this ISO-8601 timestamp (exclusive). Pair with `created_after` for a period. A closed creation window is also the stable one to paginate: results are ordered by creation time, so runs arriving mid-sweep cannot shift a closed window''s pages.'
      - schema:
          type: string
          format: date-time
        in: query
        name: started_after
        required: false
        description: Return runs that started at or after this ISO-8601 timestamp. Runs that never started are excluded. Pair with `started_before` to bound a stuck-run query to a window — without a lower bound, `status=running` also counts every run left running months ago.
      - schema:
          type: string
          format: date-time
        in: query
        name: started_before
        required: false
        description: Return runs that started before this ISO-8601 timestamp. Combine with status=running to find stuck runs — `since`/`until` filter on completion, so they never match a run that is still going.
      - schema:
          type: string
          format: date-time
        in: query
        name: completed_after
        required: false
        description: Return runs completed at or after this ISO-8601 timestamp. Runs that have not completed are excluded, including every stuck one — reach for `started_after`/`started_before` to bound those. Alias of `since`; pass one or the other, not both.
      - schema:
          type: string
          format: date-time
        in: query
        name: completed_before
        required: false
        description: Return runs completed before this ISO-8601 timestamp (exclusive). Runs that have not completed are excluded. Alias of `until`; pass one or the other, not both.
      - schema:
          type: string
          format: date-time
        in: query
        name: since
        required: false
        description: 'Alias of `completed_after`, kept because it is the name the public team runs endpoint ships. Prefer `completed_after`: this endpoint carries a creation and a start window too, and only the column-named pair says which one this is.'
      - schema:
          type: string
          format: date-time
        in: query
        name: until
        required: false
        description: Alias of `completed_before`, kept because it is the name the public team runs endpoint ships. Prefer `completed_before`.
      - schema:
          default: 'false'
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: count_only
        required: false
        description: Skip row selection and enrichment. The normal list response shape is returned with an empty row array and the matching total.
      - schema:
          default: 'false'
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: include_total
        required: false
        description: 'Return `total`, the count of every matching run ignoring pagination. Off by default: counting walks every match where the page stops at `limit`, so on a large organization it costs orders of magnitude more than the rows themselves. Ask for it when you are driving a pager, not when you are polling. Implied by `count_only`.'
      - schema:
          type: string
          format: uuid
        in: path
        name: orgId
        required: true
        description: The organization's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique run identifier
                        status:
                          type: string
                          description: Current run status
                        source:
                          description: What triggered the run
                          type:
                          - string
                          - 'null'
                        team_id:
                          type: string
                          format: uuid
                          description: Team that owns the run. This is the run's own team, which a cross-team transfer pins to the source team — so it is not always the team the agent belongs to now.
                        team_name:
                          description: Name of that team, or null when the team no longer exists — a run stays pinned to the team that owned it, and that team can since have been deleted.
                          type:
                          - string
                          - 'null'
                        agent_id:
                          type: string
                          format: uuid
                          description: Agent that ran
                        agent_name:
                          type: string
                          description: Name of that agent
                        build_id:
                          description: Revision the run executed
                          type:
                          - string
                          - 'null'
                          format: uuid
                        automation_id:
                          description: Owning automation, if any
                          type:
                          - string
                          - 'null'
                          format: uuid
                        automation_name:
                          description: Name of that automation
                          type:
                          - string
                          - 'null'
                        user_id:
                          description: User the run belongs to, if any
                          type:
                          - string
                          - 'null'
                          format: uuid
                        created_at:
                          type: string
                          description: ISO 8601 creation timestamp
                        updated_at:
                          type: string
                          description: ISO 8601 last-update timestamp
                        started_at:
                          description: ISO 8601 start timestamp
                          type:
                          - string
                          - 'null'
                        completed_at:
                          description: ISO 8601 completion timestamp
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - status
                      - source
                      - team_id
                      - team_name
                      - agent_id
                      - agent_name
                      - build_id
                      - automation_id
                      - automation_name
                      - user_id
                      - created_at
                      - updated_at
                      - started_at
                      - completed_at
                      additionalProperties: false
                  total:
                    description: Total runs matching the filters, ignoring pagination. Null unless `include_total=true` or `count_only=true` — null means not requested, distinct from a count of 0.
                    type:
                    - number
                    - 'null'
                  limit:
                    type: number
                    description: The limit that was applied
                  has_more:
                    type: boolean
                    description: Whether another page exists past this one, determined by looking one row ahead rather than inferred from a full page. False on a count_only response.
                  next_cursor:
                    description: Pass as `cursor` (same filters, same sort_order) to fetch the next page. Null when `has_more` is false. Exact continuation from the last run on this page, unaffected by runs created or resolved in the meantime.
                    type:
                    - string
                    - 'null'
                  created_after:
                    description: 'The creation lower bound the query ran with, as ISO 8601: the caller''s `created_after`, or 7 days ago when the request carried no time bound at all. Null when the caller bounded the query on another timestamp only.'
                    type:
                    - string
                    - 'null'
                  default_window_applied:
                    type: boolean
                    description: True when the request carried no time bound and the 7-day creation window was applied for it. A caller that meant "everything" should pass an explicit `created_after`.
                required:
                - runs
                - total
                - limit
                - has_more
                - next_cursor
                - created_after
                - default_window_applied
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
