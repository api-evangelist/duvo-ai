        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships:
                    type: array
                    items:
                      type: object
                      properties:
                        organization:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            discoveryMode:
                              type: string
                            createdAt:
                              type: string
                          required:
                          - id
                          - name
                          - discoveryMode
                          - createdAt
                          additionalProperties: false
                        role:
