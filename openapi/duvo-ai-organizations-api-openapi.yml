  /v2/organizations/{orgId}/clarity/interviews/document/{interviewId}/complete:
    post:
      operationId: completeClarityOrganizationDocumentUpload
      tags:
      - Organizations
      description: Complete an organization document capture after uploading to GCS; extracts text and stores it as a transcript so it feeds Process Landscape generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  minLength: 1
                  description: Name of the uploaded document file
              required:
              - fileName
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: orgId
        required: true
      - schema:
          type: string
          format: uuid
        in: path
        name: interviewId
        required: true
        description: The organization interview ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  scope:
                    type: string
                    enum:
                    - organization
                  type:
                    type: string
                    enum:
                    - interview
                    - document
                  teamId:
                    type:
                    - string
