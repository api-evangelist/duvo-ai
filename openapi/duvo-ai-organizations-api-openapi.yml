  /v2/organizations/{orgId}/clarity/hierarchy/captures:
    get:
      operationId: listClarityLandscapeCaptures
      tags:
      - Organizations
      description: List the organization's Process Landscape captures. By default, only captures eligible to seed new process proposals are returned; excluded captures can be included for inspection.
      parameters:
      - schema:
          default: 100
          type: integer
          minimum: 1
          maximum: 200
        in: query
        name: limit
        required: false
        description: Number of captures to return (1-200, default 100)
      - schema:
          default: 'false'
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: includeTranscripts
        required: false
        description: Include full capture transcripts (large); off by default. Pass the literal string 'true' or 'false' (z.coerce.boolean treats any non-empty value, including 'false', as true).
      - schema:
          default: 'false'
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: include_excluded
        required: false
        description: Include captures excluded from Process Landscape analysis
      - schema:
          type: string
          format: uuid
        in: path
        name: orgId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  captures:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique capture identifier
                        scope:
                          type: string
