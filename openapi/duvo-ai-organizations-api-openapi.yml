  /v2/organizations/{orgId}/clarity/hierarchy/people:
    get:
      operationId: getClarityHierarchyPeople
      tags:
      - Organizations
      description: List the people attached to every authorized linked process node in the organization's Process Landscape. Returns a flat list where each person carries `nodeId` and `processId`, plus their role, invite status, and capture count. Narrow it with `rootId` (one subtree), `ownerTeamId` (one owning team), and `userId` or `search` (one person) — an unfiltered organization roster is large enough to be refused by response-size caps. To find the processes where one person has not captured yet, filter to that person and read `captureCount` per row. `truncated` is true when the node subtree or any single process roster was capped.
      parameters:
      - schema:
          type: string
          format: uuid
        in: query
        name: rootId
        required: false
        description: Only return rosters for nodes in the subtree under this node
      - schema:
          type: string
          format: uuid
        in: query
        name: ownerTeamId
        required: false
        description: Only return rosters for processes owned by this team. 404s when the team has no readable Process Landscape
      - schema:
          type: string
          format: uuid
        in: query
        name: userId
        required: false
        description: Only return rows for this platform user, matched on the same resolved identity the roster reports (an email-only row resolves through its organization profile)
      - schema:
          type: string
          maxLength: 200
        in: query
        name: search
        required: false
        description: Only return rows whose person name or email contains this text, case-insensitively
      - schema:
          type: string
          format: uuid
        in: path
        name: orgId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        userId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        name:
                          type:
                          - string
                          - 'null'
                        email:
                          type:
                          - string
                          - 'null'
                          format: email
                        role:
                          type:
                          - string
                          - 'null'
                        interviewRequested:
                          default: true
                          type: boolean
                        status:
                          type:
                          - string
                          - 'null'
                          enum:
                          - pending
                        invitationId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        captureCount:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        captureStatusCounts:
                          default:
                            completed: 0
                            inProgress: 0
                            failed: 0
                          type: object
                          properties:
                            completed:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            inProgress:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            failed:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                          required:
                          - completed
                          - inProgress
                          - failed
                          additionalProperties: false
                        createdAt:
                          type: string
                        nodeId:
                          type: string
                          format: uuid
                        processId:
                          type: string
                          format: uuid
                      required:
                      - id
                      - userId
                      - name
                      - email
                      - role
                      - interviewRequested
                      - status
                      - invitationId
                      - captureCount
                      - captureStatusCounts
                      - createdAt
                      - nodeId
                      - processId
                      additionalProperties: false
                  truncated:
                    type: boolean
                required:
                - people
                - truncated
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
