                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Invite Org Member
  /v2/organizations/{orgId}/teams:
    get:
      operationId: listOrgTeams
      tags:
      - Organizations
      description: List teams belonging to an organization you are a member of, including your membership and role in each.
      parameters:
      - schema:
          default: 50
          type: number
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Number of teams per page (1-100, default 50)
      - schema:
          type: number
          minimum: 0
        in: query
        name: offset
        required: false
        description: Number of teams to skip
      - schema:
          type: string
          maxLength: 200
        in: query
        name: search
        required: false
        description: Filter teams by name (case-insensitive substring match)
      - schema:
          default: createdAt
          type: string
          enum:
          - createdAt
          - name
        in: query
        name: sortBy
        required: false
        description: 'Sort order: createdAt (newest first, default) or name (alphabetical)'
      - schema:
          type: string
          format: uuid
        in: path
        name: orgId
        required: true
        description: Organization ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        createdAt:
                          type: string
                        discoveryMode:
                          type: string
                          enum:
                          - request
                          - auto
                        memberCount:
                          type: number
                        pendingInvitationCount:
                          type: number
                        pendingJoinRequestCount:
                          type: number
                        userIsMember:
                          type: boolean
                        userRole:
                          type:
                          - string
                          - 'null'
                        userHasPendingJoinRequest:
                          type: boolean
                        assignmentCount:
                          type: number
                        jobCount:
                          type: number
                        scheduledJobCount:
                          type: number
                        processCount:
                          type: number
                      required:
                      - id
                      - name
                      - createdAt
                      - discoveryMode
                      - memberCount
                      - pendingInvitationCount
                      - pendingJoinRequestCount
                      - userIsMember
                      - userRole
                      - userHasPendingJoinRequest
                      - assignmentCount
                      - jobCount
                      - scheduledJobCount
                      additionalProperties: false
                  total:
                    type: number
                required:
                - teams
                - total
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
