openapi: 3.2.0
info:
  title: Duvo Public Organizations API
  description: 'Public API for programmatic access to Duvo. Authenticate with API keys created in the Duvo dashboard.


    ## Rate limits


    Requests are counted per API key. Every response advertises the quota with the IETF RateLimit fields, so a client can self-throttle without waiting for a rejection:


    - `RateLimit-Policy: "default";q=;w=` — the policy in force: `q` requests per `w` seconds.

    - `RateLimit: "default";r=;t=` — the live state: `r` requests left, quota resetting in `t` seconds.

    - Read the quota from the headers rather than hard-coding it; it differs per environment.

    - The same numbers are also sent as `ratelimit-limit`, `ratelimit-remaining` and `ratelimit-reset`.


    Once the quota is exhausted the API answers `429 Too Many Requests` with `Retry-After` set to the seconds to wait; honor it instead of retrying immediately.'
  version: 1.0.0
servers:
- url: https://api.duvo.ai
  description: Production server
tags:
- name: Organizations
  description: Inspect organizations you belong to and the teams within them
paths:
  /v2/organizations/{orgId}/clarity/hierarchy/proposed-processes:
    post:
      operationId: proposeClarityLandscapeProcess
      tags:
      - Organizations
      description: Create a manual process in the organization's Process Landscape, either as an unassigned proposal or atomically assigned to an eligible team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  description: 'One short paragraph (1-3 sentences) saying why this process belongs in the landscape. Use only what you saw in the captures. Say what the process is (don''t just repeat the name), show proof it really happens, and name where you heard it - be as specific as the captures allow, like "a warehouse lead said so in their interview" or "it came up in two returns recordings". Use only facts from the captures: never make up sources, people, dates, quotes, or numbers, and don''t stretch what was said. If you have no real proof the process happens, don''t propose it.'
                  type:
                  - string
                  - 'null'
                  maxLength: 5000
                parentId:
                  default: null
                  type:
                  - string
                  - 'null'
                  format: uuid
                teamId:
                  default: null
                  type:
                  - string
                  - 'null'
                  format: uuid
                materializationMode:
                  description: 'Use "proposal" to record a process the organization plausibly needs, owned by `teamId` for review, WITHOUT creating a real process record. `teamId` is then required. Chat-scoped discovery agents may use proposal mode for their pinned team; direct human and API callers require Manager-or-above authority for that team. A proposal is idempotent: an equivalent live proposal under the same parent is returned untouched rather than duplicated. Defaults to "auto", which materializes a real process when `teamId` is set — except in a landscape-onboarding chat, which may only propose, and so defaults to "proposal".'
                  type: string
                  enum:
                  - auto
                  - proposal
              required:
              - name
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: orgId
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  parentId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  processId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  name:
                    type: string
                  ownerLabel:
                    type:
                    - string
                    - 'null'
                  sortOrder:
                    type: number
                  existence:
                    type: string
                    enum:
                    - proposed
                    - active
                  contentConfirmedAt:
                    type:
                    - string
                    - 'null'
                  existenceConfirmedAt:
                    type:
                    - string
                    - 'null'
                  source:
                    type: string
                    enum:
                    - ai
                    - human
                  priority:
                    type:
                    - string
                    - 'null'
                    enum:
                    - high
                    - medium
                    - low
                  priorityReasoning:
                    type:
                    - string
                    - 'null'
                  priorityAssessedAt:
                    type:
                    - string
                    - 'null'
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  team:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                    required:
                    - id
                    - name
                    additionalProperties: false
                  outcome:
                    type: string
                    enum:
                    - created
                    - reused
                    description: Whether this call inserted a new node or returned an equivalent one that already existed. Only "proposal" mode can report "reused".
                required:
                - id
                - parentId
                - processId
                - name
                - ownerLabel
                - sortOrder
                - existence
                - contentConfirmedAt
                - existenceConfirmedAt
                - source
                - priority
                - priorityReasoning
                - priorityAssessedAt
                - createdAt
                - updatedAt
                - team
                - outcome
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '422':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Propose Clarity Landscape Process
  /v2/workspaces:
    post:
      operationId: createWorkspace
      tags:
      - Organizations
      description: 'Set up the user''s Duvo workspace, or return the one they already have (`created: false`, nothing created). Call it first when the user has no workspace: other tools fail with ''User has no current team'' until one exists. A new workspace is on the Free plan, with Clarity and Automation. `has_clarity_access` says whether the team''s plan includes Clarity, `interviews_remaining` counts interviews left on the plan without subtracting people invited but not yet interviewed, and `billing_url` is where the user upgrades. If the user''s organization or email domain is already on Duvo, the call is refused with a link the user must open.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization_id:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  team_id:
                    type: string
                    format: uuid
                  created:
                    type: boolean
                  has_clarity_access:
                    type: boolean
                  interviews_remaining:
                    anyOf:
                    - type: number
                    - type: string
                      enum:
                      - unlimited
                  billing_url:
                    type: string
                    format: uri
                required:
                - organization_id
                - team_id
                - created
                - has_clarity_access
                - interviews_remaining
                - billing_url
                additionalProperties: false
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization_id:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  team_id:
                    type: string
                    format: uuid
                  created:
                    type: boolean
                  has_clarity_access:
                    type: boolean
                  interviews_remaining:
                    anyOf:
                    - type: number
                    - type: string
                      enum:
                      - unlimited
                  billing_url:
                    type: string
                    format: uri
                required:
                - organization_id
                - team_id
                - created
                - has_clarity_access
                - interviews_remaining
                - billing_url
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Create Workspace
  /v2/organizations/{orgId}/members:
    post:
      operationId: inviteOrgMember
      tags:
      - Organizations
      description: Invite a person to an organization you administer, optionally assigning them to a team in that organization. Requires an organization Admin, Executive, or Owner role. You cannot grant a role higher than your own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum:
                  - organization:executive
                  - organization:owner
                  - organization:admin
                  - organization:member
                frontendUrl:
                  description: Deprecated. Use `sendEmail` instead. Kept because its presence is the legacy opt-in for sending the invitation email; the value never sets the link host, which is always the server's configured frontend URL.
                  type: string
                  format: uri
                sendEmail:
                  description: 'Email the invitation to the recipient. `false` always suppresses the email. When omitted, the legacy opt-in applies instead: the email is sent only if the deprecated `frontendUrl` is present. Omit both to create the invitation without notifying anyone.'
                  type: boolean
                teamId:
                  type: string
                  format: uuid
              required:
              - email
              - role
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: orgId
        required: true
        description: Organization ID
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  invitationId:
                    type: string
                    format: uuid
                  emailSent:
                    type: boolean
                required:
                - success
                - invitationId
                - emailSent
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
