  /v2/queues/{queue_id}/cases/search:
    post:
      operationId: searchCases
      tags:
      - Cases
      description: 'Search cases in a queue with rich filters (multi-status, date ranges, label-based filters, and field-value filters over a typed queue''s json_data). Use this when the simple query-string filters on GET /v2/queues/:queue_id/cases aren''t enough. Each json_data entry is {path, operator, value} where path is a declared scalar in JSONPath dotted form ($.invoice.amount); entries are ANDed, so two comparisons on one path express a range. A path the queue''s Case schema does not declare is rejected rather than ignored, as is a value that does not match the field''s declared type. The contains operator is case-sensitive (unlike the free-text search parameter). Set count_only=true to skip Case row selection, enrichment, and transformation. The normal response shape is returned with cases: [] and the matching total.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  default: {}
                  type: object
                  properties:
                    status:
                      type: array
                      items:
                        type: string
                        enum:
                        - all
                        - pending
                        - processing
                        - needs_input
                        - postponed
                        - needs_review
                        - resolved
                        - canceled
                        - claimed
                        - completed
                        - failed
                    issue_severity:
                      type: array
                      items:
                        type: string
                        enum:
                        - critical
                        - medium
                    failure_source:
                      description: 'Keep only failed Cases, by who failed them: `system` when Duvo could not finish the Case, `manual` when a person marked it failed.'
                      type: array
                      items:
                        type: string
                        enum:
                        - system
                        - manual
                    awaiting_my_approval:
                      type: boolean
                    priority:
                      type: array
                      items:
                        type: string
                        enum:
                        - none
                        - medium
                        - high
                    created_at_from:
                      type: string
                    created_at_to:
                      type: string
                    updated_at_from:
                      type: string
                    updated_at_to:
                      type: string
                    completed_at_from:
                      description: Keep Cases that reached an outcome at or after this time (inclusive). An ISO timestamp or a lookback such as `7d` or `12h`.
                      type: string
                    completed_at_to:
                      description: Keep Cases that reached an outcome before this time (exclusive). An ISO timestamp or a lookback such as `7d` or `12h`.
                      type: string
                    labels:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                    json_data:
                      maxItems: 12
                      type: array
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                            pattern: ^\$(\.[A-Za-z_][A-Za-z0-9_]{0,63})+$
                          operator:
                            type: string
                            enum:
                            - equals
                            - notEquals
                            - in
                            - notIn
                            - gt
                            - gte
                            - lt
                            - lte
                            - contains
                            - isSet
                            - isNotSet
                          value:
                            anyOf:
                            - anyOf:
                              - type: string
                              - type: number
                              - type: boolean
                            - minItems: 1
                              maxItems: 100
                              type: array
                              items:
                                anyOf:
                                - type: string
                                - type: number
                                - type: boolean
                        required:
                        - path
                        - operator
                        additionalProperties: false
                limit:
                  default: 25
                  type: integer
                  minimum: 1
                  maximum: 100
                offset:
                  default: 0
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                sort_by:
                  default: created_at
                  type: string
                  enum:
                  - created_at
                  - updated_at
                  - postponed_to
                sort_order:
                  default: desc
                  type: string
                  enum:
                  - asc
                  - desc
                search:
                  type: string
                count_only:
                  description: Skip Case row selection, enrichment, and transformation. The normal response shape contains an empty cases array and the matching total.
                  type: boolean
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: queue_id
        required: true
        description: The queue's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  cases:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        queue_id:
                          type: string
                          format: uuid
                        title:
