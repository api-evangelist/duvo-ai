  /v2/queues/{queue_id}/cases/bulk-delete:
    post:
      operationId: bulkDeleteCases
      tags:
      - Cases
      description: Delete multiple cases from a queue. Any active runs are interrupted first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                case_ids:
                  description: Explicit case IDs to act on (1-100). Provide this or set all_matching.
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    format: uuid
                all_matching:
                  description: When true, act on every case matching the provided filters/search instead of an explicit id list.
                  type: boolean
                filters:
                  description: Filters selecting the cases when all_matching is true.
                  type: object
                  properties:
                    status:
                      type: array
                      items:
                        type: string
                        enum:
                        - all
                        - pending
                        - processing
