                  description: Explicit case IDs to act on (1-100). Provide this or set all_matching.
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    format: uuid
                all_matching:
                  description: When true, act on every case matching the provided filters/search instead of an explicit id list.
                  type: boolean
                filters:
                  description: Filters selecting the cases when all_matching is true.
                  type: object
                  properties:
                    status:
                      type: array
                      items:
                        type: string
                        enum:
                        - pending
                        - claimed
                        - completed
                        - failed
                        - needs_input
                        - postponed
                    priority:
                      type: array
                      items:
                        type: string
                        enum:
                        - none
                        - medium
                        - high
                    created_at_from:
                      type: string
                    updated_at_from:
                      type: string
                    labels:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                search:
                  description: Free-text search selecting the cases when all_matching is true.
                  type: string
                status:
                  type: string
                  enum:
                  - pending
                  - completed
