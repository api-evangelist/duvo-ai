                        source_automation_revision_id:
                          description: The automation revision that produced the case. It never changes. Null when no Run created the case (added through the API or an import, or created before automation revisions), and on a team without automation revisions.
                          type:
                          - string
                          - 'null'
                          format: uuid
                        automation_revision_id:
                          description: The automation revision that handles the case. It is set when a Run creates the case, set again to the revision that runs the case when a Run claims it, and otherwise changes only when an activation moves waiting cases. For a case that no Run created, null until a Run claims it or an activation moves it. Null on a team without automation revisions.
                          type:
                          - string
                          - 'null'
                          format: uuid
                        automation_revision:
                          description: The handling revision, resolved. Null when the case has no handling revision.
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: The handling revision's ID.
                            status:
                              type: string
                              enum:
                              - draft
                              - live
                              - historic
                              description: The revision's lifecycle status. A discarded draft, or a revision that no longer exists, reads as `draft`.
                            revision_number:
                              description: The revision's number. Null for a draft, which is numbered only when it is activated.
                              type:
                              - integer
                              - 'null'
                              minimum: -9007199254740991
                              maximum: 9007199254740991
                            name:
                              description: The revision's name, if it has one.
                              type:
                              - string
                              - 'null'
                            is_live:
