        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                frequency:
                  type: string
                  enum:
                  - every_5_minutes
                  - every_15_minutes
                  - hourly
                  - daily
                  - workday
                  - weekly
                  - monthly
