  /v2/revisions/{build_id}/promote:
    post:
      operationId: promoteRevision
      tags:
      - Revisions
      description: Promote a draft or historic revision to the live version. The live revision is the one used by triggers and new runs. Fails if the revision is already live, or if a draft revision still has an active builder run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision_name:
                  description: Optional display name to set on the promoted revision.
                  type: string
                  minLength: 1
                  maxLength: 80
                revision_description:
                  description: Optional description for the promoted revision. Pass null to clear an existing description.
                  type:
