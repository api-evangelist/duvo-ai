      summary: Get Revision
  /v2/revisions/{build_id}:
    patch:
      operationId: updateRevision
      tags:
      - Revisions
      description: Update a revision's configuration, name, description, or handover targets. Returns the updated revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  description: Build configuration object
                  type: object
                  additionalProperties: {}
                handoverTargetIds:
                  description: Agent IDs that this agent can hand over work to
                  type: array
                  items:
                    type: string
                    format: uuid
                handoverTo:
                  description: The single agent or code step to run after this one completes ("Handover to"). Null clears it; omit to leave it unchanged. Mutually exclusive with @-mention handovers in the AOP.
                  type:
                  - string
                  - 'null'
                  format: uuid
                handoverOptions:
                  description: Code steps only. The targets the program may request, and whether it must. Null clears them; omit to leave unchanged. Mutually exclusive with handoverTo in one request.
                  type:
                  - object
                  - 'null'
                  properties:
                    targetAgentIds:
                      minItems: 1
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: Steps in the same automation this code step's program may request
                    required:
                      type: boolean
                      description: When true, a run that exits cleanly without requesting a handover fails
                  required:
                  - targetAgentIds
                  - required
                revision_name:
                  description: Optional user-defined name for this revision. Pass null to clear.
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 80
                revision_description:
                  description: Optional user-defined description for this revision. Pass null to clear.
                  type:
                  - string
                  - 'null'
                  maxLength: 500
                selected_automation_revision_id:
                  description: The automation revision this edit is being made at. Pass a draft and the edit is folded into that draft itself; pass the active revision and the edit lands on a draft branched from it. A historic revision is rejected — it cannot be activated from without an explicit rebase. A revision belonging to a different automation is ignored, and the edit targets the automation the addressed agent belongs to. Omit to target the automation's active revision.
                  type:
                  - string
                  - 'null'
                  format: uuid
