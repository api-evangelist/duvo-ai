                                              enum:
                                              - input_text
                                            text:
                                              type: string
                                          required:
                                          - type
                                          - text
                                        - type: object
                                          properties:
                                            type:
                                              type: string
                                              enum:
                                              - input_image
                                            detail:
                                              type:
                                              - string
                                              - 'null'
