                          - data
                          additionalProperties: false
                      status:
                        nullable: true
                        type: string
                      revision_number:
                        nullable: true
                        type: number
                      parent_build_id:
                        nullable: true
                        type: string
                      created_by:
                        nullable: true
                        type: string
                      created_by_name:
                        nullable: true
                        type: string
                      created_at:
                        nullable: true
                        type: string
                      updated_at:
                        nullable: true
                        type: string
                      schedules:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            build_id:
                              type: string
                            agent_id:
                              type: string
                            user_id:
                              type: string
                            enabled:
                              type: boolean
                            frequency:
                              type: string
                              enum:
                              - every_5_minutes
                              - every_15_minutes
                              - hourly
                              - daily
                              - workday
                              - weekly
                              - monthly
                              - custom
                            time:
                              nullable: true
                              type: string
                            timezone:
                              type: string
                            day:
                              nullable: true
                              type: string
                            day_of_month:
                              nullable: true
                              type: number
                            cron:
                              nullable: true
                              type: string
                            source:
                              nullable: true
                              type: string
                            task:
                              nullable: true
                              type: string
                            recurring:
                              nullable: true
                              type: boolean
                            auto_disabled_at:
                              nullable: true
                              type: string
                            auto_disabled_reason:
                              nullable: true
                              type: string
                            consecutive_missing_connection_failures:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            first_missing_connection_failure_at:
                              nullable: true
                              type: string
                            last_missing_connection_failure_at:
                              nullable: true
                              type: string
                            created_at:
                              type: string
                            updated_at:
                              type: string
                            user_name:
                              nullable: true
                              type: string
                            user_email:
                              nullable: true
                              type: string
                          required:
                          - id
                          - build_id
                          - agent_id
                          - user_id
                          - enabled
                          - frequency
                          - time
                          - timezone
                          - day
                          - day_of_month
                          - cron
                          - source
                          - task
                          - recurring
                          - auto_disabled_at
                          - auto_disabled_reason
                          - consecutive_missing_connection_failures
                          - first_missing_connection_failure_at
                          - last_missing_connection_failure_at
                          - created_at
                          - updated_at
                          additionalProperties: false
                    required:
                    - id
                    - copilot_id
                    - agent_id
                    - name
                    - config
                    - status
                    - revision_number
                    - parent_build_id
                    - created_by
                    - created_at
                    - updated_at
                    additionalProperties: false
                  agent:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                    required:
                    - id
                    additionalProperties: false
                required:
                - build
                - agent
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Create Revision
    get:
      operationId: listAgentRevisions
      tags:
      - Revisions
      description: List revisions for an agent.
      parameters:
      - schema:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Number of revisions per page (1-100, default 20)
      - schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
        description: Number of revisions to skip
      - schema:
          type: string
          format: uuid
        in: path
        name: agent_id
        required: true
        description: The agent's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  builds:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        copilot_id:
                          type: string
                          format: uuid
                        agent_id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        revision_name:
                          nullable: true
                          type: string
                        revision_description:
                          nullable: true
                          type: string
                        config:
                          nullable: true
                          anyOf:
                          - type: object
                            properties:
                              version:
                                type: string
                                enum:
                                - v1
                              data:
                                type: object
                                properties:
                                  model:
                                    type: string
                                  temperature:
                                    nullable: true
                                    type: number
                                    minimum: 0
                                    maximum: 2
                                  max_output_tokens:
                                    nullable: true
                                    type: number
                                    minimum: 0
                                    exclusiveMinimum: true
                                  top_p:
                                    nullable: true
                                    type: number
                                    minimum: 0
                                    maximum: 1
                                  store:
                                    nullable: true
                                    type: boolean
                                  tools: {}
                                  input:
                                    anyOf:
                                    - type: string
                                    - type: array
                                      items:
                                        type: object
                                        properties:
                                          role:
                                            type: string
                                            enum:
                                            - system
                                            - user
                                            - assistant
                                          content:
                                            anyOf:
                                            - type: string
                                            - type: array
                                              items:
                                                anyOf:
                                                - type: object
                                                  properties:
                                                    type:
                                                      type: string
                                                      enum:
                                                      - input_text
                                                    text:
                                                      type: string
                                                  required:
                                                  - type
                                                  - text
                                                  additionalProperties: false
                                                - type: object
                                                  properties:
                                                    type:
                                                      type: string
                                                      enum:
                                                      - input_image
