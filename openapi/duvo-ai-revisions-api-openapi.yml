                  type: array
                  items:
                    type: string
                    format: uuid
                handover_to:
                  description: The single agent or code step to run after this one completes ("Handover to"). Mutually exclusive with handover_target_ids.
                  type:
                  - string
                  - 'null'
                  format: uuid
                handover_options:
                  description: Code steps only. The targets the program may request, and whether it must. Null clears them; omit to inherit the source build's. Mutually exclusive with handover_to.
                  type:
                  - object
                  - 'null'
                  properties:
                    target_agent_ids:
                      minItems: 1
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: Steps in the same automation this code step's program may request
                    required:
                      type: boolean
                      description: When true, a run that exits cleanly without requesting a handover fails
                  required:
                  - target_agent_ids
                  - required
                source_build_id:
                  description: Build ID to copy integrations and queue links from. A numbered revision copied this way is recorded as the new build's parent.
                  type: string
                  format: uuid
                selected_automation_revision_id:
                  description: The automation revision this edit is being made at. Pass a draft and the edit is folded into that draft itself; pass the active revision and the edit lands on a draft branched from it. A historic revision is rejected — it cannot be activated from without an explicit rebase. A revision belonging to a different automation is ignored, and the edit targets the automation the addressed agent belongs to. Omit to target the automation's active revision.
                  type:
                  - string
                  - 'null'
                  format: uuid
              required:
              - name
