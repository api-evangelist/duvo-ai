                                    - glm-5.2
                                    - qwen3.6-27b
                                    - qwen3.8-max
                                    - deepseek-v4-flash
                                    description: Model identifier used for the primary agent loop (Claude, or an OSS model when the team's oss_models flag — or oss_models_public for the public subset — is enabled)
