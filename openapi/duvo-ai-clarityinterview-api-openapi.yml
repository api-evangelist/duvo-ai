          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Number of interviews per page (1-100, default 50)
      - schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
        description: Number of interviews to skip
      - schema:
          type: string
          format: uuid
        in: path
        name: orgId
        required: true
        description: The organization ID
      - schema:
          type: string
          format: uuid
        in: path
        name: nodeId
        required: true
        description: The clarity process folder node ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  interviews:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        userId:
                          type: string
                          format: uuid
                        title:
                          type: string
                        type:
                          type: string
                          enum:
                          - interview
                          - document
                        status:
                          type: string
                          x-extensible-enum:
                          - pending
                          - recording
                          - processing
                          - complete
                          - failed
                        usabilityStatus:
                          default: usable
                          type: string
                          enum:
                          - usable
                          - excluded
                        usabilityReason:
                          default: null
                          type:
                          - string
                          - 'null'
                        usabilitySource:
                          default: null
                          type:
                          - string
                          - 'null'
                          enum:
                          - agent
                          - interviewee
                          - manager
                        usabilityConfidence:
                          default: null
                          type:
                          - string
                          - 'null'
                          enum:
                          - high
                          - medium
                          - low
                        hasTranscript:
                          default: false
                          type: boolean
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                      - id
                      - userId
                      - title
                      - type
                      - status
                      - usabilityStatus
                      - usabilityReason
                      - usabilitySource
                      - usabilityConfidence
                      - hasTranscript
                      - createdAt
                      - updatedAt
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
