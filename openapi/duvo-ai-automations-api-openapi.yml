  /v2/revisions/{build_id}/generate:
    post:
      operationId: generateRevision
      tags:
      - Automations
      description: Generate agent instructions or code into a saved draft. Poll the returned builder run, answer questions if requested, then accept or decline the reviewed checkpoint. This never activates the revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  description: Instructions for generating or refining this agent or code step.
                conversation:
                  description: Optional voice conversation transcript
                  type: array
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                        enum:
                        - ai
                        - user
                      message:
                        type: string
                    required:
                    - source
                    - message
                selected_automation_revision_id:
                  description: The automation revision this edit is being made at. Pass a draft and the edit is folded into that draft itself; pass the active revision and the edit lands on a draft branched from it. A historic revision is rejected — it cannot be activated from without an explicit rebase. A revision belonging to a different automation is ignored, and the edit targets the automation the addressed agent belongs to. Omit to target the automation's active revision.
                  type:
                  - string
                  - 'null'
                  format: uuid
                run_id:
                  description: Optional run ID for context
                  type: string
                  format: uuid
                process_id:
                  description: Optional process ID for context
                  type: string
                  format: uuid
                insight_index:
                  description: Optional insight index for context
                  type: number
                  minimum: 0
                previous_build_id:
                  description: Previous build ID for sandbox reuse
                  type: string
                  format: uuid
              required:
              - prompt
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: build_id
        required: true
        description: Source revision to generate or refine.
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  generation:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                        - generating
                        description: Generation was accepted; poll the builder run for progress.
                      builder_run_id:
                        type: string
                        format: uuid
                        description: Builder run to poll, resume or cancel.
                      build_id:
                        type: string
                        format: uuid
                        description: Target saved draft revision, which may differ from the requested revision.
                    required:
                    - status
                    - builder_run_id
                    - build_id
                    additionalProperties: false
                required:
                - generation
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
