  /v2/automations/{automation_id}/config-fields/{field_id}/definition:
    patch:
      operationId: updateConfigFieldDefinition
      tags:
      - Automations
      description: 'Edit a Policy question: its label, question, guidance, example answer, section, the roles that answer it, the options of a select or multiSelect field, and the columns of an unanswered table field a person added. A reworded question gets a new version, and a new section moves the field to that section''s end. The type of a field added through the API can change while it has no answer; a field from the module template keeps its type. The answer is never changed, and a module template reinstall keeps the edit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Short name for the field, shown as its row heading
                key:
                  description: New code, only for a field added to this automation that no Agent or Code step reads yet
                  type: string
                  minLength: 1
                  maxLength: 120
                  pattern: ^[a-z0-9][a-z0-9_]*$
                question:
                  description: New question; a reworded question gets a new version
                  type: string
                  minLength: 1
                  maxLength: 2000
                guidance:
                  description: New guidance on what to fill in, in plain sentences, or null to remove it
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 2000
                example:
                  description: New example answer, or null to remove it
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 500
                section:
                  description: Section to move the field to the end of, or null for none
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 200
                options:
                  description: Select and multiSelect fields only; replaces the whole list
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                columns:
                  description: Table fields only, while the field has no answer; replaces the whole list
                  minItems: 1
                  maxItems: 20
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                type:
                  description: New value type, only for a field added through the API that has no answer yet
                  type: string
                  enum:
                  - freeText
                  - identifier
                  - number
                  - select
                  - multiSelect
                  - list
                  - orderedList
                  - personList
                  - table
                roles:
                  description: Keys of the process roles whose holders answer this question; replaces the whole list, and empty means anyone
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 120
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: automation_id
        required: true
        description: The automation's unique identifier
      - schema:
          type: string
          format: uuid
        in: path
        name: field_id
        required: true
        description: The config field's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique config field identifier
                      key:
                        type: string
                        description: Stable field key referenced by the automation
                      section:
                        type: string
                        description: Catalog section this field is grouped under
                      position:
                        type: number
                        description: Order of the field within its section
                      label:
                        type: string
                        description: Short name for the field, shown as its row heading
                      question:
                        type: string
                        description: The setup question shown for this field
                      guidance:
                        default: null
                        description: What to fill in for the question, in plain sentences, or null when it carries none
                        type:
                        - string
                        - 'null'
                      example:
                        default: null
                        description: An example answer to the question, or null when it carries none
                        type:
                        - string
                        - 'null'
                      type:
                        type: string
                        enum:
                        - freeText
                        - identifier
                        - number
                        - select
                        - multiSelect
                        - list
                        - orderedList
                        - personList
                        - table
                        - compound
                        - sourcePointer
                        description: Value type (e.g. freeText, number, select, compound)
                      type_config:
                        description: Per-type options (e.g. select choices, number unit/min), or null
                        type:
                        - object
                        - 'null'
                        additionalProperties:
                          $ref: '#/components/schemas/AutomationConfigJsonValue'
                      labels:
                        default: null
                        description: Readable names for the options, columns and parts type_config declares, or null when the field names none
                        type:
                        - object
                        - 'null'
                        properties:
                          options:
                            description: Readable name of each enum value the field declares, by value
                            type: object
                            additionalProperties:
                              type: string
                          columns:
                            description: Readable name of each table column, by column
                            type: object
                            additionalProperties:
                              type: string
                          parts:
                            description: Readable name of each compound part, by part, and of `combine` when the field declares combineOptions
                            type: object
                            additionalProperties:
                              type: string
                        additionalProperties: false
                      bindings:
                        type: array
                        items:
                          type: string
                          enum:
                          - context
                          - parameter
                          - tool
                          - structural
                          - readOnly
                        description: How the value reaches the automation (context, parameter, tool)
                      required:
                        type: boolean
                        description: Whether the field must be filled
                      fill_mode:
                        type: string
                        enum:
                        - interview
                        - setup
                        - module_default
                        description: How the field is filled (interview, setup, module_default)
                      roles:
                        default: []
                        description: Keys of the process roles whose holders answer this question in a setup interview. Empty means anyone can.
                        type: array
                        items:
                          type: string
                      value:
                        description: The current answer, or null when unfilled
                        allOf:
                        - $ref: '#/components/schemas/AutomationConfigJsonValue'
                      default_value:
                        description: The module default value, or null
                        allOf:
                        - $ref: '#/components/schemas/AutomationConfigJsonValue'
                      status:
                        type: string
                        enum:
                        - default
                        - filled
                        description: '''filled'' when the field has a value, else ''default'''
                      provenance:
                        description: Who filled the value and how, or null when unfilled
                        type:
                        - object
                        - 'null'
                        properties:
                          filled_via:
                            type: string
                            x-extensible-enum:
                            - manual
                            - interview
                            - document
                            - template_default
                            - org_default
                            - ask_duvo
                            description: How the value was filled (e.g. interview, document, manual)
                          filled_by_user_id:
                            description: ID of the user who filled the value, when a person did
                            type:
                            - string
                            - 'null'
                          filled_by_name:
                            description: Display name of the user who filled the value
                            type:
                            - string
                            - 'null'
                          filled_at:
                            type: string
