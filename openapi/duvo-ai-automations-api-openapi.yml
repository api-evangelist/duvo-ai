                            type:
                            - string
                            - 'null'
                          source_file_name:
                            default: null
                            description: File name of the uploaded document the value was read from
                            type:
                            - string
                            - 'null'
                        required:
                        - filled_via
                        - filled_by_user_id
                        - filled_by_name
                        - filled_at
                        - filled_by_email
                        - source_capture_id
                        - source_file_name
                        additionalProperties: false
                      origin:
                        default: template
                        description: '''template'' for a question the module template ships, ''added'' for one a person added to this automation'
                        type: string
                        enum:
                        - template
                        - added
                      customized:
                        default: false
                        description: Whether a person has changed this template question since the template last set it; always false for an added question
                        type: boolean
                      active:
                        default: true
                        description: False for a hidden question, which only a list read with include_hidden returns
                        type: boolean
                    required:
                    - id
