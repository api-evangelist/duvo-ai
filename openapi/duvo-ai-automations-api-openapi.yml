                          properties:
                            case_queue_id:
                              type: string
                              format: uuid
                              description: Queue identifier
                            agent_id:
                              description: Agent the queue routes to in this revision (null when unrouted)
                              type:
                              - string
                              - 'null'
                              format: uuid
                            enabled:
                              type: boolean
                              description: Whether the queue's routing is enabled
                            name:
                              description: Per-revision queue name override (null to keep the queue's own name)
                              type:
                              - string
                              - 'null'
                            description:
                              description: Per-revision queue description override
                              type:
                              - string
                              - 'null'
                          required:
                          - case_queue_id
                          - agent_id
                          - enabled
                          - name
                          - description
                          additionalProperties: false
                        description: Member queues with the agent each routes new cases to
                      triggers:
                        type: array
                        items:
                          type: object
                          properties:
                            automation_trigger_id:
                              type:
                              - string
                              - 'null'
                              enum:
                              - null
                              description: 'Always null: the current view is derived from legacy trigger rows, which carry no declaration identity'
                            agent_id:
                              type: string
                              format: uuid
                              description: Agent this trigger routes to
                            integration_slug:
                              type: string
                              description: Integration the declaration watches, e.g. `gmail`
                            trigger_type:
                              type: string
                              description: Trigger type within the integration, e.g. `new_email`
                            enabled:
                              type: boolean
                              description: Whether the trigger is enabled in this revision
                            filter_config:
                              type: object
                              additionalProperties: {}
                              description: Per-revision trigger filter configuration
                          required:
                          - automation_trigger_id
                          - agent_id
                          - integration_slug
                          - trigger_type
                          - enabled
                          - filter_config
                          additionalProperties: false
                        description: Triggers firing for the member agents
                      schedules:
                        type: array
                        items:
                          type: object
                          properties:
                            automation_schedule_id:
                              type:
                              - string
                              - 'null'
                              enum:
                              - null
                              description: 'Always null: the current view is derived from legacy schedule rows, which carry no declaration identity'
                            agent_id:
                              type: string
                              format: uuid
                              description: Agent this schedule fires
                            enabled:
                              type: boolean
                              description: Whether the schedule is enabled in this revision
                            cron:
                              description: 5-field cron expression; when set, the frequency form is unused
                              type:
                              - string
                              - 'null'
                            frequency:
                              description: Frequency form, used when `cron` is null
