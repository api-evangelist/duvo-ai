  /v2/automations/{automationId}/config-fields/{fieldId}:
    patch:
      operationId: updateConfigField
      tags:
      - Automations
      description: 'Set or clear a config field''s value. `value: null` removes the answer and does not restore the module default, so a Run that reads the field is refused until it is answered again. To use the default, send `default_value` as `value`. On a running automation (`running` in readAutomationPolicy) the change reaches its Agents from their next run: name the question, its current answer and the new one, change it only after the user says yes, and pass the current answer you showed, not the new one, as `expected_value` so a change someone made in between is not overwritten. A compound question takes every part in one write. When the field''s `bindings` include `structural`, the module''s Agents also need a matching change; propose it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  allOf:
                  - $ref: '#/components/schemas/AutomationConfigJsonValueInput'
                expected_value:
                  description: The current answer, as you read it and showed the user, not the new one (null if it was unanswered). If the answer has changed since, nothing is written and the call fails with 409; read the Policy again
                  allOf:
                  - $ref: '#/components/schemas/AutomationConfigJsonValueInput'
              required:
              - value
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: automationId
        required: true
        description: Automation ID
      - schema:
          type: string
          format: uuid
        in: path
        name: fieldId
        required: true
        description: Config field ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  key:
                    type: string
                  section:
                    type: string
                  position:
                    type: number
                  label:
                    type: string
                  question:
                    type: string
                  guidance:
                    default: null
                    description: What to fill in for the question, in plain sentences, or null when it carries none
                    type:
                    - string
                    - 'null'
                  example:
                    default: null
                    description: An example answer to the question, or null when it carries none
                    type:
                    - string
                    - 'null'
                  type:
                    type: string
                    enum:
                    - freeText
                    - identifier
                    - number
                    - select
                    - multiSelect
                    - list
                    - orderedList
                    - personList
                    - table
                    - compound
                    - sourcePointer
                  typeConfig:
                    type:
                    - object
                    - 'null'
                    additionalProperties:
                      $ref: '#/components/schemas/AutomationConfigJsonValue'
                  labels:
                    default: null
                    description: Readable names for what typeConfig declares, or null when the field names none
                    type:
                    - object
                    - 'null'
                    properties:
                      options:
                        description: Readable name of each enum value the field declares, by value
                        type: object
                        additionalProperties:
                          type: string
                      columns:
                        description: Readable name of each table column, by column
                        type: object
                        additionalProperties:
                          type: string
                      parts:
                        description: Readable name of each compound part, by part, and of `combine` when the field declares combineOptions
                        type: object
                        additionalProperties:
                          type: string
                    additionalProperties: false
                  bindings:
                    type: array
                    items:
                      type: string
                      enum:
                      - context
                      - parameter
                      - tool
                      - structural
                      - readOnly
                  required:
                    type: boolean
                  fillMode:
                    type: string
                    enum:
                    - interview
                    - setup
                    - module_default
                  roles:
                    default: []
                    type: array
                    items:
                      type: string
                  value:
                    allOf:
                    - $ref: '#/components/schemas/AutomationConfigJsonValue'
                  defaultValue:
                    allOf:
                    - $ref: '#/components/schemas/AutomationConfigJsonValue'
                  status:
                    type: string
                    enum:
                    - default
                    - filled
                  provenance:
                    type:
                    - object
                    - 'null'
                    properties:
                      filledVia:
                        type: string
                        x-extensible-enum:
                        - manual
                        - interview
                        - document
                        - template_default
                        - org_default
                        - ask_duvo
                      filledByUserId:
                        type:
                        - string
                        - 'null'
                      filledByName:
                        type:
                        - string
                        - 'null'
                      filledByEmail:
                        default: null
                        type:
                        - string
                        - 'null'
                      filledAt:
                        type: string
                      sourceCaptureId:
                        type:
                        - string
                        - 'null'
                      sourceFileName:
                        default: null
                        type:
                        - string
                        - 'null'
                    required:
                    - filledVia
                    - filledByUserId
                    - filledByName
                    - filledByEmail
                    - filledAt
                    - sourceCaptureId
                    - sourceFileName
                    additionalProperties: false
                required:
                - id
                - key
                - section
                - position
                - label
                - question
                - guidance
                - example
                - type
                - typeConfig
                - labels
                - bindings
                - required
                - fillMode
                - roles
                - value
                - defaultValue
                - status
                - provenance
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
