                            format: uuid
                          name:
                            type: string
                        required:
                        - id
                        - name
                        additionalProperties: false
                      ready:
                        description: True when every item is ok. Null when the caller can't read the Policy, so readiness can't be judged; `note` then says so
                        type:
                        - boolean
                        - 'null'
                      note:
                        description: 'Present when `ready` is null: what to tell the person asking'
                        type: string
                      summary:
                        type: object
                        properties:
                          ok:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          missing:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          broken:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          connections_to_fix:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                            description: How many Connection items are missing or broken
                        required:
                        - ok
                        - missing
                        - broken
                        - connections_to_fix
                        additionalProperties: false
                        description: Counts over `items`; quote these rather than recounting
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: Stable id of the check, such as `policy`, `connection:<agent>:<integration>` or `trigger`
                            label:
                              type: string
                              description: What the check covers, in the product's words
                            status:
                              type: string
                              enum:
                              - ok
                              - missing
                              - broken
                              description: '`ok`, `missing` (not set up yet) or `broken` (set up, failing)'
                            detail:
                              type: string
                              description: What was found, written for the person asking
                            link:
                              description: Root-relative path of the tab where this item is fixed; null when there is none for this viewer
                              type:
                              - string
                              - 'null'
                            link_tab:
                              description: The name of the tab `link` opens, as the tab bar shows it
                              type:
                              - string
                              - 'null'
                            url:
                              type:
                              - string
                              - 'null'
                              description: The same page as `link`, as a full web-app URL to give the user
                          required:
                          - key
                          - label
                          - status
                          - detail
                          - link
                          - link_tab
                          - url
                          additionalProperties: false
                      links:
                        type: object
                        properties:
                          overview:
                            type: string
                            description: Root-relative path that opens this tab
                          process:
                            type: string
                            description: Root-relative path that opens this tab
                          past_runs:
                            description: 'The Past Runs tab. A Module automation has none: its Runs are on each Agent, opened from agents_queues'
                            type: string
                          requests:
                            description: 'The Requests tab: the questions and approvals this automation''s runs raised, and answering them'
                            type: string
                          policy:
                            type: string
                            description: Root-relative path that opens this tab
                          people:
                            description: 'The People tab: the process roles, meaning who runs, reviews and manages the work. Its own tab, not part of Policy'
                            type: string
                          agents_queues:
                            description: 'The Automation tab: its Agents, Queues and the flow between them'
                            type: string
                          revisions:
                            description: 'The Revisions tab. A Module automation has none: say so, and do not point to another tab or to the Agents for revision history'
                            type: string
                          setup:
                            type: string
                            description: Root-relative path that opens this tab
                          setup_start:
                            type: string
                            description: Root-relative path that opens this tab
                          upload_files:
