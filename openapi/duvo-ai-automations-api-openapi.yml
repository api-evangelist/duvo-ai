                          - label
                          - question
                          - section
                          additionalProperties: false
                      counts:
                        type: object
                        properties:
                          questions:
                            type: object
                            properties:
                              answered:
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                                description: Questions with an answer
                              open:
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                                description: Questions without one
                              total:
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                                description: All of them
                              required_open:
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                                description: 'Required questions still open: these block a Run'
                            required:
                            - answered
                            - open
                            - total
                            - required_open
                            additionalProperties: false
                            description: The team's own questions, as the Policy screen's header counts them
                          module_defaults:
                            type: object
                            properties:
                              filled:
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                                description: Pre-filled values in place
                              open:
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                                description: Ones left empty
                              total:
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                                description: All of them
                            required:
                            - filled
                            - open
                            - total
                            additionalProperties: false
                            description: Values the module pre-fills; open ones are not the team's backlog
                        required:
                        - questions
                        - module_defaults
                        additionalProperties: false
                        description: Answered and open counts
                      pending_proposals:
                        type: array
