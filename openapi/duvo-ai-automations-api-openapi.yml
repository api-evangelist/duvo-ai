  /v2/automations/{automation_id}/dashboard-data:
    get:
      operationId: readAutomationDashboardData
      tags:
      - Automations
      description: 'The figures a Module automation''s Pulse dashboards show, computed server-side the same way the dashboard computes them: each tile''s `label`, `value`, `unit` and `display` (the value as the dashboard prints it), with a `description` where the label alone leaves the figure unclear and a `note` for what the tile shows besides it. Call this for any number on a Module dashboard instead of reading the dashboard''s HTML (`getPulseDashboardHtml` refuses Module dashboards for size) or paging through Cases: a recount can disagree with the tile the user sees. Pass `dashboard_id` for one dashboard, or leave it out for every dashboard of the automation the caller may open. `range` applies to dashboards with a time range control; the result names the range it read. Pass `time_zone` with the user''s IANA zone so a day starts at their midnight, as their dashboard''s do; without it days start at midnight UTC, and `range.time_zone` says which zone was used. Quote `display`, say the period it covers, and name and link the dashboard with its `link`. A dashboard whose figures are not declared, or that was changed since it was installed, comes back `unsupported`; one that could not be read comes back `error`; both carry a `hint`. Needs Queues on the team''s plan. Each `link` is a path in the Duvo web app; give the user the full URL beside it (`url`).'
      parameters:
      - schema:
          type: string
          format: uuid
        in: query
        name: dashboard_id
        required: false
        description: One of the automation's Module dashboards; leave out to read every one
      - schema:
          type: string
          enum:
          - today
          - yesterday
          - week
          - month
          - ytd
          - all
        in: query
        name: range
        required: false
        description: today, yesterday, week, month, ytd or all, for dashboards with a time range control; leave out for the range the dashboard opens on
      - schema:
          type: string
        in: query
        name: time_zone
        required: false
        description: IANA zone the range's days start in, such as Europe/Prague. Pass the user's own zone so Today matches their dashboard; UTC when left out
      - schema:
          type: string
          format: uuid
        in: path
        name: automation_id
        required: true
        description: Automation ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  dashboards:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          status:
                            type: string
                            enum:
                            - ok
                          dashboard:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: The dashboard
                              name:
                                type: string
                                description: The dashboard's name, as its tab shows it
                              link:
                                type: string
                                description: Root-relative path that opens the dashboard; link it when quoting its figures
                              url:
                                type: string
                                description: The same page as `link`, as a full web-app URL to give the user
                            required:
                            - id
                            - name
                            - link
                            - url
                            additionalProperties: false
                          metrics:
                            type: array
                            items:
                              type: object
                              properties:
                                key:
                                  type: string
                                label:
                                  type: string
                                  description: The tile's label
                                value:
                                  description: Null where the dashboard shows no number
                                  type:
                                  - number
                                  - 'null'
                                unit:
                                  type: string
                                  description: '`count`, `percent`, `minutes`, or the ISO currency of a money figure'
                                display:
                                  type: string
                                  description: The value as the dashboard prints it; quote this
                                description:
                                  description: What the figure is, when the label alone leaves it unclear
                                  type: string
                                note:
                                  description: What the tile shows besides its figure
                                  type: string
                              required:
                              - key
                              - label
                              - value
                              - unit
                              - display
                              additionalProperties: false
                          range:
                            type: object
                            properties:
                              key:
                                description: 'The range read: today, yesterday, week, month, ytd or all'
                                type:
                                - string
                                - 'null'
                              label:
                                type: string
                              from:
                                type:
                                - string
                                - 'null'
                              to:
                                type:
                                - string
                                - 'null'
                              time_zone:
                                description: The zone the range's days start in; null for a dashboard with no range control
                                type:
                                - string
                                - 'null'
                            required:
                            - key
                            - label
                            - from
                            - to
                            - time_zone
                            additionalProperties: false
                          as_of:
                            type: string
                            description: When the figures were computed
                          note:
                            description: Present when the figures cover only part of the queue
                            type: string
                        required:
                        - status
                        - dashboard
                        - metrics
                        - range
                        - as_of
                        additionalProperties: false
                      - type: object
                        properties:
                          status:
                            type: string
                            enum:
                            - unsupported
                            - error
                            description: '`unsupported`: its figures are not declared, or it changed since install. `error`: it could not be read'
                          dashboard:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: The dashboard
                              name:
                                type: string
                                description: The dashboard's name, as its tab shows it
                              link:
                                type: string
                                description: Root-relative path that opens the dashboard; link it when quoting its figures
                              url:
                                type: string
                                description: The same page as `link`, as a full web-app URL to give the user
                            required:
                            - id
                            - name
                            - link
                            - url
                            additionalProperties: false
                          hint:
                            type: string
                            description: Why, and what to do instead
                        required:
                        - status
                        - dashboard
                        - hint
                        additionalProperties: false
                  hint:
                    description: Present when the automation has no Module dashboard to read
                    type: string
                required:
                - dashboards
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
