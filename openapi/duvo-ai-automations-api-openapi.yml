  /v2/automations/{automation_id}/config-fields:
    get:
      operationId: listConfigFields
      tags:
      - Automations
      description: Read an automation's module config fields (its Policy), grouped by section in the automation's section order, with each field's current value, default, and fill provenance.
      parameters:
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: include_hidden
        required: false
        description: 'Also return the questions a person hid, marked active: false, in their sections, and every empty section a person added, with no fields. Questions the module template retired are never returned. The counts still cover the visible questions only. Defaults to false.'
      - schema:
          type: string
          format: uuid
        in: path
        name: automation_id
        required: true
        description: The automation's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          default: null
                          description: Stable identifier of the section within its automation, such as 'about-you'. Null for fields whose section is not one of the automation's sections, grouped by their section name.
                          type:
                          - string
                          - 'null'
                        section:
                          type: string
                          description: Section name
                        fields:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Unique config field identifier
                              key:
                                type: string
                                description: Stable field key referenced by the automation
                              section:
                                type: string
                                description: Catalog section this field is grouped under
                              position:
                                type: number
                                description: Order of the field within its section
                              label:
                                type: string
                                description: Short name for the field, shown as its row heading
                              question:
                                type: string
                                description: The setup question shown for this field
                              guidance:
                                default: null
                                description: What to fill in for the question, in plain sentences, or null when it carries none
                                type:
                                - string
                                - 'null'
                              example:
                                default: null
                                description: An example answer to the question, or null when it carries none
                                type:
                                - string
                                - 'null'
                              type:
                                type: string
                                enum:
                                - freeText
                                - identifier
                                - number
                                - select
                                - multiSelect
                                - list
                                - orderedList
                                - personList
                                - table
                                - compound
                                - sourcePointer
                                description: Value type (e.g. freeText, number, select, compound)
                              type_config:
                                description: Per-type options (e.g. select choices, number unit/min), or null
                                type:
                                - object
                                - 'null'
                                additionalProperties:
                                  $ref: '#/components/schemas/AutomationConfigJsonValue'
                              labels:
                                default: null
                                description: Readable names for the options, columns and parts type_config declares, or null when the field names none
                                type:
                                - object
                                - 'null'
                                properties:
                                  options:
                                    description: Readable name of each enum value the field declares, by value
                                    type: object
                                    additionalProperties:
                                      type: string
                                  columns:
                                    description: Readable name of each table column, by column
                                    type: object
                                    additionalProperties:
                                      type: string
                                  parts:
                                    description: Readable name of each compound part, by part, and of `combine` when the field declares combineOptions
                                    type: object
                                    additionalProperties:
                                      type: string
                                additionalProperties: false
                              bindings:
                                type: array
                                items:
                                  type: string
                                  enum:
                                  - context
                                  - parameter
                                  - tool
                                  - structural
                                  - readOnly
                                description: How the value reaches the automation (context, parameter, tool)
                              required:
                                type: boolean
                                description: Whether the field must be filled
                              fill_mode:
                                type: string
                                enum:
                                - interview
                                - setup
                                - module_default
                                description: How the field is filled (interview, setup, module_default)
                              roles:
                                default: []
                                description: Keys of the process roles whose holders answer this question in a setup interview. Empty means anyone can.
                                type: array
                                items:
                                  type: string
                              value:
                                description: The current answer, or null when unfilled
                                allOf:
                                - $ref: '#/components/schemas/AutomationConfigJsonValue'
                              default_value:
                                description: The module default value, or null
                                allOf:
                                - $ref: '#/components/schemas/AutomationConfigJsonValue'
                              status:
                                type: string
                                enum:
                                - default
                                - filled
                                description: '''filled'' when the field has a value, else ''default'''
                              provenance:
                                description: Who filled the value and how, or null when unfilled
                                type:
                                - object
                                - 'null'
                                properties:
                                  filled_via:
                                    type: string
                                    x-extensible-enum:
                                    - manual
                                    - interview
                                    - document
                                    - template_default
                                    - org_default
