                        additionalProperties: false
                        description: 'Links to the automation''s tabs that exist right now, for this viewer. When the user asks where something on the automation is, answer with one of these. A tab the automation does not have is absent: say it has none. Copy these into a reply; never build an automation URL by hand.'
                      links_note:
