  /v2/teams/{teamId}/automations:
    get:
      operationId: listAutomations
      tags:
      - Automations
      description: List the team's automations, each with its live agent and queue counts. An automation is the workspace container an agent or queue belongs to on a team that has moved to Automations — its id is what `POST /queues` and `POST /agents` need as `automation_id`.
      parameters:
      - schema:
          default: 250
          type: integer
          minimum: 1
          maximum: 250
        in: query
        name: limit
        required: false
        description: Number of automations per page (1-250, default 250)
      - schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: offset
        required: false
        description: Number of automations to skip
      - schema:
          type: string
        in: path
        name: teamId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  automations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        agent_count:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        code_step_count:
                          default: 0
                          description: How many of the agent_count members are code steps rather than agents. Defaulted rather than required for the same reason is_setting_up is.
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        queue_count:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        folder_id:
                          default: null
                          description: 'The agent folder this automation sits in, or null when it sits at the root. Automations reuse the team''s existing agent_folder tree rather than a parallel one, so a converted team keeps the grouping it already had. Defaulted rather than required for the same reason is_setting_up is: the client parses this response, and a backend that predates the column must not throw and take the automation''s name down with it.'
                          type:
                          - string
                          - 'null'
                        pinned_at:
                          default: null
                          description: 'When the calling user pinned this automation to the top of their Automations list, or null when they have not. A pin is per user, like an Agent pin: teammates each keep their own. Defaulted rather than required for the same reason folder_id is.'
                          type:
                          - string
                          - 'null'
                        is_setting_up:
                          default: false
                          description: 'True while this Module automation''s setup is under way. setup_started_at is stamped when the team starts setting up (and again by reopen-setup) and cleared when setup finishes, so this reads as currently in setup, not as a record of a past one. Read together with is_demo, which lives on the detail response: both true is a demo with a build under way; is_demo alone is a demo nobody has begun. On the summary rather than the detail so that a client holding only a list, create or patch response knows the state too, and so every write onto the shared automation collection carries it. Defaulted rather than required: the client parses this response, so a backend that predates the column must not throw and take the automation''s name down with it, and nothing on the wire has always meant an automation nobody has set up.'
                          type: boolean
                        setup_step:
                          default: null
                          description: The key of the latest confirmed setup step, null until Start Setup is pressed. The server only ever advances it forward, so reopening a setup can resume where the team got to. Cleared with the rest of the setup state when setup finishes.
                          type:
                          - string
                          - 'null'
                        setup_build_chat_id:
                          default: null
                          description: 'The Ask Duvo chat building the automation from the approved proposal, or null while setup has not reached the build. Not a hard reference: the chat can be deleted while this still names it, which the client reads as no build yet.'
                          type:
                          - string
                          - 'null'
                          format: uuid
                        setup_progress:
                          default: null
                          description: The setup facts behind the tile's Setup badge — captures uploaded, the team's own process map generated, a proposal written — or null while the automation is not being set up (and whenever it has no module process for the facts to hang off).
                          type:
                          - object
                          - 'null'
                          properties:
                            has_captures:
                              type: boolean
                            has_process_map:
                              type: boolean
                            has_proposal:
                              type: boolean
                          required:
                          - has_captures
                          - has_process_map
                          - has_proposal
                          additionalProperties: false
                        viewer_can_edit:
                          description: 'Whether the caller may change this automation. An automation takes its agents'' ownership rule: a Builder may edit one whose every agent they created, and Lead Builder or above may edit any. Sent by the list and detail endpoints; absent from create and update responses, where the client falls back to the caller''s role.'
                          type: boolean
                      required:
                      - id
                      - name
                      - agent_count
                      - code_step_count
                      - queue_count
                      - created_at
                      - updated_at
                      - folder_id
                      - pinned_at
                      - is_setting_up
                      - setup_step
                      - setup_build_chat_id
                      - setup_progress
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  limit:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  offset:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                - automations
                - total
                - limit
                - offset
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
