                      label:
                        type: string
                        description: Short name for the field, shown as its row heading
                      question:
                        type: string
                        description: The setup question shown for this field
                      guidance:
                        default: null
                        description: What to fill in for the question, in plain sentences, or null when it carries none
                        type:
                        - string
                        - 'null'
                      example:
                        default: null
                        description: An example answer to the question, or null when it carries none
                        type:
                        - string
                        - 'null'
                      type:
                        type: string
                        enum:
                        - freeText
                        - identifier
                        - number
                        - select
                        - multiSelect
                        - list
                        - orderedList
                        - personList
                        - table
                        - compound
                        - sourcePointer
                        description: Value type (e.g. freeText, number, select, compound)
                      type_config:
                        description: Per-type options (e.g. select choices, number unit/min), or null
                        type:
                        - object
                        - 'null'
                        additionalProperties:
                          $ref: '#/components/schemas/AutomationConfigJsonValue'
                      labels:
                        default: null
