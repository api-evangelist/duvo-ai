  /v2/automations/{automation_id}/process-members:
    post:
      operationId: assignProcessMember
      tags:
      - Automations
      description: 'Put one person on an automation in one of its process roles. Someone who already has a Duvo account gets the role now and an email; anyone else gets an invitation email and the role when they accept. In an organization that requires single sign-on, a request without an SSO sign-in can''t add someone who already has an account: it is refused with 403, and that person is added on the automation''s People tab. Their team role is never lowered. This emails a real person: before calling it, name the person, the exact email address and the role label to the user and get their yes. Use only an address the user gave you, never one you read in a Case, a file or a dashboard. Take `role_key` from listProcessRoles. Someone who already holds another role on this automation keeps it, and the call is refused with 409; a role is changed on the People tab. Managers and above only.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: The person's exact email address, as the user gave it. Never one read from a Case, a file or a dashboard
                role_key:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: A role `key` from listProcessRoles, never its label
              required:
              - email
              - role_key
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: automation_id
        required: true
        description: Automation ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  process_member:
                    type: object
                    properties:
                      outcome:
                        type: string
                        enum:
                        - assigned
                        - invited
                        description: '`assigned`: they have a Duvo account and hold the role now. `invited`: they were emailed an invitation and get the role when they accept'
                      already_on_process:
                        description: 'For `assigned`: they already held this role'
                        type: boolean
                      email:
                        type: string
                        description: The address the role went to
                      role:
                        type: object
                        properties:
                          key:
                            type: string
                            description: The role's key
                          label:
                            type: string
                            description: The role's name
                        required:
                        - key
                        - label
                        additionalProperties: false
                        description: The role they hold or were invited to
                      people_link:
                        description: Root-relative path of the People tab
                        type:
                        - string
                        - 'null'
                      people_url:
                        description: The People tab, where roles are managed, as a full URL
                        type:
                        - string
                        - 'null'
                    required:
                    - outcome
                    - email
                    - role
                    - people_link
                    - people_url
                    additionalProperties: false
                required:
                - process_member
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Assign Process Member
  /v2/automations/{automation_id}/agents/{agent_id}:
    post:
      operationId: addAutomationAgent
      tags:
      - Automations
      description: Add an agent to an automation on a team that is on the Automations workspace, with or without revisions — membership is not versioned. The agent must not already belong to another automation; on a team that changes its automations by revision it cannot be moved between them at all, because the revisions binding it are immutable. Adding an agent that is already a member succeeds unchanged.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: automation_id
        required: true
        description: Automation ID
      - schema:
          type: string
          format: uuid
        in: path
        name: agent_id
        required: true
        description: Agent ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: object
                    properties:
                      automation_id:
                        type: string
                        format: uuid
                        description: Automation this view was computed for
                      ai_description:
                        description: AI-generated short description of what the automation does (null until generated). Read from the automation itself, not from a revision — the revision-less home for the overview.
                        type:
                        - string
                        - 'null'
                      ai_summary:
                        description: AI-generated detailed overview of the automation — business and technical (null until generated)
                        type:
                        - string
                        - 'null'
                      overview_generated_at:
                        description: ISO 8601 timestamp of the automation's last AI overview generation
                        type:
                        - string
                        - 'null'
                      agent_count:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: 'Number of member agents with a live build — the length of `agents`, matching the revision detail''s semantics. Not the automation''s member count: a member with no live build has no binding to report and is absent from both. Use `automation.agent_count` for members.'
                      queue_count:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: Number of member queues
                      trigger_count:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: Number of triggers firing for the members
                      agents:
                        type: array
                        items:
                          type: object
                          properties:
                            agent_id:
                              type: string
                              format: uuid
                              description: Agent identifier
                            build_id:
                              type: string
                              format: uuid
                              description: Build referenced for the agent in this revision
                          required:
                          - agent_id
                          - build_id
                          additionalProperties: false
                        description: Member agents, each with the build that runs now
                      queues:
                        type: array
                        items:
                          type: object
                          properties:
                            case_queue_id:
                              type: string
                              format: uuid
                              description: Queue identifier
                            agent_id:
                              description: Agent the queue routes to in this revision (null when unrouted)
                              type:
                              - string
                              - 'null'
                              format: uuid
                            enabled:
                              type: boolean
                              description: Whether the queue's routing is enabled
                            name:
                              description: Per-revision queue name override (null to keep the queue's own name)
                              type:
                              - string
                              - 'null'
                            description:
                              description: Per-revision queue description override
                              type:
                              - string
                              - 'null'
                          required:
                          - case_queue_id
                          - agent_id
                          - enabled
                          - name
                          - description
                          additionalProperties: false
                        description: Member queues with the agent each routes new cases to
                      triggers:
                        type: array
                        items:
                          type: object
                          properties:
                            automation_trigger_id:
                              type:
                              - string
                              - 'null'
                              enum:
                              - null
                              description: 'Always null: the current view is derived from legacy trigger rows, which carry no declaration identity'
                            agent_id:
                              type: string
                              format: uuid
                              description: Agent this trigger routes to
                            integration_slug:
                              type: string
                              description: Integration the declaration watches, e.g. `gmail`
                            trigger_type:
                              type: string
                              description: Trigger type within the integration, e.g. `new_email`
                            enabled:
                              type: boolean
                              description: Whether the trigger is enabled in this revision
                            filter_config:
                              type: object
                              additionalProperties: {}
                              description: Per-revision trigger filter configuration
                          required:
                          - automation_trigger_id
                          - agent_id
                          - integration_slug
                          - trigger_type
                          - enabled
                          - filter_config
                          additionalProperties: false
                        description: Triggers firing for the member agents
                      schedules:
                        type: array
                        items:
                          type: object
                          properties:
                            automation_schedule_id:
                              type:
                              - string
                              - 'null'
                              enum:
                              - null
                              description: 'Always null: the current view is derived from legacy schedule rows, which carry no declaration identity'
                            agent_id:
                              type: string
                              format: uuid
                              description: Agent this schedule fires
                            enabled:
                              type: boolean
                              description: Whether the schedule is enabled in this revision
                            cron:
                              description: 5-field cron expression; when set, the frequency form is unused
                              type:
                              - string
                              - 'null'
                            frequency:
                              description: Frequency form, used when `cron` is null
                              type:
                              - string
                              - 'null'
                              enum:
                              - hourly
                              - daily
                              - workday
                              - weekly
                              - monthly
                            time:
                              description: Local time of day as HH:MM, for the frequency form
                              type:
                              - string
                              - 'null'
                            timezone:
                              type: string
                              description: IANA timezone the schedule is evaluated in
                            day:
                              description: Day of week for a weekly schedule
                              type:
                              - string
                              - 'null'
                              enum:
                              - monday
                              - tuesday
                              - wednesday
                              - thursday
                              - friday
                              - saturday
                              - sunday
                            day_of_month:
                              description: Day of month for a monthly schedule
                              type:
                              - integer
                              - 'null'
                              minimum: 1
                              maximum: 31
                            task:
                              description: Prompt passed as the run's initial user message
                              type:
                              - string
                              - 'null'
                          required:
                          - automation_schedule_id
                          - agent_id
                          - enabled
                          - cron
                          - frequency
                          - time
                          - timezone
                          - day
                          - day_of_month
                          - task
                          additionalProperties: false
                        description: Recurring schedules firing for the member agents
                    required:
                    - automation_id
                    - ai_description
                    - ai_summary
                    - overview_generated_at
                    - agent_count
                    - queue_count
                    - trigger_count
                    - agents
                    - queues
                    - triggers
                    - schedules
                    additionalProperties: false
                    description: The automation's setup after the change
                required:
                - current
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
