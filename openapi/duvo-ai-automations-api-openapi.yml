  /v2/automations/{automation_id}:
    get:
      operationId: getAutomation
      tags:
      - Automations
      description: Get a single automation with its agent and queue counts, the tab arrangement its detail view navigates by, and `links` to each tab it has right now.
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: automation_id
        required: true
        description: Automation ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  automation:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      agent_count:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      code_step_count:
                        default: 0
                        description: How many of the agent_count members are code steps rather than agents. Defaulted rather than required for the same reason is_setting_up is.
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      queue_count:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      folder_id:
                        default: null
                        description: 'The agent folder this automation sits in, or null when it sits at the root. Automations reuse the team''s existing agent_folder tree rather than a parallel one, so a converted team keeps the grouping it already had. Defaulted rather than required for the same reason is_setting_up is: the client parses this response, and a backend that predates the column must not throw and take the automation''s name down with it.'
                        type:
                        - string
                        - 'null'
                      pinned_at:
                        default: null
                        description: 'When the calling user pinned this automation to the top of their Automations list, or null when they have not. A pin is per user, like an Agent pin: teammates each keep their own. Defaulted rather than required for the same reason folder_id is.'
                        type:
                        - string
                        - 'null'
                      is_setting_up:
                        default: false
                        description: 'True while this Module automation''s setup is under way. setup_started_at is stamped when the team starts setting up (and again by reopen-setup) and cleared when setup finishes, so this reads as currently in setup, not as a record of a past one. Read together with is_demo, which lives on the detail response: both true is a demo with a build under way; is_demo alone is a demo nobody has begun. On the summary rather than the detail so that a client holding only a list, create or patch response knows the state too, and so every write onto the shared automation collection carries it. Defaulted rather than required: the client parses this response, so a backend that predates the column must not throw and take the automation''s name down with it, and nothing on the wire has always meant an automation nobody has set up.'
                        type: boolean
                      setup_step:
                        default: null
                        description: The key of the latest confirmed setup step, null until Start Setup is pressed. The server only ever advances it forward, so reopening a setup can resume where the team got to. Cleared with the rest of the setup state when setup finishes.
                        type:
                        - string
                        - 'null'
                      setup_build_chat_id:
                        default: null
                        description: 'The Ask Duvo chat building the automation from the approved proposal, or null while setup has not reached the build. Not a hard reference: the chat can be deleted while this still names it, which the client reads as no build yet.'
                        type:
                        - string
                        - 'null'
                        format: uuid
                      setup_progress:
                        default: null
                        description: The setup facts behind the tile's Setup badge — captures uploaded, the team's own process map generated, a proposal written — or null while the automation is not being set up (and whenever it has no module process for the facts to hang off).
                        type:
                        - object
                        - 'null'
                        properties:
                          has_captures:
                            type: boolean
                          has_process_map:
                            type: boolean
                          has_proposal:
                            type: boolean
                        required:
                        - has_captures
                        - has_process_map
                        - has_proposal
                        additionalProperties: false
                      viewer_can_edit:
                        description: 'Whether the caller may change this automation. An automation takes its agents'' ownership rule: a Builder may edit one whose every agent they created, and Lead Builder or above may edit any. Sent by the list and detail endpoints; absent from create and update responses, where the client falls back to the caller''s role.'
                        type: boolean
                      live_revision_number:
                        description: 'Number of the live revision, or null when none is live. It is a number, not a history the user can open: revision history is shown only on the Revisions tab, so when asked for it and `links` has no `revisions`, first say this Automation has no Revisions tab.'
                        type:
                        - integer
                        - 'null'
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      module_template_slug:
                        description: Slug of the Module template this Automation was created from, or null. Permanent provenance — it survives setup and is not cleared.
                        type:
                        - string
                        - 'null'
                      module_template_version:
                        description: Version of that template, set alongside the slug.
                        type:
                        - integer
                        - 'null'
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      clarity_process_id:
                        default: null
                        description: 'The Clarity process this Automation runs: its Module''s process, or the one it was built from. Null when it runs none. Its map is what the Process tab shows. Defaulted for a backend that predates the field.'
                        type:
                        - string
                        - 'null'
                      process_node_id:
                        description: 'The process identity this Automation pins, which its People roles hang off. Null when it has none: its team has no organization, or a Module automation is not linked to its process yet.'
                        type:
                        - string
                        - 'null'
                        format: uuid
                      is_demo:
                        type: boolean
                        description: 'True while this is an unconverted Module demo: its data is sample data and it cannot run. Cleared when the demo is converted into a real automation, which is irreversible and either deletes the sample cases and Runs or closes them out as history. Starting setup does not clear it: that only records that setup began.'
                      has_draft:
                        type: boolean
                        description: 'Whether an open draft revision exists. Always false for an automation without revisions: an automation-level draft badge is a revision concept, and the agent builder surfaces its own draft build state.'
                      created_by:
                        description: User who created the automation (null for migrated teams)
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type:
                            - string
                            - 'null'
                          email:
                            type: string
                        required:
                        - id
                        - name
                        - email
                        additionalProperties: false
                      updated_by:
                        description: User who last updated the automation
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type:
                            - string
                            - 'null'
                          email:
                            type: string
                        required:
                        - id
                        - name
                        - email
                        additionalProperties: false
                    required:
                    - id
                    - name
                    - agent_count
                    - code_step_count
                    - queue_count
                    - created_at
                    - updated_at
                    - folder_id
                    - pinned_at
                    - is_setting_up
                    - setup_step
                    - setup_build_chat_id
                    - setup_progress
                    - live_revision_number
                    - module_template_slug
                    - module_template_version
                    - clarity_process_id
                    - is_demo
                    - has_draft
                    - created_by
                    - updated_by
                    additionalProperties: false
                  tabs:
                    description: The detail view's tab arrangement, carried here so opening an automation resolves its navigation in the same request as the automation itself.
                    type: object
                    properties:
                      layout:
                        type: object
                        properties:
                          order:
                            maxItems: 50
                            type: array
                            items:
                              type: string
                              minLength: 1
                              maxLength: 200
                            description: Left-group tab keys in render order
                          hidden:
                            maxItems: 50
                            type: array
                            items:
                              type: string
                              minLength: 1
                              maxLength: 200
                            description: Native tab keys the user removed from the bar
                        required:
                        - order
                        - hidden
                        additionalProperties: false
                      pulse_tabs:
                        type: array
                        items:
                          type: object
                          properties:
                            artifact_id:
                              type: string
                              format: uuid
                              description: Pinned Pulse dashboard
                            title:
                              description: Dashboard title (null until the agent names it)
                              type:
                              - string
                              - 'null'
                            icon:
                              description: Lucide icon name picked when the dashboard was named (null for dashboards generated before icons existed)
                              type:
                              - string
                              - 'null'
                              minLength: 1
                              maxLength: 64
                              pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                            status:
                              type: string
                              enum:
                              - not_started
                              - pending
                              - running
                              - completed
                              - failed
                              - interrupted
                              description: Generation status of the dashboard
                          required:
                          - artifact_id
                          - title
                          - status
                          additionalProperties: false
                        description: Resolved metadata for the pinned Pulse dashboards in `order`
                    required:
                    - layout
                    - pulse_tabs
                    additionalProperties: false
                  links:
                    type: object
                    properties:
                      overview:
                        type: string
                        description: Root-relative path that opens this tab
                      process:
                        type: string
                        description: Root-relative path that opens this tab
                      past_runs:
                        description: 'The Past Runs tab. A Module automation has none: its Runs are on each Agent, opened from agents_queues'
                        type: string
                      requests:
                        description: 'The Requests tab: the questions and approvals this automation''s runs raised, and answering them'
                        type: string
                      policy:
                        type: string
                        description: Root-relative path that opens this tab
                      people:
                        description: 'The People tab: the process roles, meaning who runs, reviews and manages the work. Its own tab, not part of Policy'
                        type: string
                      agents_queues:
                        description: 'The Automation tab: its Agents, Queues and the flow between them'
                        type: string
                      revisions:
                        description: 'The Revisions tab. A Module automation has none: say so, and do not point to another tab or to the Agents for revision history'
                        type: string
                      setup:
                        type: string
                        description: Root-relative path that opens this tab
                      setup_start:
                        type: string
                        description: Root-relative path that opens this tab
                      upload_files:
                        type: string
                        description: Root-relative path that opens this tab
                      interview:
                        type: string
                        description: Root-relative path that opens this tab
                      automation_proposal:
                        type: string
                        description: Root-relative path that opens this tab
                      dashboards:
                        type: array
                        items:
                          type: object
                          properties:
                            artifact_id:
                              type: string
                              format: uuid
                              description: The dashboard
                            name:
                              type: string
                              description: The dashboard's tab label
                            link:
                              type: string
                              description: Root-relative path that opens this tab
                          required:
                          - artifact_id
                          - name
                          - link
                          additionalProperties: false
                        description: One link per dashboard on this automation's tab bar
                    required:
                    - dashboards
                    additionalProperties: false
                    description: 'Links to the automation''s tabs that exist right now, for this viewer. When the user asks where something on the automation is, answer with one of these. A tab the automation does not have is absent: say it has none. Copy these into a reply; never build an automation URL by hand.'
                required:
                - automation
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
