                        description: Root-relative path that opens this tab
                      setup_start:
                        type: string
                        description: Root-relative path that opens this tab
                      upload_files:
                        type: string
                        description: Root-relative path that opens this tab
                      interview:
                        type: string
                        description: Root-relative path that opens this tab
                      automation_proposal:
                        type: string
                        description: Root-relative path that opens this tab
                      dashboards:
