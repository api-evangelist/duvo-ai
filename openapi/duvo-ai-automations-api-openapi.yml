  /v2/automations/{automation_id}/policy-interviews:
    post:
      operationId: assignPolicyInterview
      tags:
      - Automations
      description: 'Assign a Policy interview: a Clarity voice interview covering the automation''s open Policy questions, whose answers are written back onto them. Pass `invited_email` to email it to someone, and `context` to say who they are; leave `invited_email` out to create an unassigned interview slot. This emails a real person: name them, give the exact address and say what the interview covers, and call this only after the user says yes. Use only an address the user gave you. Administrators and above only.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invited_email:
                  description: Who to email the interview to, exactly as the user gave it; leave out to create an unassigned interview slot
                  type: string
                  format: email
                context:
                  description: Who this person is, for the interview's guidance
                  type: string
                  minLength: 1
                  maxLength: 300
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: automation_id
        required: true
        description: Automation ID
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  interview:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The interview
                      invited_email:
                        description: Who it was sent to; null for an unassigned slot
                        type:
                        - string
                        - 'null'
                      join_url:
                        description: Anyone with this link can join. Null for an unassigned slot, and under impersonation, where only the email carries it
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - invited_email
                    - join_url
                    additionalProperties: false
                required:
                - interview
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
