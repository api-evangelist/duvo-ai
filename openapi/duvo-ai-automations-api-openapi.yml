                key:
                  description: Code for the field, unique within the automation; derived from the label when left out
                  type: string
                  minLength: 1
                  maxLength: 120
                  pattern: ^[a-z0-9][a-z0-9_]*$
                question:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: The setup question asked for this field
                guidance:
                  description: What to fill in for the question, in plain sentences; left out or null for none
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 2000
                example:
                  description: An example answer to the question; left out or null for none
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 500
                type:
                  type: string
                  enum:
                  - freeText
                  - identifier
                  - number
                  - select
                  - multiSelect
                  - list
                  - orderedList
                  - personList
                  - table
                  description: Value type; compound and sourcePointer are template-only
                section:
                  default: null
                  description: Section to add the field to, or null for none
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 200
                fill_mode:
                  default: interview
                  description: How the field is filled (interview, setup)
                  type: string
                  enum:
                  - interview
                  - setup
                options:
                  description: Required for select and multiSelect, refused otherwise
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                columns:
                  description: Required for table, refused otherwise
                  minItems: 1
                  maxItems: 20
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                bindings:
                  default:
                  - context
                  description: How the value reaches the automation (context, tool)
                  minItems: 1
                  type: array
                  items:
                    type: string
                    enum:
                    - context
                    - tool
                roles:
                  description: Keys of the process roles whose holders answer this question; empty means anyone
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 120
              required:
              - label
              - question
              - type
