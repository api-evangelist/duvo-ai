  /v2/automations/{automation_id}/policy:
    get:
      operationId: readAutomationPolicy
      tags:
      - Automations
      description: 'Read an automation''s whole Policy before answering anything about it: every question by section, with its `id` (the field id updateConfigField takes), key, type, answer and who gave it; `counts.questions` as the Policy screen''s header counts them (`required_open` is what still blocks a run) apart from the module''s pre-filled `module_defaults`; answers proposed by interviews and waiting for review; accepted and pending process-context notes; the interviews assigned; and `pending_apply`, the structural answers and notes not yet written into an Agent. `running` says whether the automation runs on live work: there a changed answer reaches its Agents from their next run, so name the question, its current answer and the new one, and change it only after the user says yes. A question whose `bindings` include `structural` changes how the Agents run; propose the matching Agent change too. Never invent an answer for a question shown as open. Give the user the full URLs in `urls`.'
      parameters:
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: include_hidden
        required: false
        description: Also list the questions a person hid, under hidden_fields. Defaults to false.
      - schema:
          type: string
          format: uuid
        in: path
        name: automation_id
        required: true
        description: Automation ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy:
                    type: object
                    properties:
                      automation:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The automation
                          name:
                            type: string
                            description: The automation's name
                        required:
                        - id
                        - name
                        additionalProperties: false
                        description: The automation this Policy belongs to
                      running:
                        type: boolean
                        description: 'Whether the automation runs on live work: a changed answer is used from its Agents'' next run, so confirm each change with the user first'
                      sections:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              description: Null for the questions that sit in no section
                              type:
                              - string
                              - 'null'
                            section:
                              type: string
                              description: The section's name
                            fields:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                    description: Pass as the field id to updateConfigField and its siblings
                                  key:
                                    type: string
                                    description: Stable key an Agent's AOP references
                                  label:
                                    type: string
                                    description: Short name of the question
                                  question:
                                    type: string
                                    description: The question as the Policy tab asks it
                                  type:
                                    type: string
                                    enum:
                                    - freeText
                                    - identifier
                                    - number
                                    - select
                                    - multiSelect
                                    - list
                                    - orderedList
                                    - personList
                                    - table
                                    - compound
                                    - sourcePointer
                                    description: What kind of answer it takes
                                  options:
                                    description: The choices of a select or multiSelect question
                                    type: array
                                    items: {}
                                  columns:
                                    description: The columns of a table question
                                    type: array
                                    items: {}
                                  origin:
                                    type: string
                                    enum:
                                    - template
                                    - added
                                    description: '`template`: shipped with the module. `added`: a person added it'
                                  customized:
                                    type: boolean
                                    description: A template question someone has edited since install
                                  bindings:
                                    type: array
                                    items:
                                      type: string
                                      enum:
                                      - context
                                      - parameter
                                      - tool
                                      - structural
                                      - readOnly
                                    description: '`structural` means its answer changes how the module''s Agents run: changing it also needs a matching Agent change'
                                  required:
                                    type: boolean
                                    description: An open required question blocks a Run
                                  fill_mode:
                                    type: string
                                    enum:
                                    - interview
                                    - setup
                                    - module_default
                                    description: How the question is meant to be answered
                                  status:
                                    type: string
                                    enum:
                                    - answered
                                    - open
                                    description: Whether it has an answer
                                  value:
                                    description: The current answer; never invent one for an open question
                                    allOf:
                                    - $ref: '#/components/schemas/AutomationPolicyJsonValue'
                                  provenance:
                                    description: Who answered it, how and when
                                    type:
                                    - object
                                    - 'null'
                                    properties:
                                      filled_via:
                                        type: string
                                        enum:
                                        - manual
                                        - interview
                                        - document
                                        - template_default
                                        - org_default
                                        - ask_duvo
                                        description: How the answer was given
                                      filled_by_name:
                                        description: Who gave it, when a person did
                                        type:
                                        - string
                                        - 'null'
                                      filled_at:
                                        type: string
                                        description: When, as an ISO timestamp
                                    required:
                                    - filled_via
                                    - filled_by_name
                                    - filled_at
                                    additionalProperties: false
                                required:
                                - id
                                - key
                                - label
                                - question
                                - type
                                - origin
                                - customized
                                - bindings
                                - required
                                - fill_mode
                                - status
                                - value
                                - provenance
                                additionalProperties: false
                              description: The section's questions, in Policy order
                          required:
                          - key
                          - section
                          - fields
                          additionalProperties: false
                        description: Every visible question, by section
                      hidden_fields:
                        description: 'Present with include_hidden: questions a person hid'
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: The question
                            key:
                              type: string
                              description: Its key
                            label:
                              type: string
                              description: Its short name
                            question:
                              type: string
                              description: The question
                            section:
                              description: Its section's name
                              type:
