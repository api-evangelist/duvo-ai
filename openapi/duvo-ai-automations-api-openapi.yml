openapi: 3.2.0
info:
  title: Duvo Public Automations API
  description: 'Public API for programmatic access to Duvo. Authenticate with API keys created in the Duvo dashboard.


    ## Rate limits


    Requests are counted per API key. Every response advertises the quota with the IETF RateLimit fields, so a client can self-throttle without waiting for a rejection:


    - `RateLimit-Policy: "default";q=;w=` — the policy in force: `q` requests per `w` seconds.

    - `RateLimit: "default";r=;t=` — the live state: `r` requests left, quota resetting in `t` seconds.

    - Read the quota from the headers rather than hard-coding it; it differs per environment.

    - The same numbers are also sent as `ratelimit-limit`, `ratelimit-remaining` and `ratelimit-reset`.


    Once the quota is exhausted the API answers `429 Too Many Requests` with `Retry-After` set to the seconds to wait; honor it instead of retrying immediately.'
  version: 1.0.0
servers:
- url: https://api.duvo.ai
  description: Production server
tags:
- name: Automations
  description: List and manage automations — the workspace container that groups the agents and queues making up one end-to-end process
paths:
  /v2/revisions/{build_id}/accept:
    post:
      operationId: acceptRevisionGeneration
      tags:
      - Automations
      description: Accept the reviewed generated configuration and complete the builder run. The saved draft is not activated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                builder_run_id:
                  type: string
                  format: uuid
                  description: The builder run returned by generation or status, belonging to this revision.
                expected_started_at:
                  description: Copy started_at from the status being reviewed. Each prompt has its own builder run ID; stale review identities return 409.
                  type:
                  - string
                  - 'null'
                  format: date-time
              required:
              - builder_run_id
              - expected_started_at
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: build_id
        required: true
        description: The revision identifier.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  builder_run:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        enum:
                        - not_started
                        - running
                        - completed
                        - failed
                        - cancelled
                        - waiting_for_input
                        - waiting_for_approve
                      build_id:
                        type: string
                      started_at:
                        type:
                        - string
                        - 'null'
                      completed_at:
                        type:
                        - string
                        - 'null'
                      checkpoint_config:
                        anyOf:
                        - type: object
                          properties:
                            version:
                              type: string
                              enum:
                              - v1
                              description: Schema version discriminator — must be "v1" for the current code-step schema
                            data:
                              type: object
                              properties:
                                language:
                                  type: string
                                  enum:
                                  - python
                                  description: Language the step's program is written in
                                source:
                                  oneOf:
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - inline
                                      code:
                                        type: string
                                        minLength: 1
                                        description: Program held in the build config. Written to `main.py` and run with `python main.py`.
                                    required:
                                    - kind
                                    - code
                                    additionalProperties: false
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                        - files
                                      startCommand:
                                        type: string
                                        minLength: 1
                                        maxLength: 2000
                                        description: Command run from the root of the step's file system, e.g. "python main.py".
                                      bundle:
                                        description: The program's files, as a content-addressed manifest
                                        type: object
                                        properties:
                                          bucket:
                                            type: string
                                            minLength: 1
                                            description: GCS bucket the bundle's blobs are stored in
                                          files:
                                            maxItems: 200
                                            type: array
                                            items:
                                              type: object
                                              properties:
                                                path:
                                                  type: string
                                                  minLength: 1
                                                  description: Path the file is materialised at, relative to the work dir
                                                sha256:
                                                  type: string
                                                  minLength: 64
                                                  maxLength: 64
                                                  pattern: ^[0-9a-f]{64}$
                                                  description: Digest of the file's bytes, and the key its blob is stored at
                                                sizeBytes:
                                                  type: integer
                                                  minimum: 0
                                                  maximum: 131072
                                                  description: UTF-8 byte length of the file's contents
                                              required:
                                              - path
                                              - sha256
                                              - sizeBytes
                                              additionalProperties: false
                                            description: The program's files, one manifest entry each
                                        required:
                                        - bucket
                                        - files
                                        additionalProperties: false
                                    required:
                                    - kind
                                    - startCommand
                                    additionalProperties: false
                                  description: Where the step's program comes from
                                files:
                                  default: []
                                  description: Team file paths this step can read at run time
                                  type:
                                  - array
                                  - 'null'
                                  items:
                                    type: string
                                timeoutMs:
                                  default: 600000
                                  description: Wall-clock budget for one execution of the step
                                  type: integer
                                  maximum: 3600000
                                handoverRequired:
                                  default: false
                                  description: When the step declares handover options, whether a run that exits cleanly without requesting one fails. Ignored when the step declares no options.
                                  type: boolean
                                maxConcurrency:
                                  description: Most runs of this step that may be in flight at once on one queue, on top of the queue's own concurrency. Absent means only the queue's limit applies. Every claim enforces it; only cases handed to the step (handover, postpone, reprocess) are also kept out of the queue's free slots while the step is full. Cases a trigger or a revision route sends straight to a capped step can still take queue slots and wait there, delaying other steps on the same queue.
                                  type: integer
                                  maximum: 1000
                              required:
                              - language
                              - source
                              - files
                              - timeoutMs
                              - handoverRequired
                              additionalProperties: false
                              description: Code step configuration payload
                          required:
                          - version
