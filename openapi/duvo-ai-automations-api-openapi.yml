                                          type:
                                          - string
                                          - 'null'
                                          enum:
                                          - message
                                      required:
                                      - role
                                      - content
                                      additionalProperties: false
                                text:
                                  type:
                                  - object
                                  - 'null'
                                  properties:
                                    format:
                                      anyOf:
                                      - type: object
                                        properties:
                                          type:
                                            type: string
                                            enum:
                                            - text
                                        required:
                                        - type
                                        additionalProperties: false
                                      - type: object
                                        properties:
                                          type:
                                            type: string
                                            enum:
                                            - json_object
