                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      summary: Read Automation Dashboard Data
  /v2/automations/{automation_id}/process-roles:
    get:
      operationId: listProcessRoles
      tags:
      - Automations
      description: 'List the process roles of an automation (Operator, Executive, Approver and the like, defined on that one automation, not the team''s Admin/Member/Builder roles) with what each can do and who holds it. Answer "who can see X", "who has which role" and "what does each role see" on an automation from this, not from team membership or dashboard sharing. Each role has its `key` (pass it to assignProcessMember), `label`, `can_act_on_cases`, `can_view_manage`, the `dashboards` it opens, its `members` and its `pending_invites`. `dashboards_shared_individually` are pinned dashboards a role alone does not open: say they must be shared with the person too. `dashboards_creator_only` read a live Connection and open only for their creator. When `roster.complete` is false the lists were cut off: say so, give the totals, and point to the People tab (`urls.people`) instead of saying who holds a role. Give the user the full `url`s, not the paths. Managers and above only.'
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: automation_id
        required: true
        description: Automation ID
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  process_roles:
                    type: object
                    properties:
                      automation:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The automation
                          name:
                            type: string
                            description: The automation's name
                        required:
                        - id
                        - name
                        additionalProperties: false
                        description: The automation these roles belong to
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: Pass to assignProcessMember as `role_key`, never the label
                            label:
                              type: string
                              description: The role's name as the People tab shows it
                            can_act_on_cases:
                              type: boolean
                              description: Opens and acts on the Cases behind its dashboards
                            can_view_manage:
                              type: boolean
                              description: Sees the automation's Manage section
                            sees_all_dashboards:
                              type: boolean
                              description: Opens every dashboard the automation pins
                            dashboards:
                              type: array
                              items:
                                type: object
                                properties:
                                  artifact_id:
                                    type: string
                                    format: uuid
                                    description: The dashboard
                                  name:
                                    type: string
                                    description: The dashboard's tab label
                                  link:
                                    type: string
                                    description: Root-relative path of the dashboard's tab
                                  url:
                                    type: string
                                    description: The dashboard's tab as a full web-app URL
                                required:
                                - artifact_id
                                - name
                                - link
                                - url
                                additionalProperties: false
                              description: The dashboards this role opens
                            members:
                              type: array
