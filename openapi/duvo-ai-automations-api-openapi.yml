                                id:
                                  type: string
                                  format: uuid
                                  description: The note
                                title:
                                  type: string
                                  description: The note's title
                                note:
                                  type: string
                                  description: What the note says
                                rationale:
                                  description: The interview's own words; null below the role that may read them
                                  type:
                                  - string
                                  - 'null'
                                source:
                                  type: string
                                  description: Where the note came from
                                interviewee:
                                  description: Who said it; null below the role that may read it
                                  type:
                                  - string
                                  - 'null'
                              required:
