  /v2/notifications/{id}/dismiss:
    patch:
      operationId: dismissNotification
      tags:
      - Notifications
      description: 'Dismiss an important notification for the authenticated user. A row pinned to their Important section is unpinned and the card stays, because the connection is still broken; a row that is not pinned for them — one they cannot reconnect themselves — is removed from their feed instead, matching what the card''s Dismiss button does. Only important notifications (currently: connection_broken) can be dismissed. Idempotent. Requires the Notification Center feature; returns 404 when it is not enabled for the team.'
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
        description: The notification's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
