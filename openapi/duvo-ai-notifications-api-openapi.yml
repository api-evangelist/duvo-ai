      summary: Get Notification Feed
  /v2/teams/{teamId}/notifications/batches/{id}:
    get:
      operationId: getNotificationBatch
      tags:
      - Notifications
      description: Get a single notification batch by id for the authenticated user, with per-type live-member counts, unread count, and worst severity. Serves cold deep links and sidebar retention for batches the caller can no longer see in the feed. Counts every live member by default; the optional type/severity/minSeverity filters narrow them to matching members only, exactly as the feed narrows a batch row it returns under the same filters. Requires the Notification Center feature; returns 404 when it is not enabled for the team, the batch does not exist, it belongs to another recipient/team, or no live member matches the given filters.
      parameters:
      - schema:
          type: string
          enum:
          - connection_broken
          - case_failed
          - critical_case_issue
          - case_issue
          - critical_eval_issue
          - eval_issue
          - job_issue
          - job_done
          - background_job
          - schedule_issue
          - config_proposal
        in: query
        name: type
        required: false
        description: Count only live members of this type. Omit to count every live member.
      - schema:
          type: string
          enum:
          - info
          - warning
          - critical
          - success
        in: query
        name: severity
        required: false
        description: 'Count only live members with exactly this severity. Mutually exclusive with minSeverity. One of: info, warning, critical, success.'
      - schema:
          type: string
          enum:
          - info
          - warning
          - critical
          - success
        in: query
        name: minSeverity
        required: false
        description: 'Count only live members at or above this urgency. Least to most urgent: success < info < warning < critical. Mutually exclusive with severity.'
      - schema:
          type: string
          enum:
          - mine
        in: query
        name: agents
        required: false
        description: When 'mine', 404 unless the batch's agent is one the authenticated user created. Pass it alongside the feed's My agents filter so a retained batch cannot come back narrowed on type and severity but not on ownership.
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
        description: The notification batch's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  agentId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  agentName:
                    type:
                    - string
                    - 'null'
                  agentType:
                    default: null
                    type:
                    - string
                    - 'null'
                    enum:
                    - agent
                    - code
                    description: 'Flavour of the step: "agent" for an agentic step, "code" for a deterministic code step. Fixed at creation — a step''s builds all belong to the matching config family.'
                  queueId:
                    default: null
                    type:
                    - string
                    - 'null'
                    format: uuid
                  queueName:
                    default: null
                    type:
                    - string
                    - 'null'
                  teamId:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                  lastEventAt:
                    type: string
                  closedAt:
                    type:
                    - string
                    - 'null'
                  typeCounts:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: Notification kind. New kinds are added over time.
                          x-extensible-enum:
                          - connection_broken
                          - case_failed
                          - critical_case_issue
                          - case_issue
                          - critical_eval_issue
                          - eval_issue
                          - job_issue
                          - job_done
                          - background_job
                          - schedule_issue
                          - config_proposal
                        total:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        unread:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                      required:
                      - type
                      - total
                      - unread
                      additionalProperties: false
                  severityCounts:
                    default: []
                    type: array
                    items:
                      type: object
                      properties:
                        severity:
                          type: string
                          enum:
                          - info
                          - warning
                          - critical
                          - success
                        total:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        unread:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                      required:
                      - severity
                      - total
                      - unread
                      additionalProperties: false
                  unreadCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  worstSeverity:
                    type: string
                    enum:
                    - info
                    - warning
                    - critical
                    - success
                required:
                - id
                - agentId
                - agentName
                - agentType
                - queueId
                - queueName
                - teamId
                - createdAt
                - lastEventAt
                - closedAt
                - typeCounts
                - severityCounts
                - unreadCount
                - worstSeverity
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                - error
