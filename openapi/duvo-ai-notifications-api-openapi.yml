  /v2/teams/{teamId}/notifications/feed:
    get:
      operationId: getNotificationFeed
      tags:
      - Notifications
      description: List the notification feed for the authenticated user's current team, most recent activity first. Each item is either an individual notification or a notification batch (a per-agent group of job_issue/eval_issue/job_done/schedule_issue notifications). Filter with type, unread, and either severity (exact match) or minSeverity (threshold; the two are mutually exclusive); paginate with limit/cursor. Either severity filter also narrows a surfaced batch's counts to its qualifying members, and hides a batch with no qualifying live member. The feed is eventually consistent — a batch's counts can lag a concurrent write by one page fetch. Requires the Notification Center feature; returns 404 when it is not enabled for the team.
      parameters:
      - schema:
          type: string
          enum:
          - connection_broken
          - case_failed
          - critical_case_issue
          - case_issue
          - critical_eval_issue
          - eval_issue
          - job_issue
          - job_done
          - background_job
          - schedule_issue
          - config_proposal
        in: query
        name: type
        required: false
        description: Only return individual notifications of this type and batches with at least one live member of it.
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: unread
        required: false
        description: If true, only return unread individual notifications and batches with at least one unread live member.
      - schema:
          type: string
          enum:
          - info
          - warning
          - critical
          - success
        in: query
        name: severity
        required: false
        description: 'Only return individual notifications with exactly this severity, and batches with at least one live member of it. A batch''s counts then describe only those members. Mutually exclusive with minSeverity. One of: info, warning, critical, success.'
      - schema:
          type: string
          enum:
          - info
          - warning
          - critical
          - success
        in: query
        name: minSeverity
        required: false
        description: 'Only return individual notifications at or above this urgency, and batches with at least one live member at or above it. A batch''s counts and worst severity then describe only its members at or above the threshold. Least to most urgent: success < info < warning < critical. Mutually exclusive with severity.'
      - schema:
          type: string
          enum:
          - mine
        in: query
        name: agents
        required: false
        description: 'When ''mine'', only return notifications for agents the authenticated user created. connection_broken notifications are always returned regardless, because they are not about an agent: a broken connection is only notified to the people who can act on it or escalate it, so filtering by agent authorship would hide it from the reader it was addressed to.'
      - schema:
          default: 30
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
      - schema:
          type: string
        in: query
        name: cursor
        required: false
      - schema:
          type: string
        in: path
        name: teamId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - batch
                          batch:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              agentId:
                                type:
                                - string
                                - 'null'
                                format: uuid
                              agentName:
                                type:
                                - string
                                - 'null'
                              agentType:
                                default: null
                                type:
                                - string
                                - 'null'
                                enum:
                                - agent
                                - code
                                description: 'Flavour of the step: "agent" for an agentic step, "code" for a deterministic code step. Fixed at creation — a step''s builds all belong to the matching config family.'
                              queueId:
                                default: null
                                type:
                                - string
                                - 'null'
                                format: uuid
                              queueName:
                                default: null
                                type:
                                - string
                                - 'null'
                              teamId:
                                type: string
                                format: uuid
                              createdAt:
                                type: string
                              lastEventAt:
                                type: string
                              closedAt:
                                type:
                                - string
                                - 'null'
                              typeCounts:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      description: Notification kind. New kinds are added over time.
                                      x-extensible-enum:
                                      - connection_broken
                                      - case_failed
                                      - critical_case_issue
                                      - case_issue
                                      - critical_eval_issue
                                      - eval_issue
                                      - job_issue
                                      - job_done
                                      - background_job
                                      - schedule_issue
                                      - config_proposal
                                    total:
                                      type: integer
                                      minimum: 0
                                      maximum: 9007199254740991
                                    unread:
                                      type: integer
                                      minimum: 0
                                      maximum: 9007199254740991
                                  required:
                                  - type
                                  - total
                                  - unread
                                  additionalProperties: false
                              severityCounts:
                                default: []
                                type: array
                                items:
                                  type: object
                                  properties:
                                    severity:
                                      type: string
                                      enum:
                                      - info
                                      - warning
                                      - critical
                                      - success
                                    total:
                                      type: integer
                                      minimum: 0
                                      maximum: 9007199254740991
                                    unread:
