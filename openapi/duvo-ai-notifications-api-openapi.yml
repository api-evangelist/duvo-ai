  /v2/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags:
      - Notifications
      description: Mark a notification as read for the authenticated user. Idempotent — calling it again on an already-read notification still returns success. Pass `openedFrom` to record which channel the reader came through (`in_app` when they were already in Duvo, or `email`/`slack`/`teams` from the `notificationSource` param on an external link); omit it when the read is not somebody opening the notification. Requires the Notification Center feature; returns 404 when it is not enabled for the team.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                openedFrom:
                  type: string
                  enum:
                  - in_app
                  - email
                  - slack
                  - teams
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
        description: The notification's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                - success
                additionalProperties: false
        '400':
          description: Default Response
          content:
