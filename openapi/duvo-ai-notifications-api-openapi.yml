      summary: Get Notification Batch
  /v2/teams/{teamId}/notifications/batches/{id}/read:
    post:
      operationId: markNotificationBatchRead
      tags:
      - Notifications
      description: 'Mark every unread live member of a notification batch as read for the authenticated user. Pass `types` to narrow the mark-read to those member types, and `severity` (exact) or `minSeverity` (threshold, mutually exclusive with `severity`) to narrow it by urgency — e.g. the page''s active filters; omit them to mark every live member. Narrowing matters when the batch card was rendered under a filter: the rows marked read should be the rows the card counted. Pass `openedFrom` to record which channel the reader came through, on every member this call marks read. Returns the count of members that were updated. Requires the Notification Center feature; returns 404 when it is not enabled for the team or the batch does not exist or belongs to another recipient/team.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                types:
                  minItems: 1
                  maxItems: 11
                  type: array
                  items:
                    type: string
                    enum:
                    - connection_broken
                    - case_failed
                    - critical_case_issue
                    - case_issue
                    - critical_eval_issue
                    - eval_issue
                    - job_issue
                    - job_done
                    - background_job
                    - schedule_issue
                    - config_proposal
                severity:
                  type: string
                  enum:
                  - info
                  - warning
                  - critical
                  - success
                minSeverity:
                  type: string
                  enum:
                  - info
                  - warning
                  - critical
                  - success
                openedFrom:
                  type: string
                  enum:
                  - in_app
                  - email
                  - slack
                  - teams
      parameters:
      - schema:
          type: string
          format: uuid
        in: path
        name: id
        required: true
        description: The notification batch's unique identifier
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - count
                additionalProperties: false
        '400':
