  /v2/teams/{teamId}/notifications/counts:
    get:
      operationId: getNotificationCounts
      tags:
      - Notifications
      description: Per-type notification counts for the authenticated user's current team. Narrow with `unread`, `important`, and with either `severity` (counts only that exact severity) or `minSeverity` (counts that urgency and above) — the two are mutually exclusive and a request carrying both is rejected with 400. Pass the same filters the feed is showing, so the counts describe the list the reader would land on. Requires the Notification Center feature; returns 404 when it is not enabled for the team.
      parameters:
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: unread
        required: false
        description: If true, only count unread notifications.
      - schema:
          type: string
          enum:
          - info
          - warning
          - critical
          - success
        in: query
        name: severity
        required: false
        description: Only count notifications with exactly this severity, so the counts match a feed filtered the same way. Mutually exclusive with minSeverity.
      - schema:
          type: string
          enum:
          - info
          - warning
          - critical
          - success
        in: query
        name: minSeverity
        required: false
        description: 'Only count notifications at or above this urgency, so the counts match a feed filtered the same way. Least to most urgent: success < info < warning < critical. Mutually exclusive with severity.'
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: important
        required: false
        description: 'If true, only count notifications pinned to Important for you: unresolved, undismissed connection_broken rows you can reconnect yourself. Use it to size the sidebar alert without paging the list.'
      - schema:
          type: string
          enum:
          - mine
        in: query
        name: agents
        required: false
        description: When 'mine', only count notifications for agents the authenticated user created (plus connection_broken, which is always counted), so the counts match a feed filtered the same way.
      - schema:
          type: string
        in: path
        name: teamId
        required: true
