  /v2/teams/{teamId}/notifications:
    get:
      operationId: listNotifications
      tags:
      - Notifications
      description: List notifications for the authenticated user's current team, most recent first. Filter with type, unread, severity or minSeverity (mutually exclusive), important, agentRunId, or processId; paginate with limit/cursor. Pass batchId to list only the live members of a notification batch, optionally ordered by sort=importance (only valid together with batchId). Requires the Notification Center feature; returns 404 when it is not enabled for the team.
      parameters:
      - schema:
          type: string
          enum:
          - connection_broken
          - case_failed
          - critical_case_issue
          - case_issue
          - critical_eval_issue
          - eval_issue
          - job_issue
          - job_done
          - background_job
          - schedule_issue
          - config_proposal
        in: query
        name: type
        required: false
        description: 'Only return notifications of this type. One of: connection_broken, case_failed, critical_case_issue, case_issue, critical_eval_issue, eval_issue, job_issue, job_done, background_job, schedule_issue, config_proposal.'
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: unread
        required: false
        description: If true, only return unread notifications.
      - schema:
          type: string
          enum:
          - info
          - warning
          - critical
          - success
        in: query
        name: severity
        required: false
        description: 'Only return notifications with this severity. One of: info, warning, critical, success.'
      - schema:
          type: string
          enum:
          - info
          - warning
          - critical
          - success
        in: query
        name: minSeverity
        required: false
        description: 'Only return notifications at or above this urgency. Least to most urgent: success < info < warning < critical. Mutually exclusive with severity.'
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: important
        required: false
        description: 'If true, only return important notifications: unresolved connection_broken rows pinned until reconnected, removed, or dismissed.'
      - schema:
          type: string
          format: uuid
        in: query
        name: agentRunId
        required: false
        description: Only return notifications about this agent run.
      - schema:
          type: string
          minLength: 1
        in: query
        name: processId
        required: false
        description: Only return notifications about this Clarity process.
      - schema:
          type: string
          format: uuid
        in: query
        name: batchId
        required: false
        description: Only return live members of this notification batch.
      - schema:
          default: recency
          type: string
          enum:
          - recency
          - importance
        in: query
        name: sort
        required: false
        description: importance orders by type importance then severity (only valid together with batchId); default recency.
      - schema:
          default: 30
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Number of notifications per page (1-100, default 30).
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Opaque cursor from the previous page's nextCursor. Omit for the first page.
      - schema:
          type: string
        in: path
        name: teamId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      anyOf:
                      - oneOf:
                        - type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            recipientUserId:
                              type: string
                              format: uuid
                            teamId:
                              anyOf:
                              - type: string
                                format: uuid
                              - type: 'null'
                            batchId:
                              default: null
                              anyOf:
                              - type: string
                                format: uuid
                              - type: 'null'
                            severity:
                              type: string
                              enum:
                              - info
                              - warning
                              - critical
                              - success
                            title:
                              type: string
